<head>
<script>
  document.documentElement.style.visibility = 'hidden';
  fetch('./api/auth-api.php?action=me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => {
      if (!res.ok) throw new Error();
      window.__APSA_USER = res.data;
      document.documentElement.style.visibility = 'visible';
    })
    .catch(() => {
      location.replace('./login.html?next=' + encodeURIComponent(location.pathname + location.search));
      return;
    })
    .then(() => { if (window.__APSA_USER) window.dispatchEvent(new Event('apsa-auth-ready')); });
</script>

<style>
  :root { --neon: var(--accent); --muted: var(--text2); }

  body { margin: 0; color: var(--text); font-family: var(--font-body); }

  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 26px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 40; background: rgba(0,0,0,.86); backdrop-filter: blur(8px);
  }
  header .logo img { height: 22px; display: block; }
  .back-btn {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text2); text-decoration: none; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px;
  }
  .back-btn:hover { color: var(--accent); border-color: var(--border-hover); }

  .wrap { max-width: min(90vw, 1560px); margin: 0 auto; padding: 0 20px 60px; }

  .page-head { max-width: min(90vw, 1560px); margin: 26px auto 18px; padding: 0 20px;
               display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; }
  .page-head h1 { font-family: var(--font-display); font-size: 30px; font-weight: 900;
                  letter-spacing: 2px; text-transform: uppercase; margin: 0 0 6px; }
  .page-head p  { margin: 0; color: var(--text2); font-size: 13px; }
  .page-head .sp { flex: 1 1 auto; }

  .srch { position: relative; min-width: 280px; }
  .srch input {
    width: 100%; background: var(--bg2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 14px 10px 36px; font: inherit; font-size: 13.5px;
  }
  .srch input:focus { outline: none; border-color: var(--accent); }
  .srch svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .5; }

  .ptabs { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
  .ptab {
    background: var(--bg2); border: 1px solid var(--border); color: var(--text2);
    border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 12.5px; font-weight: 700;
    cursor: pointer; letter-spacing: .3px;
  }
  .ptab:hover { color: var(--text); border-color: var(--border-hover); }
  .ptab.on { background: var(--accent); border-color: var(--accent); color: #0b0b0b; }
  .ptab .n { opacity: .6; margin-left: 6px; font-weight: 600; }
  .ptabs .sp { flex: 1 1 auto; }

  .btn {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  .btn:hover { border-color: var(--border-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0b0b; }
  .btn.sm { padding: 5px 10px; font-size: 11.5px; border-radius: 8px; }
  .btn.danger { color: #ff6b6b; }

  .pgrid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 900px) { .pgrid { grid-template-columns: 1fr; } }

  .plist { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .plist .ph { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .plist .ph b { font-family: var(--font-display); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .plist .ph div { color: var(--text2); font-size: 12px; margin-top: 4px; line-height: 1.5; }

  .pitem { display: block; width: 100%; text-align: left; background: none; border: 0;
           border-bottom: 1px solid var(--border); padding: 13px 16px; cursor: pointer; color: var(--text); font: inherit; }
  .pitem:last-child { border-bottom: 0; }
  .pitem:hover { background: rgba(255,255,255,.03); }
  .pitem.on { background: rgba(223,242,13,.09); box-shadow: inset 3px 0 0 var(--accent); }
  .pitem .t { font-weight: 700; font-size: 13.5px; line-height: 1.35; }
  .pitem .s { color: var(--text2); font-size: 11.5px; margin-top: 5px; line-height: 1.55;
              display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pitem .m { color: var(--text3); font-size: 10.5px; margin-top: 6px; letter-spacing: .3px; }
  .pin { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .5px; margin-right: 6px; }
  .off { color: #ff6b6b; font-size: 10px; font-weight: 800; letter-spacing: .5px; margin-right: 6px; }

  .pread { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 30px 34px; min-height: 380px; }
  .pread .rh { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 6px; }
  .pread h2.rt { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: .6px;
                 margin: 0; flex: 1 1 auto; line-height: 1.3; }
  .pread .rm { color: var(--text3); font-size: 11.5px; margin-bottom: 22px; letter-spacing: .3px; }

  .doc { font-size: 14px; line-height: 1.85; color: #e6e6e6; }
  .doc h1, .doc h2, .doc h3 { font-family: var(--font-display); color: var(--text); letter-spacing: .4px; }
  .doc h1 { font-size: 19px; margin: 30px 0 10px; }
  .doc h2 { font-size: 16px; margin: 28px 0 10px; }
  .doc h3 { font-size: 14px; margin: 22px 0 8px; }
  .doc h2:first-child, .doc h1:first-child { margin-top: 0; }
  .doc p { margin: 0 0 14px; }
  .doc ul, .doc ol { margin: 0 0 14px; padding-left: 22px; }
  .doc li { margin-bottom: 7px; }
  .doc b, .doc strong { color: #fff; }
  .doc a { color: var(--accent); }
  .doc blockquote { margin: 0 0 14px; padding: 10px 16px; border-left: 3px solid var(--accent);
                    background: rgba(223,242,13,.06); border-radius: 0 8px 8px 0; }
  .doc table { border-collapse: collapse; width: 100%; margin: 0 0 16px; font-size: 13px; }
  .doc th, .doc td { border: 1px solid var(--border); padding: 8px 11px; text-align: left; }
  .doc th { background: rgba(255,255,255,.04); font-weight: 700; }
  .doc img { max-width: 100%; border-radius: 8px; }
  .doc code { background: var(--bg3); padding: 2px 6px; border-radius: 5px; font-size: 12.5px; }

  .empty { text-align: center; color: var(--text3); padding: 54px 20px; font-size: 13.5px; }

  /* modal */
  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(3px);
          display: none; align-items: flex-start; justify-content: center; z-index: 200; padding: 28px 16px; overflow-y: auto; }
  .mask.on { display: flex; }
  .modal { background: #131313; border: 1px solid var(--border); border-radius: 18px; padding: 30px;
           width: 100%; max-width: 880px; box-shadow: 0 30px 90px rgba(0,0,0,.7); }
  .modal h2 { font-family: var(--font-display); font-size: 19px; font-weight: 800; letter-spacing: .8px;
              text-transform: uppercase; margin: 0 0 20px; }
  .modal label { display: block; font-size: 11px; font-weight: 800; letter-spacing: 1.1px;
                 text-transform: uppercase; color: var(--text2); margin: 16px 0 7px; }
  .modal form > label:first-of-type { margin-top: 0; }
  .modal input[type=text], .modal input[type=number], .modal textarea, .modal select {
    width: 100%; background: #0b0b0b; border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 9px 12px; font: inherit; font-size: 13.5px; box-sizing: border-box;
  }
  .modal input:focus, .modal textarea:focus, .modal select:focus { outline: none; border-color: var(--accent); }
  .modal textarea { min-height: 66px; resize: vertical; }
  .mrow { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .mact { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  .ck { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text2); cursor: pointer; }

  .etb { display: flex; gap: 5px; flex-wrap: wrap; background: #0b0b0b;
         border: 1px solid var(--border); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 7px 8px; }
  .etb button { background: var(--bg3); border: 1px solid var(--border); color: var(--text2);
                border-radius: 7px; padding: 4px 9px; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer; }
  .etb button:hover { color: var(--accent); border-color: var(--border-hover); }
  #eBody { background: #0b0b0b; border: 1px solid var(--border); border-radius: 0 0 10px 10px;
           padding: 18px 20px; min-height: 300px; max-height: 52vh; overflow-y: auto; font-size: 14px; line-height: 1.8; }
  #eBody:focus { outline: none; border-color: var(--accent); }

  .secrow { display: grid; grid-template-columns: 1fr 110px 90px 76px; gap: 10px; align-items: center;
            padding: 10px 0; border-bottom: 1px solid var(--border); }
  .secrow:last-of-type { border-bottom: 0; }
  .secrow input[type=text], .secrow input[type=number] { padding: 7px 10px; font-size: 12.5px; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
           background: #131313; border: 1px solid var(--border); color: var(--text);
           border-radius: 12px; padding: 11px 20px; font-size: 13px; z-index: 400;
           box-shadow: 0 16px 50px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .18s; }
  .toast.on { opacity: 1; }
  .toast.bad { border-color: rgba(255,107,107,.5); color: #ff9b9b; }
</style>
</head>
<body>

  <a class="back-btn" href="./index.html">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Trang chủ
  </a>
</header>

<div class="page-head">
  <div>
    <h1>Policy công ty</h1>

        <button type="button" onclick="ex('formatBlock','<blockquote>')">Trích dẫn</button>

        <button type="button" class="btn" onclick="closeModal()">Đóng</button>

</div>

<!-- quản lý mục -->
<div class="mask" id="mSec">
  <div class="modal" style="max-width:720px">
    <h2>Quản lý mục</h2>
    <div id="secBox"></div>
    <div class="mact">
      <button type="button" class="btn" style="margin-right:auto" onclick="addSecRow()">+ Thêm mục</button>
      <button type="button" class="btn" onclick="closeModal()">Đóng</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API   = './api/policy-api.php';
let SECS    = [];
let CURSEC  = 0;
let CURDOC  = 0;
let DOCS    = [];
let ADMIN   = false;
let SEARCH  = '';

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function dmy(s) {
  if (!s) return '';
  const p = String(s).slice(0, 10).split('-');
  return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : String(s);
}
let toastT = null;
function toast(msg, bad) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => { el.className = 'toast'; }, 3200);
}
async function api(action, opt) {
  opt = opt || {};
  const url = API + '?action=' + action + (opt.qs || '');
  const cfg = { credentials: 'same-origin' };
  if (opt.body) {
    cfg.method = 'POST';
    cfg.headers = { 'Content-Type': 'application/json' };
    cfg.body = JSON.stringify(opt.body);
  }
  const r = await fetch(url, cfg);
  let j = null;
  try { j = await r.json(); } catch (e) { throw new Error('Máy chủ trả về dữ liệu không hợp lệ.'); }
  if (!r.ok || !j.ok) throw new Error(j && j.error ? j.error : 'Có lỗi xảy ra.');
  return j;
}

/* ── mục ── */
async function loadTree() {
  const j = await api('tree');
  SECS  = j.sections;
  ADMIN = !!j.admin;
  paintTabs();
  if (!CURSEC && SECS.length) CURSEC = SECS[0].id;
  await loadDocs();
}
function paintTabs() {
  const t = document.getElementById('tabs');
  let h = SECS.map(s =>
    '<button class="ptab' + (s.id === CURSEC && !SEARCH ? ' on' : '') + '" onclick="pickSec(' + s.id + ')">' +
      esc(s.name) + '<span class="n">' + s.docs + '</span>' +
    '</button>'
  ).join('');
  h += '<div class="sp"></div>';
  if (ADMIN) {
    h += '<button class="btn" onclick="openSecs()">Quản lý mục</button>' +
         '<button class="btn primary" onclick="newDoc()">+ Tài liệu mới</button>';
  }
  t.innerHTML = h;
}
function pickSec(id) { SEARCH = ''; document.getElementById('q').value = ''; CURSEC = id; CURDOC = 0; paintTabs(); loadDocs(); }

/* ── danh sách bài ── */
async function loadDocs() {
  const box = document.getElementById('list');
  box.innerHTML = '<div class="empty">Đang tải…</div>';
  try {
    const j = await api('docs', { qs: '&section=' + CURSEC });
    DOCS = j.docs;
    paintList();
    if (DOCS.length) openDoc(DOCS[0].id); else paintRead(null);
  } catch (e) {
    box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}
function paintList() {
  const s = SECS.filter(x => x.id === CURSEC)[0];
  const box = document.getElementById('list');
  let h = '';
  if (s) h += '<div class="ph"><b>' + esc(s.name) + '</b><div>' + esc(s.blurb) + '</div></div>';
  if (!DOCS.length) {
    h += '<div class="empty">Mục này chưa có tài liệu.</div>';
  } else {
    h += DOCS.map(d =>
      '<button class="pitem' + (d.id === CURDOC ? ' on' : '') + '" onclick="openDoc(' + d.id + ')">' +
        '<div class="t">' + (d.pinned ? '<span class="pin">GHIM</span>' : '') +
          (d.active ? '' : '<span class="off">ẨN</span>') + esc(d.title) + '</div>' +
        (d.summary ? '<div class="s">' + esc(d.summary) + '</div>' : '') +
        '<div class="m">Cập nhật ' + dmy(d.updated_at) + (d.author_name ? ' · ' + esc(d.author_name) : '') + '</div>' +
      '</button>'
    ).join('');
  }
  box.innerHTML = h;
}

/* ── đọc ── */
async function openDoc(id) {
  CURDOC = id;
  paintList();
  const box = document.getElementById('read');
  box.innerHTML = '<div class="empty">Đang tải…</div>';
  try {
    const j = await api('doc', { qs: '&id=' + id });
    paintRead(j.doc);
  } catch (e) {
    box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}
function paintRead(d) {
  const box = document.getElementById('read');
  if (!d) { box.innerHTML = '<div class="empty">Mục này chưa có tài liệu nào.</div>'; return; }
  box.innerHTML =
    '<div class="rh"><h2 class="rt">' + esc(d.title) + '</h2>' +
      (ADMIN ? '<button class="btn sm" onclick="editDoc(' + d.id + ')">Sửa</button>' : '') +
    '</div>' +
    '<div class="rm">Cập nhật ' + dmy(d.updated_at) + (d.author_name ? ' · ' + esc(d.author_name) : '') + '</div>' +
    '<div class="doc">' + (d.body || '<p style="color:var(--text3)">Tài liệu này chưa có nội dung.</p>') + '</div>';
}

/* ── tìm kiếm ── */
let qT = null;
document.getElementById('q').addEventListener('input', function () {
  clearTimeout(qT);
  const v = this.value.trim();
  qT = setTimeout(() => runSearch(v), 260);
});
async function runSearch(v) {
  SEARCH = v;
  if (v === '') { paintTabs(); loadDocs(); return; }
  paintTabs();
  const box = document.getElementById('list');
  box.innerHTML = '<div class="empty">Đang tìm…</div>';
  try {
    const j = await api('search', { qs: '&q=' + encodeURIComponent(v) });
    let h = '<div class="ph"><b>Kết quả</b><div>' + j.hits.length + ' tài liệu khớp “' + esc(v) + '”</div></div>';
    h += j.hits.length
      ? j.hits.map(x =>
          '<button class="pitem' + (x.id === CURDOC ? ' on' : '') + '" onclick="openDoc(' + x.id + ')">' +
            '<div class="t">' + esc(x.title) + '</div>' +
            '<div class="s">' + esc(x.snippet) + '</div>' +
            '<div class="m">' + esc(x.section_name) + '</div>' +
          '</button>').join('')
      : '<div class="empty">Không tìm thấy tài liệu nào.</div>';
    box.innerHTML = h;
  } catch (e) {
    box.innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
  }
}

/* ── soạn thảo (admin) ── */
function ex(cmd, val) { document.getElementById('eBody').focus(); document.execCommand(cmd, false, val || null); }
function mkLink() {
  const u = window.prompt('Dán đường dẫn:', 'https://');
  if (u) ex('createLink', u);
}
function secOptions(sel) {
  document.getElementById('eSec').innerHTML =
    SECS.map(s => '<option value="' + s.id + '"' + (s.id === sel ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('');
}
function newDoc() {
  CURDOC = 0;
  document.getElementById('docTitleH').textContent = 'Tài liệu mới';
  document.getElementById('eTitle').value = '';
  document.getElementById('eSum').value   = '';
  document.getElementById('eSort').value  = 0;
  document.getElementById('ePin').checked = false;
  document.getElementById('eAct').checked = true;
  document.getElementById('eBody').innerHTML = '';
  document.getElementById('eDel').style.display = 'none';
  secOptions(CURSEC);
  document.getElementById('mDoc').classList.add('on');
  document.getElementById('eTitle').focus();
}
let EDIT_ID = 0;
async function editDoc(id) {
  try {
    const j = await api('doc', { qs: '&id=' + id });
    const d = j.doc;
    EDIT_ID = d.id;
    document.getElementById('docTitleH').textContent = 'Sửa tài liệu';
    document.getElementById('eTitle').value = d.title;
    document.getElementById('eSum').value   = d.summary || '';
    document.getElementById('eSort').value  = d.sort;
    document.getElementById('ePin').checked = !!d.pinned;
    document.getElementById('eAct').checked = !!d.active;
    document.getElementById('eBody').innerHTML = d.body || '';
    document.getElementById('eDel').style.display = '';
    secOptions(d.section_id);
    document.getElementById('mDoc').classList.add('on');
  } catch (e) { toast(e.message, true); }
}
async function saveDoc(ev) {
  ev.preventDefault();
  const body = {
    id:         (document.getElementById('docTitleH').textContent === 'Sửa tài liệu') ? EDIT_ID : 0,
    section_id: parseInt(document.getElementById('eSec').value, 10),
    title:      document.getElementById('eTitle').value.trim(),
    summary:    document.getElementById('eSum').value.trim(),
    sort:       parseInt(document.getElementById('eSort').value, 10) || 0,
    pinned:     document.getElementById('ePin').checked,
    active:     document.getElementById('eAct').checked,
  };
  body.body = document.getElementById('eBody').innerHTML;
  try {
    const j = await api('doc-save', { body: body });
    toast(j.message);
    closeModal();
    CURSEC = body.section_id;
    await loadTree();
    openDoc(j.id);
  } catch (e) { toast(e.message, true); }
  return false;
}
async function delDoc() {
  if (!EDIT_ID) return;
  if (!window.confirm('Xoá hẳn tài liệu này?')) return;
  try {
    const j = await api('doc-delete', { body: { id: EDIT_ID } });
    toast(j.message);
    closeModal();
    CURDOC = 0;
    await loadTree();
  } catch (e) { toast(e.message, true); }
}

/* ── quản lý mục ── */
function openSecs() { paintSecs(); document.getElementById('mSec').classList.add('on'); }
function paintSecs() {
  const box = document.getElementById('secBox');
  box.innerHTML =
    '<div class="secrow" style="color:var(--text2);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase">' +
      '<div>Tên mục / mô tả</div><div>Thứ tự</div><div>Hiển thị</div><div></div></div>' +
    SECS.map(s =>
      '<div class="secrow" data-id="' + s.id + '">' +
        '<div><input type="text" class="s-name" value="' + esc(s.name) + '" />' +
          '<input type="text" class="s-blurb" value="' + esc(s.blurb) + '" style="margin-top:6px;font-size:11.5px" placeholder="Mô tả ngắn" /></div>' +
        '<div><input type="number" class="s-sort" value="' + s.sort + '" /></div>' +
        '<div><label class="ck"><input type="checkbox" class="s-act"' + (s.active ? ' checked' : '') + ' style="width:auto" /> Bật</label></div>' +
        '<div style="display:flex;gap:5px"><button type="button" class="btn sm" onclick="saveSec(this)">Lưu</button>' +
          '<button type="button" class="btn sm danger" onclick="delSec(' + s.id + ')">Xoá</button></div>' +
      '</div>').join('');
}
function addSecRow() {
  const box = document.getElementById('secBox');
  const d = document.createElement('div');
  d.className = 'secrow';
  d.setAttribute('data-id', '0');
  d.innerHTML =
    '<div><input type="text" class="s-name" placeholder="Tên mục mới" />' +
      '<input type="text" class="s-blurb" style="margin-top:6px;font-size:11.5px" placeholder="Mô tả ngắn" /></div>' +
    '<div><input type="number" class="s-sort" value="' + (SECS.length * 10 + 10) + '" /></div>' +
    '<div><label class="ck"><input type="checkbox" class="s-act" checked style="width:auto" /> Bật</label></div>' +
    '<div><button type="button" class="btn sm" onclick="saveSec(this)">Lưu</button></div>';
  box.appendChild(d);
}
async function saveSec(btn) {
  const row = btn.closest('.secrow');
  const body = {
    id:     parseInt(row.getAttribute('data-id'), 10) || 0,
    name:   row.querySelector('.s-name').value.trim(),
    blurb:  row.querySelector('.s-blurb').value.trim(),
    sort:   parseInt(row.querySelector('.s-sort').value, 10) || 0,
    active: row.querySelector('.s-act').checked,
  };
  try {
    const j = await api('section-save', { body: body });
    toast(j.message);
    await loadTree();
    paintSecs();
  } catch (e) { toast(e.message, true); }
}
async function delSec(id) {
  if (!window.confirm('Xoá mục này?')) return;
  try {
    const j = await api('section-delete', { body: { id: id } });
    toast(j.message);
    if (CURSEC === id) CURSEC = 0;
    await loadTree();
    paintSecs();
  } catch (e) { toast(e.message, true); }
}

/* ── chung ── */
function closeModal() { document.querySelectorAll('.mask').forEach(m => m.classList.remove('on')); }
document.querySelectorAll('.mask').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

(async function boot() {
  try { await loadTree(); }
  catch (e) { document.getElementById('list').innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; }
})();
</script>
</body>
</html>
