<!DOCTYPE html>
<html lang="vi">
<head>
<script>
  document.documentElement.style.visibility = 'hidden';
  fetch('./api/auth-api.php?action=me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => {
      if (!res.ok) throw new Error();
      window.__APSA_USER = res.data;
      document.documentElement.style.visibility = 'visible';
    })
    .catch(() => {
      location.replace('./login.html?next=' + encodeURIComponent(location.pathname + location.search));
    });
</script>
<meta charset="UTF-8" />
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=1">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=1">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#dff20d">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Làm việc — APSA</title>
<meta name="description" content="Trang làm việc APSA: danh sách dự án đang thực hiện, người phụ trách, phần việc, hạn chót và tiến độ." />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root{
  --bg:#000000; --bg2:#0b0b0b; --bg3:#141414;
  --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.18);
  --text:#ffffff; --text2:#9a9a9a; --text3:#5e5e5e;
  --accent:#dff20d; --accent2:#c9dd00; --accent-glow:rgba(223,242,13,.35);
  --green:#dff20d; --orange:#ffffff; --pink:#c9dd00; --cyan:#ffffff; --red:#ff4d4d; --yellow:#dff20d;
  --radius:14px;
}

body{
  font-family:'Oxanium', sans-serif; background:var(--bg); color:var(--text);
  min-height:100vh; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
}

/* ─── Header ─── */
header{
  position:sticky; top:0; z-index:100; height:56px; padding:0 20px;
  background:rgba(0,0,0,.85); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px;
}
.back{
  display:flex; align-items:center; gap:7px; text-decoration:none; color:var(--text2);
  font-size:13px; font-weight:600; padding:6px 12px; border-radius:20px;
  border:1px solid var(--border); transition:.2s; flex-shrink:0; white-space:nowrap;
}
.back:hover{ color:var(--text); border-color:var(--border-hover); background:var(--bg3); }
.page-title{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; flex-shrink:0; white-space:nowrap; }
.page-title .count{
  font-size:11px; font-weight:600; color:var(--text3); background:var(--bg3);
  border:1px solid var(--border); padding:2px 8px; border-radius:20px;
}
.header-search{ flex:1; max-width:320px; position:relative; }
.header-search svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text3); pointer-events:none; }
.search-input{
  width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:40px;
  padding:8px 14px 8px 36px; color:var(--text); font-size:13px; font-family:inherit; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.search-input::placeholder{ color:var(--text3); }
.search-input:focus{ border-color:rgba(223,242,13,.5); box-shadow:0 0 0 3px rgba(223,242,13,.1); }

.hbtn{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-family:inherit;
  font-size:12px; font-weight:600; padding:7px 14px; border-radius:20px;
  border:1px solid var(--border); background:transparent; color:var(--text2); transition:.2s; white-space:nowrap;
}
.hbtn:hover{ color:var(--text); border-color:var(--border-hover); background:var(--bg3); }
.hbtn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent;
  box-shadow:0 0 12px var(--accent-glow);
}
.hbtn.primary:hover{ transform:translateY(-1px); box-shadow:0 4px 20px var(--accent-glow); }

.who{
  display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text2);
  cursor:pointer; padding:5px 10px; border-radius:20px; border:1px solid var(--border); white-space:nowrap; flex-shrink:0;
}
.who:hover{ color:var(--text); background:var(--bg3); }
.avatar{
  width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:10px; font-weight:800; flex-shrink:0;
}


/* ─── Content ─── */
/* ─── Content ─── */
.wrap{ max-width:1500px; margin:0 auto; padding:16px 24px 80px; position:relative; z-index:1; }

.tbl-wrap{ overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); }

.act{
  width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid transparent; color:var(--text3); cursor:pointer; font-size:12px; transition:.15s;
}
.act:hover{ color:#fff; background:var(--accent); border-color:var(--accent); }
.act.del:hover{ background:var(--red); border-color:var(--red); }

.badge-pending{
  display:inline-block; margin-left:6px; font-size:9px; font-weight:700; letter-spacing:.3px;
  color:#eaff6b; background:rgba(223,242,13,.18); border:1px solid rgba(223,242,13,.4);
  padding:1px 6px; border-radius:10px; vertical-align:middle;
}

.empty{ text-align:center; padding:90px 24px; color:var(--text3); }
.empty .ico{ font-size:52px; margin-bottom:16px; }
.empty h3{ font-size:17px; color:var(--text2); font-weight:600; margin-bottom:8px; }
.empty p{ font-size:13px; line-height:1.7; max-width:420px; margin:0 auto; }

/* ─── Modal ─── */
.ov{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.78); backdrop-filter:blur(8px);
  z-index:300; align-items:center; justify-content:center; padding:24px; overflow-y:auto;
}
.ov.open{ display:flex; }
#nmOv, #cfOv{ z-index:700; }
.modal{
  background:var(--bg2); border:1px solid var(--border); border-radius:20px; padding:30px;
  width:100%; max-width:640px; position:relative; margin:auto;
}
.modal.narrow{ max-width:400px; }
.modal h2{ font-size:19px; font-weight:700; margin-bottom:6px; }
.modal .sub{ font-size:12.5px; color:var(--text2); margin-bottom:22px; }
.x{
  position:absolute; top:14px; right:14px; width:31px; height:31px; border-radius:50%;
  background:var(--bg3); border:1px solid var(--border); color:var(--text2); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:16px; transition:.2s;
}
.x:hover{ color:var(--text); background:var(--border); }

.fg{ margin-bottom:14px; }
.fg label{ display:block; font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
.fg input, .fg textarea, .fg select{
  width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:10px;
  padding:9px 13px; color:var(--text); font-size:13.5px; font-family:inherit; outline:none;
  transition:border-color .2s; resize:vertical;
}
.fg input:focus, .fg textarea:focus, .fg select:focus{ border-color:rgba(223,242,13,.5); }
.fg .hint{ font-size:11px; color:var(--text3); margin-top:5px; line-height:1.5; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.divider{ border-top:1px dashed var(--border); margin:18px 0; padding-top:4px; }
.divider-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); font-weight:700; margin-bottom:10px; }

.btn{
  width:100%; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:600;
  font-family:inherit; cursor:pointer; transition:.2s; margin-top:6px;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 0 20px var(--accent-glow);
}
.btn:hover{ transform:translateY(-1px); box-shadow:0 4px 24px var(--accent-glow); }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--text2); box-shadow:none; }
.btn.ghost:hover{ color:var(--text); border-color:var(--border-hover); background:var(--bg3); }
.btn.danger{ background:transparent; border:1px solid rgba(255,77,77,.4); color:#ff6b6b; box-shadow:none; }
.btn.danger:hover{ background:rgba(255,77,77,.12); border-color:var(--red); }

/* ─── Toast / progress ─── */
.toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(90px);
  background:var(--bg3); border:1px solid var(--border); border-radius:12px; padding:12px 20px;
  font-size:13px; font-weight:500; z-index:900; transition:transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 12px 40px rgba(0,0,0,.5); max-width:88vw; text-align:center;
}
.toast.show{ transform:translateX(-50%) translateY(0); }
.toast.err{ border-color:rgba(255,77,77,.5); color:#ff8f8f; }
.toast.ok{ border-color:rgba(223,242,13,.5); color:#eaff6b; }
.bar{ position:fixed; top:0; left:0; height:3px; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2));
  z-index:999; transition:width .25s; box-shadow:0 0 12px var(--accent-glow); }


/* ─── Stat cards ─── */
.stats{
  max-width:1500px; margin:0 auto; padding:16px 24px 0;
  display:grid; grid-template-columns:repeat(4,1fr); gap:12px; position:relative; z-index:2;
}
.st{
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; display:flex; align-items:center; gap:12px; transition:.2s; cursor:pointer;
}
.st:hover{ border-color:var(--border-hover); background:var(--bg3); }
.st.on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.st .sico{ width:34px; height:34px; flex-shrink:0; }
.st .sv{ font-family:'Orbitron',sans-serif; font-size:22px; font-weight:800; line-height:1; }
.st .sl{ font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; font-weight:700; margin-top:5px; }
.st.warn .sv{ color:#ff6b6b; }
.st.ok   .sv{ color:var(--accent); }
.st.grey .sv{ color:#ffb454; }

/* ─── Filter bar ─── */
.filters{
  max-width:1500px; margin:0 auto; padding:16px 24px 0;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:relative; z-index:2;
}
.fsel{
  background:var(--bg2); border:1px solid var(--border); color:var(--text);
  padding:7px 12px; border-radius:20px; font-size:12.5px; font-family:inherit;
  font-weight:600; cursor:pointer; outline:none; transition:.2s;
}
.fsel:hover{ border-color:var(--border-hover); }
.fsel:focus{ border-color:rgba(223,242,13,.5); }
.fsel.on{ background:var(--accent); border-color:var(--accent); color:#0d0d0d; }
.fsep{ width:1px; height:22px; background:var(--border); margin:0 4px; }
.fclear{
  background:transparent; border:1px solid var(--border); color:var(--text3);
  padding:7px 13px; border-radius:20px; font-size:12px; font-weight:600;
  cursor:pointer; font-family:inherit; transition:.2s;
}
.fclear:hover{ color:#ff8f8f; border-color:rgba(255,77,77,.4); }
.fspace{ margin-left:auto; display:flex; gap:8px; align-items:center; }

/* ─── Project card ─── */
.plist{ display:flex; flex-direction:column; gap:12px; }
.pcard{
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; transition:.2s;
}
.pcard:hover{ border-color:var(--border-hover); }
.pcard.open{ border-color:rgba(223,242,13,.35); }
.pcard.late{ border-color:rgba(255,77,77,.35); }

.phead{
  display:grid; grid-template-columns:minmax(0,1fr) 210px 150px 128px 34px;
  gap:14px; align-items:center; padding:14px 16px; cursor:pointer;
}
.phead:hover{ background:var(--bg3); }

.pmain{ min-width:0; }
.ptop{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:5px; }
.pcode{
  font-family:'Orbitron',sans-serif; font-size:10.5px; font-weight:800; letter-spacing:.5px;
  background:var(--bg3); border:1px solid var(--border); color:var(--text2);
  padding:3px 8px; border-radius:7px; white-space:nowrap;
}
.pttl{
  font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; max-width:100%;
}
.psub{ font-size:11.5px; color:var(--text3); display:flex; gap:8px; flex-wrap:wrap; }
.psub b{ color:var(--text2); font-weight:600; }

.sttp{
  display:inline-block; padding:3px 10px; border-radius:20px; font-size:10.5px;
  font-weight:800; letter-spacing:.3px; white-space:nowrap;
  color:var(--neon); background:color-mix(in srgb, var(--neon) 15%, transparent);
  border:1px solid color-mix(in srgb, var(--neon) 45%, transparent);
}
.stt-request{ --neon:#FFE066; } .stt-quote{ --neon:#FFD23F; }
.stt-order{ --neon:#FF9F45; }   .stt-confirmed{ --neon:#3BC9FF; }
.stt-running{ --neon:#7C9CFF; } .stt-service_done{ --neon:#FF6BAA; }
.stt-liq_sent{ --neon:#C77DFF; } .stt-awaiting_payment{ --neon:#9D7BFF; }
.stt-done{ --neon:#39FF88; }    .stt-lost{ --neon:#FF4D6D; }

/* team avatars */
.team{ display:flex; align-items:center; gap:-6px; }
.av{
  width:27px; height:27px; border-radius:50%; display:inline-flex; align-items:center;
  justify-content:center; font-size:11px; font-weight:800; flex-shrink:0;
  border:2px solid var(--bg2); margin-left:-7px; color:#0d0d0d; background:var(--accent);
}
.av:first-child{ margin-left:0; }
.av.fl{ background:#ffffff; }
.av.more{ background:var(--bg3); color:var(--text2); border-color:var(--bg2); font-size:10px; }
.noteam{
  font-size:10.5px; font-weight:800; letter-spacing:.3px; white-space:nowrap;
  color:#ffb454; background:rgba(255,180,84,.14); border:1px solid rgba(255,180,84,.4);
  padding:3px 10px; border-radius:20px;
}

/* progress */
.prog{ min-width:0; }
.pbar{ height:6px; border-radius:4px; background:var(--bg3); overflow:hidden; margin-bottom:5px; }
.pbar > i{ display:block; height:100%; background:var(--accent); border-radius:4px; transition:width .3s; }
.pbar.full > i{ background:#39FF88; }
.pmeta{ font-size:10.5px; color:var(--text3); font-weight:700; letter-spacing:.3px; white-space:nowrap; }
.pmeta .lt{ color:#ff6b6b; }
.pmeta .du{ color:#ffe066; }

.pchev{
  width:26px; height:26px; border-radius:8px; display:inline-flex; align-items:center;
  justify-content:center; color:var(--text3); transition:.2s; justify-self:end;
}
.pcard.open .pchev{ color:var(--accent); transform:rotate(180deg); }

/* body */
.pbody{ display:none; border-top:1px solid var(--border); padding:14px 16px 16px; background:var(--bg); }
.pcard.open .pbody{ display:block; }
.pacts{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }

/* ─── Task table ─── */
table.asg{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:760px; }
table.asg thead th{
  background:var(--bg3); padding:8px 12px; text-align:left; font-size:10.5px;
  text-transform:uppercase; letter-spacing:.6px; color:var(--text3); font-weight:700;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
table.asg tbody td{ padding:9px 12px; border-bottom:1px solid var(--border); vertical-align:middle; background:var(--bg2); }
table.asg tbody tr:last-child td{ border-bottom:none; }
table.asg tbody tr:hover td{ background:var(--bg3); }
table.asg tbody tr.done td{ opacity:.5; }
table.asg tbody tr.late td{ background:rgba(255,77,77,.09); }
table.asg tbody tr.late:hover td{ background:rgba(255,77,77,.14); }
table.asg tbody tr.late td:first-child{ box-shadow:inset 3px 0 0 #ff4d4d; }
table.asg col.c-who{ width:24%; }
table.asg col.c-pos{ width:132px; }
table.asg col.c-due{ width:126px; }
table.asg col.c-stat{ width:132px; }

.who-cell .nm{ font-weight:600; }
.who-cell .meta{ font-size:11px; color:var(--text3); margin-top:2px; }
.task-cell{ color:var(--text2); line-height:1.5; }
.task-cell.empty-t{ color:var(--text3); font-style:italic; }
.due-cell{ white-space:nowrap; font-variant-numeric:tabular-nums; font-size:12px; }
.due-cell .late{ color:#ff6b6b; font-weight:700; }
.due-cell .soon{ display:block; font-size:10.5px; color:var(--text3); font-weight:600; margin-top:2px; }
.pos-pill{
  display:inline-block; padding:2.5px 9px; border-radius:20px; font-size:10.5px;
  font-weight:700; letter-spacing:.3px; white-space:nowrap;
}
.pos-account{ background:rgba(223,242,13,.16); color:#eaff6b; }
.pos-admin{ background:rgba(255,255,255,.12); color:#ffffff; }
.pos-designer{ background:rgba(126,231,135,.15); color:#7ee787; }
.pos-editor{ background:rgba(120,180,255,.15); color:#8ec5ff; }
.pos-none{ background:var(--bg3); color:var(--text3); }
.fl-tag{
  display:inline-block; margin-left:5px; padding:1px 6px; border-radius:20px;
  font-size:9.5px; font-weight:800; letter-spacing:.4px;
  background:rgba(255,255,255,.1); color:var(--text2);
}
.ssel{
  background:var(--bg3); border:1px solid var(--border); color:var(--text);
  padding:5px 9px; border-radius:8px; font-size:11.5px; font-family:inherit;
  font-weight:600; cursor:pointer; outline:none; transition:.2s; min-width:104px;
}
.ssel:hover{ border-color:var(--border-hover); }
.ssel.s-doing{ color:#eaff6b; border-color:rgba(223,242,13,.35); }
.ssel.s-review{ color:#8ec5ff; border-color:rgba(120,180,255,.35); }
.ssel.s-done{ color:#7ee787; border-color:rgba(126,231,135,.35); }

.openbtn{
  display:inline-flex; align-items:center; gap:5px; text-decoration:none;
  padding:6px 13px; border-radius:20px; font-size:11.5px; font-weight:700;
  border:1px solid var(--border); background:var(--bg3); color:var(--text2); transition:.18s;
  font-family:inherit; cursor:pointer;
}
.openbtn:hover{ color:#0d0d0d; background:var(--accent); border-color:var(--accent); }
.openbtn svg{ width:11px; height:11px; }
.nobody{ color:var(--text3); font-size:12.5px; padding:6px 2px; }
.more{ display:flex; align-items:center; gap:12px; justify-content:center; padding:18px 0 4px; }
.morec{ font-size:11.5px; color:var(--text3); font-weight:600; }

@media(max-width:900px){
  header{ padding:0 12px; gap:8px; flex-wrap:wrap; height:auto; padding-top:8px; padding-bottom:8px; }
  .page-title{ order:1; }
  .header-search{ order:3; flex-basis:100%; max-width:none; }
  .hbtn.primary{ order:2; }
  .who{ order:4; }
  .wrap{ padding:12px 14px 70px; }
  .stats, .filters{ padding-left:14px; padding-right:14px; }
  .stats{ grid-template-columns:1fr 1fr; gap:10px; }
  .st{ padding:12px; gap:10px; }
  .st .sv{ font-size:19px; }
  .phead{ grid-template-columns:minmax(0,1fr) 34px; gap:10px; row-gap:10px; }
  .phead > div:nth-child(2), .phead > .prog, .phead > div:nth-child(4){ grid-column:1; }
  .pttl{ white-space:normal; }
  .modal{ padding:22px 18px; }
  .row2, .row3{ grid-template-columns:1fr; }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

t="19" rx="2" fill="#dff20d"/><rect x="12" y="31" width="7" height="6" fill="#5e5e5e"/><rect x="22" y="31" width="7" height="6" fill="#5e5e5e"/></symbol></svg>

    <input class="search-input" id="q" type="text" placeholder="Tìm dự án, mã báo giá, khách hàng..." />

<!-- ─── STAT CARDS ─── -->
<div class="stats" id="stats"></div>

<!-- ─── FILTERS ─── -->
<div class="filters">
  <select class="fsel" id="fScope" onchange="setScope(this.value)"></select>
  <select class="fsel" id="fStt"  onchange="setF('status', this.value)"></select>
  <select class="fsel" id="fKind" onchange="setF('kind', this.value)">
    <option value="">Mọi loại</option>
    <option value="event">Event</option>
    <option value="media">Media</option>
    <option value="other">Khác</option>
  </select>
  <div class="fsep"></div>
  <select class="fsel" id="fUser" onchange="setF('user', this.value)"></select>
  <select class="fsel" id="fPos"  onchange="setF('pos', this.value)"></select>

  </div>

<!-- ─── CONTENT ─── -->
<div class="wrap" id="wrap"></div>

<div class="toast" id="toast"></div>


<script>
const API      = './api/quotation-api.php';
const AUTH_API = './api/auth-api.php';

let ROWS = [], STAFF = [], META = { status:{}, positions:{}, quo:{} };
let F = { scope:'active', status:'', kind:'', user:'', pos:'', q:'', view:'' };
let PAGE = 40;
let OPEN = new Set();
let searchTimer = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* ─── helpers ─── */
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dmy(s){
  if (!s) return '';
  const p = String(s).slice(0,10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s;
}
function daysTo(s){
  if (!s) return null;
  const a = new Date(todayStr() + 'T00:00:00');
  const b = new Date(String(s).slice(0,10) + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function dueText(n){
  if (n === null) return '';
  if (n < 0)   return 'trễ ' + (-n) + ' ngày';
  if (n === 0) return 'hôm nay';
  if (n === 1) return 'ngày mai';
  if (n <= 7)  return 'còn ' + n + ' ngày';
  return '';
}
function initial(s){ return (String(s || '?').trim().charAt(0) || '?').toUpperCase(); }

let tT = null;
function toast(msg, type){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(tT);
  tT = setTimeout(() => { t.className = 'toast ' + (type || ''); }, 2600);
}
function progress(on){
  const b = $('bar');
  if (on){ b.style.width = '35%'; setTimeout(() => { b.style.width = '75%'; }, 220); }
  else { b.style.width = '100%'; setTimeout(() => { b.style.width = '0'; }, 320); }
}
async function api(url, action, opt){
  opt = opt || {};
  const init = { method: opt.body ? 'POST' : 'GET' };
  if (opt.body){
    init.headers = { 'Content-Type':'application/json' };
    init.body = JSON.stringify(opt.body);
  }
  const r = await fetch(url + '?action=' + action + (opt.qs || ''), init);
  const j = await r.json().catch(() => ({ ok:false, error:'Lỗi kết nối' }));
  if (!j.ok) throw new Error(j.error || 'Lỗi không xác định');
  return j.data;
}

/* ─── user chip ─── */
function paintUser(tries){
  const u = window.__APSA_USER;
  if (!u){
    if ((tries || 0) < 40) setTimeout(() => paintUser((tries || 0) + 1), 120);
    return;
  }
  const n = u.display_name || u.username || 'Khách';
  $('uname').textContent = n;
  $('av').textContent = initial(n);
}

/* ─── filters ─── */
function renderFilterOptions(){
  const opt = (v, l, sel) => '<option value="' + esc(v) + '"' + (sel === v ? ' selected' : '') + '>' + esc(l) + '</option>';
  const sc = META.scopeCount || {};
  const n  = k => sc[k] != null ? ' (' + sc[k] + ')' : '';
  $('fScope').innerHTML =
    opt('active',  'Đang triển khai' + n('active'),  F.scope) +
    opt('running', 'Đang thực hiện'  + n('running'), F.scope) +
    opt('presale', 'Chưa chốt'       + n('presale'), F.scope) +
    opt('open',    'Tất cả còn mở'   + n('open'),    F.scope);
  $('fStt').innerHTML = opt('', 'Mọi trạng thái trong nhóm', F.status) +
    Object.keys(META.quo)
      .filter(k => k !== 'done' && k !== 'lost')
      .map(k => opt(k, META.quo[k] + (META.statusCount && META.statusCount[k] != null ? ' (' + META.statusCount[k] + ')' : ''), F.status)).join('');
  $('fUser').innerHTML = opt('', 'Mọi người thực hiện', F.user) +
    STAFF.map(u => opt(String(u.id), u.display_name + (u.staff_type === 'freelancer' ? ' (FL)' : ''), F.user)).join('');
  $('fPos').innerHTML = opt('', 'Mọi vị trí', F.pos) +
    Object.keys(META.positions).map(k => opt(k, META.positions[k], F.pos)).join('');
  $('fKind').value = F.kind;
  $('fScope').classList.toggle('on', F.scope !== 'active');
  ['fStt','fKind','fUser','fPos'].forEach(id => $(id).classList.toggle('on', !!$(id).value));
}
function setF(k, v){ F[k] = v; PAGE = 40; load(); }
function setScope(v){ F.scope = v; F.status = ''; PAGE = 40; load(); }
function clearF(){
  F = { scope:'active', status:'', kind:'', user:'', pos:'', q:'', view:'' };
  PAGE = 40;
  $('q').value = '';
  load();
}
function quickView(v){ F.view = (F.view === v) ? '' : v; PAGE = 40; renderStats(); render(); }

/* ─── data ─── */
async function loadStaff(){
  try{
    const d = await api(AUTH_API, 'basic-list');
    STAFF = (d.users || d || []).filter(u => u && u.display_name);
  }catch(e){ STAFF = []; }
}
async function load(){
  progress(true);
  try{
    const qs = ['scope','status','kind','user','pos'].filter(k => F[k]).map(k => '&' + k + '=' + encodeURIComponent(F[k])).join('')
             + (F.q ? '&q=' + encodeURIComponent(F.q) : '');
    const d = await api(API, 'project-board', { qs });
    ROWS = d.rows || [];
    META = { status: d.status || {}, positions: d.positions || {}, quo: d.quo_status || {},
             scopeCount: d.scope_count || {}, statusCount: d.status_count || {} };
    renderFilterOptions();
    renderStats();
    render();
  }catch(e){ toast(e.message, 'err'); }
  progress(false);
}

/* ─── view filter (client side) ─── */
function visible(){
  if (F.view === 'late')  return ROWS.filter(r => r.task_overdue > 0);
  if (F.view === 'none')  return ROWS.filter(r => r.unassigned);
  if (F.view === 'doing') return ROWS.filter(r => r.task_doing > 0);
  return ROWS;
}

/* ─── stats ─── */
function renderStats(){
  const total = ROWS.length;
  const doing = ROWS.filter(r => r.task_doing > 0).length;
  const late  = ROWS.filter(r => r.task_overdue > 0).length;
  const none  = ROWS.filter(r => r.unassigned).length;
  const card = (ico, val, label, cls, view) =>
    '<div class="st ' + (cls || '') + (view && F.view === view ? ' on' : '') + '" onclick="quickView(\'' + view + '\')" title="Bấm để lọc">' +
    '<svg class="sico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-' + ico + '"/></svg>' +
    '<div><div class="sv">' + val + '</div><div class="sl">' + label + '</div></div></div>';
  $('stats').innerHTML =
    card('doc',     total, 'Dự án đang chạy', '',              '') +
    card('bolt',    doing, 'Có việc đang làm', '',              'doing') +
    card('warning', late,  'Có việc quá hạn',  late ? 'warn' : '', 'late') +
    card('people',  none,  'Chưa giao việc',   none ? 'grey' : '', 'none');
  $('cnt').textContent = total;
}

/* ─── task table ─── */
function posPill(a){
  return '<span class="pos-pill pos-' + (a.position || 'none') + '">' +
    esc(a.position_label || 'Chưa có') + '</span>';
}
function statusSel(a){
  const opts = Object.keys(META.status).map(k =>
    '<option value="' + k + '"' + (a.status === k ? ' selected' : '') + '>' + esc(META.status[k]) + '</option>').join('');
  return '<select class="ssel s-' + esc(a.status) + '" onchange="setStatus(' + a.quotation_id + ',' + a.id + ', this.value)">' + opts + '</select>';
}
function dueCell(a){
  if (!a.due_date) return '<span style="color:var(--text3)">—</span>';
  const n = daysTo(a.due_date), t = dueText(n);
  return '<span class="' + (a.overdue ? 'late' : '') + '">' + dmy(a.due_date) + '</span>' +
         (t && a.status !== 'done' ? '<span class="soon">' + esc(t) + '</span>' : '');
}
function taskTable(r){
  if (!r.assignees.length){
    return '<div class="nobody">Dự án này chưa gán ai. Mở báo giá và thêm ở mục <b>Người thực hiện</b>.</div>';
  }
  const body = r.assignees.map(a =>
    '<tr class="' + (a.status === 'done' ? 'done ' : '') + (a.overdue ? 'late' : '') + '">' +
    '<td class="who-cell"><div class="nm">' + esc(a.display_name) +
      (a.staff_type === 'freelancer' ? '<span class="fl-tag">FL</span>' : '') + '</div>' +
      ([a.phone, a.email].filter(Boolean).length
        ? '<div class="meta">' + esc([a.phone, a.email].filter(Boolean).join(' · ')) + '</div>' : '') + '</td>' +
    '<td>' + posPill(a) + '</td>' +
    '<td class="task-cell' + (a.task ? '' : ' empty-t') + '">' + esc(a.task || 'Chưa ghi phần việc') + '</td>' +
    '<td class="due-cell">' + dueCell(a) + '</td>' +
    '<td>' + statusSel(a) + '</td>' +
    '</tr>').join('');
  return '<div class="tbl-wrap"><table class="asg">' +
    '<colgroup><col class="c-who"><col class="c-pos"><col><col class="c-due"><col class="c-stat"></colgroup>' +
    '<thead><tr><th>Người thực hiện</th><th>Vị trí</th><th>Phần việc</th><th>Hạn</th><th>Trạng thái</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div>';
}

/* ─── project card ─── */
function teamHtml(r){
  if (!r.assignees.length) return '<span class="noteam">Chưa giao việc</span>';
  const seen = new Map();
  r.assignees.forEach(a => { if (!seen.has(a.user_id)) seen.set(a.user_id, a); });
  const list = [...seen.values()];
  const show = list.slice(0, 4);
  let h = '<div class="team">' + show.map(a =>
    '<span class="av' + (a.staff_type === 'freelancer' ? ' fl' : '') + '" title="' +
      esc(a.display_name + (a.position_label ? ' · ' + a.position_label : '')) + '">' +
      esc(initial(a.display_name)) + '</span>').join('');
  if (list.length > show.length) h += '<span class="av more">+' + (list.length - show.length) + '</span>';
  return h + '</div>';
}
function progHtml(r){
  if (!r.task_total) return '<div class="prog"></div>';
  const pct = Math.round(r.task_done / r.task_total * 100);
  const bits = [];
  if (r.task_overdue) bits.push('<span class="lt">' + r.task_overdue + ' quá hạn</span>');
  else if (r.next_due){
    const t = dueText(daysTo(r.next_due));
    if (t) bits.push('<span class="du">' + esc(t) + '</span>');
  }
  return '<div class="prog">' +
    '<div class="pbar' + (pct === 100 ? ' full' : '') + '"><i style="width:' + pct + '%"></i></div>' +
    '<div class="pmeta">' + r.task_done + '/' + r.task_total + ' việc xong' +
      (bits.length ? ' · ' + bits.join(' · ') : '') + '</div></div>';
}
function cardHtml(r){
  const sub = [
    r.company_name || r.client_name || '',
    r.quotation_date ? dmy(r.quotation_date) : '',
    r.event_date ? 'Event: ' + r.event_date : ''
  ].filter(Boolean);
  return '<div class="pcard' + (OPEN.has(r.id) ? ' open' : '') + (r.task_overdue ? ' late' : '') + '" id="pc' + r.id + '">' +
    '<div class="phead" onclick="toggle(' + r.id + ')">' +
      '<div class="pmain">' +
        '<div class="ptop"><span class="pcode">' + esc(r.code || '#' + r.id) + '</span>' +
          '<span class="pttl">' + esc(r.title || '—') + '</span></div>' +
        (sub.length ? '<div class="psub">' + sub.map(s => '<span>' + esc(s) + '</span>').join('<span>·</span>') + '</div>' : '') +
      '</div>' +
      '<div>' + teamHtml(r) + '</div>' +
      progHtml(r) +
      '<div><span class="sttp stt-' + esc(r.status) + '">' + esc(r.status_label) + '</span></div>' +
      '<span class="pchev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>' +
    '</div>' +
    '<div class="pbody">' + taskTable(r) +
      '<div class="pacts">' +
        '<a class="openbtn" href="./quotation.html?id=' + r.id + '">Mở báo giá' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>' +
        (r.src_link ? '<a class="openbtn" href="' + esc(r.src_link) + '" target="_blank" rel="noopener">File dự án ↗</a>' : '') +
      '</div>' +
    '</div></div>';
}

function render(){
  const list = visible();
  if (!list.length){
    const filtered = !!(F.status || F.kind || F.user || F.pos || F.q || F.view || F.scope !== 'active');
    $('wrap').innerHTML =
      '<div class="empty"><div class="ico"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-' +
        (filtered ? 'search' : 'doc') + '"/></svg></div>' +
      (filtered
        ? '<h3>Không có dự án nào khớp bộ lọc</h3><p>Thử bỏ bớt điều kiện hoặc bấm <b>Xoá lọc</b>.</p>'
        : '<h3>Chưa có dự án nào đang chạy</h3><p>Dự án sẽ hiện ở đây khi báo giá có trạng thái khác <b>Hoàn thành</b> và <b>Trượt Bidding</b>.</p>') +
      '</div>';
    return;
  }
  const shown = list.slice(0, PAGE);
  $('wrap').innerHTML = '<div class="plist">' + shown.map(cardHtml).join('') + '</div>' +
    (list.length > shown.length
      ? '<div class="more"><button class="openbtn" onclick="showMore()">Xem thêm ' +
        Math.min(40, list.length - shown.length) + ' dự án</button>' +
        '<span class="morec">Đang hiện ' + shown.length + ' / ' + list.length + '</span></div>'
      : '');
  $('btnAll').textContent = (OPEN.size >= shown.length) ? 'Thu tất cả' : 'Mở tất cả';
}

/* ─── expand / collapse ─── */
function toggle(id){
  if (OPEN.has(id)) OPEN.delete(id); else OPEN.add(id);
  const el = $('pc' + id);
  if (el) el.classList.toggle('open', OPEN.has(id));
  saveOpen();
  const list = visible().slice(0, PAGE);
  $('btnAll').textContent = (OPEN.size >= list.length) ? 'Thu tất cả' : 'Mở tất cả';
}
function showMore(){ PAGE += 40; render(); }
function toggleAll(){
  const list = visible().slice(0, PAGE);
  if (OPEN.size >= list.length) OPEN.clear();
  else list.forEach(r => OPEN.add(r.id));
  saveOpen();
  render();
}
function saveOpen(){ try{ localStorage.setItem('wk_open', JSON.stringify([...OPEN])); }catch(e){} }
function loadOpen(){
  try{ (JSON.parse(localStorage.getItem('wk_open') || '[]') || []).forEach(i => OPEN.add(Number(i))); }catch(e){}
}

/* ─── quick status change ─── */
async function setStatus(qid, id, status){
  try{
    progress(true);
    await api(API, 'assign-status', { body:{ id, status } });
    const r = ROWS.find(x => x.id === qid);
    if (r){
      const a = r.assignees.find(x => x.id === id);
      if (a){
        a.status = status;
        a.status_label = META.status[status] || status;
        a.overdue = (a.due_date && status !== 'done' && String(a.due_date).slice(0,10) < todayStr()) ? 1 : 0;
      }
      r.task_done    = r.assignees.filter(x => x.status === 'done').length;
      r.task_doing   = r.assignees.filter(x => x.status === 'doing').length;
      r.task_overdue = r.assignees.filter(x => x.overdue).length;
      let next = null;
      r.assignees.forEach(x => {
        if (x.status === 'done' || !x.due_date) return;
        if (next === null || x.due_date < next) next = x.due_date;
      });
      r.next_due = next;
    }
    toast('Đã cập nhật trạng thái', 'ok');
    renderStats();
    render();
  }catch(e){ toast(e.message, 'err'); }
  progress(false);
}

/* ─── search ─── */
function onSearch(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { F.q = $('q').value.trim(); load(); }, 320);
}

/* ─── boot ─── */
async function boot(){
  paintUser();
  loadOpen();
  $('q').addEventListener('input', onSearch);
  const p = new URLSearchParams(location.search);
  if (p.get('user'))   F.user   = p.get('user');
  if (p.get('pos'))    F.pos    = p.get('pos');
  if (p.get('status')) F.status = p.get('status');
  if (p.get('scope'))  F.scope  = p.get('scope');
  if (p.get('view'))   F.view   = p.get('view');
  await loadStaff();
  await load();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
