    font-size: 12px;
    font-weight: 600;

  .divider { height: 1px; background: #2b2b2b; margin: 28px 0; }
  .btn {

    align-items: center;

    background: linear-gradient(135deg, #dff20d, #a8bb00);
    color: #fff;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 12px;
    transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
