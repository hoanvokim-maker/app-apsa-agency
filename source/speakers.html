<script>
  document.documentElement.style.visibility = 'hidden';
  fetch('./api/auth-api.php?action=me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => {
      if (!res.ok) throw new Error();
      window.__APSA_USER = res.data;
      document.documentElement.style.visibility = 'visible';
    })
    .catch(() => {
      location.replace('./login.html?next=' + encodeURIComponent(location.pathname + location.search));
    });

<script>
/* ===================== APSA1830 · Thư viện Speaker ===================== */
var API  = './api/speakers-api.php';
var META = null, ROWS = [], SUM = null;
var FORM = { photo: '', thumb: '', dirty: false };

function el(i){ return document.getElementById(i); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); }
function n0(v){ return Number(v) || 0; }

function nrm(s){
  s = String(s == null ? '' : s).toLowerCase();
  var m = { 'a':'áàảãạăắằẳẵặâấầẩẫậ', 'e':'éèẻẽẹêếềểễệ', 'i':'íìỉĩị',
            'o':'óòỏõọôốồổỗộơớờởỡợ', 'u':'úùủũụưứừửữự', 'y':'ýỳỷỹỵ', 'd':'đ' };
  for (var k in m) { for (var j = 0; j < m[k].length; j++) s = s.split(m[k][j]).join(k); }
  return s.replace(/\s+/g, ' ').trim();
}

function spToast(m){
  if (typeof toast === 'function') { try { toast(m); return; } catch(e){} }
  var d = el('spToast');
  if (!d) { d = document.createElement('div'); d.id = 'spToast';
    d.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:2000;'
      + 'background:#1b2026;border:1px solid #2b3138;color:#e6e9ee;padding:11px 18px;border-radius:12px;'
      + 'font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:min(90vw,520px);text-align:center';
    document.body.appendChild(d); }
  d.textContent = m; d.style.display = 'block';
  clearTimeout(d.__t); d.__t = setTimeout(function(){ d.style.display = 'none'; }, 3400);
}

async function api(action, body){
  var o = { credentials: 'same-origin' };
  if (body) { o.method = 'POST'; o.headers = { 'Content-Type': 'application/json' }; o.body = JSON.stringify(body); }
  var r = await fetch(API + '?action=' + action, o);
  var j = await r.json().catch(function(){ return {}; });
  if (!j.ok) throw new Error(j.error || ('Lỗi ' + r.status));
  return j;
}

/* ---------- nạp ---------- */
async function spLoad(){
  try {
    var m = await api('meta');
    META = m.data;
    fillFilters();
    var res = await Promise.all([ api('list'), api('summary') ]);
    ROWS = res[0].rows || [];
    SUM  = res[1].data || null;
    paintStats(); spDraw();
  } catch (e) { spToast(e.message); }
}

function opts(list, sel){
  return (list || []).map(function(v){
    return '<option value="' + esc(v) + '"' + (sel === v ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('');
}

function fillFilters(){
  var k = el('spKind');
  if (k && k.options.length < 2) {
    Object.keys(META.kinds).forEach(function(x){
      k.insertAdjacentHTML('beforeend', '<option value="' + x + '">' + esc(META.kinds[x]) + '</option>'); });
  }
  var f = el('spField'), s = el('spSpec');
  var fv = f.value, sv = s.value;
  f.innerHTML = '<option value="">Tất cả lĩnh vực</option>' + opts(META.fields, fv);
  s.innerHTML = '<option value="">Tất cả chuyên ngành</option>' + opts(META.specs, sv);
}

function paintStats(){
  if (!SUM) return;
  el('spStats').innerHTML =
    '<div class="spst"><b>' + n0(SUM.total) + '</b><span>speaker</span></div>' +
    '<div class="spst"><b>' + n0(SUM.doctor) + '</b><span>bác sĩ / chuyên gia</span></div>' +
    '<div class="spst"><b>' + n0(SUM.leader) + '</b><span>lãnh đạo</span></div>' +
    '<div class="spst"><b>' + n0(SUM.specs) + '</b><span>chuyên ngành</span></div>' +
    (n0(SUM.nophoto) ? '<div class="spst warn"><b>' + n0(SUM.nophoto) + '</b><span>chưa có ảnh</span></div>' : '');
}

function spFiltered(){
  var q  = nrm(el('spQ').value);
  var kk = el('spKind').value, ff = el('spField').value, ss = el('spSpec').value;
  return ROWS.filter(function(r){
    if (kk && r.kind  !== kk) return false;
    if (ff && r.field !== ff) return false;
    if (ss && r.spec  !== ss) return false;
    if (!q) return true;
    var hay = nrm([r.code, r.degree, r.full_name, r.title, r.org, r.dept, r.field, r.spec, r.note].join(' '));
    return q.split(' ').every(function(w){ return hay.indexOf(w) >= 0; });
  });
}
</script>
<script>
/* ---------- vẽ ---------- */
function grpKey(r, mode){
  if (mode === 'field') return r.field || 'Chưa phân lĩnh vực';
  if (mode === 'kind')  return r.kind_label || 'Khác';
  if (mode === 'org')   return r.org || 'Chưa có đơn vị';
  return r.spec || 'Chưa phân chuyên ngành';
}

function cardHtml(r){
  var img = r.thumb || r.photo;
  return '<div class="spcard">' +
    '<div class="spph" onclick="lbOpen(' + r.id + ')">' +
      (img ? '<img src="./' + esc(img) + '" alt="" loading="lazy" />'
           : '<div class="noimg">CHƯA CÓ ẢNH</div>') +
      (r.kind === 'leader' ? '<span class="spflag">LÃNH ĐẠO</span>' : '') +
      (Number(r.active) ? '' : '<span class="spflag" style="color:#ff8a8a">NGƯNG</span>') +
    '</div>' +
    '<div class="spbody">' +
      (r.degree ? '<div class="spdeg">' + esc(r.degree) + '</div>' : '') +
      '<div class="spname">' + esc(r.full_name) + '</div>' +
      (r.title ? '<div class="sptitle">' + esc(r.title) + '</div>' : '') +
      (r.org   ? '<div class="sporg">' + esc(r.org) + (r.dept ? ' — ' + esc(r.dept) : '') + '</div>' : '') +
      '<div class="spchips">' +
        (r.field ? '<span class="spchip f">' + esc(r.field) + '</span>' : '') +
        (r.spec  ? '<span class="spchip s">' + esc(r.spec)  + '</span>' : '') +
      '</div>' +
    '</div>' +
    '<div class="spact">' +
      '<button onclick="spOpen(' + r.id + ')">Sửa</button>' +
      '<button class="dg" onclick="spDel(' + r.id + ')">Xoá</button>' +
    '</div>' +
  '</div>';
}

function rowHtml(r){
  var img = r.thumb || r.photo;
  return '<tr>' +
    '<td style="width:52px">' + (img ? '<img class="spav" src="./' + esc(img) + '" loading="lazy" />' : '<div class="spav"></div>') + '</td>' +
    '<td><div style="font-weight:700">' + (r.degree ? '<span style="color:var(--accent,#dff20d);font-size:11px">' + esc(r.degree) + '</span> ' : '') + esc(r.full_name) + '</div>' +
        (r.title ? '<div style="font-size:11px;opacity:.6;margin-top:2px">' + esc(r.title) + '</div>' : '') + '</td>' +
    '<td>' + esc(r.org || '') + (r.dept ? '<div style="font-size:11px;opacity:.55">' + esc(r.dept) + '</div>' : '') + '</td>' +
    '<td>' + (r.field ? '<span class="spchip f">' + esc(r.field) + '</span>' : '') + '</td>' +
    '<td>' + (r.spec  ? '<span class="spchip s">' + esc(r.spec)  + '</span>' : '') + '</td>' +
    '<td>' + esc(r.kind_label || '') + '</td>' +
    '<td class="r"><button class="wb" onclick="spOpen(' + r.id + ')">Sửa</button> ' +
        '<button class="wb dg" onclick="spDel(' + r.id + ')">Xoá</button></td>' +
  '</tr>';
}

function spDraw(){
  var list = spFiltered();
  var wrap = el('spWrap');
  if (!list.length) {
    wrap.innerHTML = '<div class="spempty">' + (ROWS.length ? 'Không có speaker nào khớp bộ lọc.' : 'Chưa có speaker nào. Bấm “+ Speaker” để thêm người đầu tiên.') + '</div>';
    return;
  }
  if (el('spView').value === 'list') {
    wrap.innerHTML = '<div class="tbl-wrap"><table class="sptbl">' +
      '<thead><tr><th></th><th>Họ tên</th><th>Đơn vị công tác</th><th>Lĩnh vực</th><th>Chuyên ngành</th><th>Nhóm</th><th></th></tr></thead>' +
      '<tbody>' + list.map(rowHtml).join('') + '</tbody></table></div>';
    return;
  }
  var mode = el('spGroup').value;
  if (!mode) { wrap.innerHTML = '<div class="spgrid">' + list.map(cardHtml).join('') + '</div>'; return; }
  var buckets = {}, order = [];
  list.forEach(function(r){ var k = grpKey(r, mode); if (!buckets[k]) { buckets[k] = []; order.push(k); } buckets[k].push(r); });
  order.sort(function(a, b){ return a.localeCompare(b, 'vi'); });
  wrap.innerHTML = order.map(function(k){
    return '<div class="spgrp"><h3>' + esc(k) + '</h3><i></i><b>' + buckets[k].length + '</b></div>' +
           '<div class="spgrid">' + buckets[k].map(cardHtml).join('') + '</div>';
  }).join('');
}
</script>
<script>
/* ---------- xem ảnh lớn ---------- */
function lbOpen(id){
  var r = ROWS.filter(function(x){ return x.id === id; })[0];
  if (!r) return;
  var lb = el('spLb');
  lb.innerHTML = (r.photo ? '<img src="./' + esc(r.photo) + '" alt="" />' : '<div class="spempty">Chưa có ảnh</div>') +
    '<div class="cap"><b>' + esc(r.display || r.full_name) + '</b>' +
      (r.title ? esc(r.title) + '<br />' : '') +
      (r.org ? '<span style="opacity:.6">' + esc(r.org) + (r.dept ? ' — ' + esc(r.dept) : '') + '</span>' : '') + '</div>' +
    '<div style="display:flex;gap:8px">' +
      (r.photo ? '<a class="wb" style="text-decoration:none" href="./' + esc(r.photo) + '" download>⤓ Tải ảnh</a>' : '') +
      '<button class="wb" onclick="spOpen(' + r.id + ')">Sửa thông tin</button>' +
      '<button class="wb" onclick="lbClose()">Đóng</button>' +
    '</div>';
  lb.classList.add('on');
}
function lbClose(e){ if (e && e.target && e.target.tagName === 'IMG') return; el('spLb').classList.remove('on'); }

/* ---------- chuẩn hoá ảnh phía trình duyệt ----------
   1. cắt bỏ viền trong suốt (ảnh PNG đã tách nền)
   2. đặt vào khung vuông, chừa lề 6%
   3. xuất PNG 800x800 (giữ nền trong suốt) + thumb 200x200
------------------------------------------------------ */
function normPhoto(file, cb){
  if (!/^image\/(png|jpeg|webp)$/.test(file.type)) { cb('Chỉ nhận ảnh PNG, JPG hoặc WEBP.'); return; }
  if (file.size > 25 * 1024 * 1024) { cb('Ảnh gốc quá lớn (tối đa 25MB).'); return; }
  var url = URL.createObjectURL(file);
  var im  = new Image();
  im.onload = function(){
    try {
      var w = im.naturalWidth, h = im.naturalHeight;
      if (!w || !h) { URL.revokeObjectURL(url); cb('Không đọc được ảnh.'); return; }

      var k  = Math.min(1, 400 / Math.max(w, h));
      var aw = Math.max(1, Math.round(w * k)), ah = Math.max(1, Math.round(h * k));
      var a  = document.createElement('canvas'); a.width = aw; a.height = ah;
      var ag = a.getContext('2d'); ag.drawImage(im, 0, 0, aw, ah);

      var x0 = 0, y0 = 0, x1 = w - 1, y1 = h - 1;
      try {
        var d = ag.getImageData(0, 0, aw, ah).data, i, px, py, found = false;
        var bx0 = aw, by0 = ah, bx1 = -1, by1 = -1;
        for (py = 0; py < ah; py++) {
          for (px = 0; px < aw; px++) {
            i = (py * aw + px) * 4 + 3;
            if (d[i] > 12) { found = true;
              if (px < bx0) bx0 = px; if (px > bx1) bx1 = px;
              if (py < by0) by0 = py; if (py > by1) by1 = py; }
          }
        }
        if (found) {
          x0 = Math.max(0, Math.floor(bx0 / k) - 1); y0 = Math.max(0, Math.floor(by0 / k) - 1);
          x1 = Math.min(w - 1, Math.ceil((bx1 + 1) / k)); y1 = Math.min(h - 1, Math.ceil((by1 + 1) / k));
        }
      } catch (e) { }

      var cw = x1 - x0 + 1, ch = y1 - y0 + 1;
      var side = Math.max(cw, ch) * 1.06;

      function make(size){
        var o = document.createElement('canvas'); o.width = size; o.height = size;
        var g = o.getContext('2d');
        g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
        var s  = size / side;
        var dw = cw * s, dh = ch * s;
        g.drawImage(im, x0, y0, cw, ch, (size - dw) / 2, (size - dh) / 2, dw, dh);
        return o;
      }
      var big = make(800), sml = make(200);
      var preview = sml.toDataURL('image/png');
      big.toBlob(function(b1){
        sml.toBlob(function(b2){
          URL.revokeObjectURL(url);
          cb(null, b1, b2, preview);
        }, 'image/png');
      }, 'image/png');
    } catch (e) { URL.revokeObjectURL(url); cb('Lỗi xử lý ảnh: ' + e.message); }
  };
  im.onerror = function(){ URL.revokeObjectURL(url); cb('Không mở được tệp ảnh.'); };
  im.src = url;
}
</script>
<script>
function upPhoto(b1, b2, cb){
  var fd = new FormData();
  fd.append('photo', b1, 'p.png');
  fd.append('thumb', b2, 't.png');
  fetch(API + '?action=photo', { method: 'POST', credentials: 'same-origin', body: fd })
    .then(function(r){ return r.json().catch(function(){ return {}; }); })
    .then(function(j){
      var d = (j && j.data) ? j.data : j;
      if (!j || j.ok === false || !d || !d.photo) { cb((j && j.error) || 'Tải ảnh lên thất bại.'); return; }
      cb(null, d.photo, d.thumb || d.photo);
    })
    .catch(function(e){ cb(e.message || 'Tải ảnh lên thất bại.'); });
}

function handlePhoto(file, done){
  normPhoto(file, function(err, b1, b2, preview){
    if (err) { done(err); return; }
    upPhoto(b1, b2, function(e2, photo, thumb){
      if (e2) { done(e2); return; }
      done(null, photo, thumb, preview);
    });
  });
}

/* tên gợi ý từ tên tệp */
function nameFromFile(fn){
  var s = String(fn).replace(/\.[a-z0-9]+$/i, '').replace(/[_\-.]+/g, ' ').replace(/\s+/g, ' ').trim();
  var deg = '', L = (META && META.degrees) || [];
  for (var i = 0; i < L.length; i++) {
    var d = L[i].replace(/\./g, ' ').replace(/\s+/g, ' ').trim();
    if (nrm(s).indexOf(nrm(d) + ' ') === 0) { deg = L[i]; s = s.slice(d.length).trim(); break; }
  }
  s = s.replace(/(^|\s)\S/g, function(c){ return c.toUpperCase(); });
  return { degree: deg, name: s };
}

/* ---------- form ---------- */
function ovOpen(html){ el('spBox').innerHTML = html; el('spOv').classList.add('on'); }
function ovClose(){ el('spOv').classList.remove('on'); }
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (el('spLb').classList.contains('on')) { lbClose(); return; }
  ovClose();
});

function dl(id, list){
  return '<datalist id="' + id + '">' + (list || []).map(function(v){
    return '<option value="' + esc(v) + '"></option>'; }).join('') + '</datalist>';
}

function setPrev(src){
  var d = el('spDrop');
  if (!d) return;
  d.innerHTML = src ? '<img id="spPrev" src="' + src + '" />'
                    : '<div class="ph">Kéo ảnh PNG vào đây<br />hoặc bấm để chọn tệp</div>';
}
function clrPhoto(){ FORM.photo = ''; FORM.thumb = ''; setPrev(''); el('spDh').textContent = 'Đã bỏ ảnh.'; }

function pickPhoto(file){
  el('spDh').textContent = 'Đang xử lý ảnh…';
  handlePhoto(file, function(err, photo, thumb, preview){
    if (err) { el('spDh').textContent = err; spToast(err); return; }
    FORM.photo = photo; FORM.thumb = thumb;
    setPrev(preview);
    el('spDh').textContent = 'Đã chuẩn hoá 800×800 và tải lên.';
    var n = el('fName');
    if (n && !n.value.trim()) {
      var g = nameFromFile(file.name);
      n.value = g.name;
      if (g.degree && !el('fDeg').value.trim()) el('fDeg').value = g.degree;
    }
  });
}
</script>

        '<div class="spf"><label>Chuyên ngành</label><input class="spin" id="fSpec" list="dlSpec" value="' + esc(r.spec) + '" placeholder="Tim mạch" /></div>' +
        '<div class="spf full"><label>Ghi chú</label><input class="spin" id="fNote" value="' + esc(r.note || '') + '" /></div>' +
      '</div>' +
    '</div>' +
    dl('dlDeg', META.degrees) + dl('dlField', META.fields) + dl('dlSpec', META.specs) +

  var drop = el('spDrop'), fin = el('spFile');

}
</script>
<script>
async function spSave(id){
  var name = el('fName').value.trim();
  if (!name) { spToast('Chưa nhập họ tên.'); el('fName').focus(); return; }
  var b = el('spSaveBtn'); b.disabled = true;
  try {
    var j = await api('save', {
      id: id, kind: el('fKind').value, degree: el('fDeg').value.trim(), full_name: name,
      title: el('fTitle').value.trim(), org: el('fOrg').value.trim(), dept: el('fDept').value.trim(),
      field: el('fField').value.trim(), spec: el('fSpec').value.trim(),
      photo: FORM.photo, thumb: FORM.thumb, note: el('fNote').value.trim(),
      active: el('fActive').value
    });
    ovClose(); spToast(j.message); await spLoad();
  } catch (e) { spToast(e.message); b.disabled = false; }
}

async function spDel(id){
  var r = ROWS.filter(function(x){ return x.id === id; })[0];
  if (!r) return;
  if (!confirm('Xoá "' + (r.display || r.full_name) + '" khỏi thư viện speaker?')) return;
  try { var j = await api('del', { id: id }); spToast(j.message); await spLoad(); }
  catch (e) { spToast(e.message); }
}

/* ---------- nhập nhiều ảnh cùng lúc ---------- */
async function bulkGo(files){
  var ok = 0, bad = [], i;
  spToast('Đang nhập ' + files.length + ' ảnh…');
  for (i = 0; i < files.length; i++) {
    var f = files[i];
    try {
      var up = await new Promise(function(res, rej){
        handlePhoto(f, function(err, photo, thumb){ err ? rej(new Error(err)) : res({ photo: photo, thumb: thumb }); });
      });
      var g = nameFromFile(f.name);
      if (!g.name) g.name = f.name;
      await api('save', { id: 0, kind: 'doctor', degree: g.degree, full_name: g.name,
                          photo: up.photo, thumb: up.thumb, active: 1 });
      ok++;
    } catch (e) { bad.push(f.name + ': ' + e.message); }
  }
  await spLoad();
  spToast('Đã nhập ' + ok + '/' + files.length + ' ảnh.' + (bad.length ? ' Lỗi: ' + bad[0] : ''));
}

/* ---------- khởi động ---------- */
el('spBulk').onchange = function(){
  var f = this.files;
  if (!f || !f.length) return;
  if (confirm('Nhập ' + f.length + ' ảnh vào thư viện? Mỗi ảnh tạo 1 speaker, tên lấy tạm từ tên tệp — sau đó sửa lại chức vụ và chuyên ngành.')) bulkGo(Array.prototype.slice.call(f));
  this.value = '';
};
spLoad();
</script>
