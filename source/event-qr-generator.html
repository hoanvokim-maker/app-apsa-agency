<!DOCTYPE html>

<script>
  document.documentElement.style.visibility = 'hidden';
  fetch('./api/auth-api.php?action=me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => {
      if (!res.ok) throw new Error();
      window.__APSA_USER = res.data;
      document.documentElement.style.visibility = 'visible';
    })
    .catch(() => {
      location.replace('./login.html?next=' + encodeURIComponent(location.pathname + location.search));
    });
</script>

    .topnav { position: sticky; top: 0; z-index: 100; background: rgba(0,0,0,0.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid #1a1a1a; padding: 0 20px; height: 56px; display: flex; align-items: center; justify-content: space-between; }

    .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }

    .h-card-btns { display: grid; grid-template-columns: repeat(4,1fr); gap: 3px; padding: 0 7px 7px; }
    .h-card-btn { background: #141414; border: none; color: #666; font-size: 10px; font-weight: 600; padding: 5px 2px; border-radius: 6px; cursor: pointer; font-family: inherit; transition: all 0.2s; text-align: center; line-height: 1; }

    /* Full-width for history view */

    .form-section-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 20px; }
    .card { background: #0b0b0b; border: 1px solid #1c1c1c; border-radius: 16px; padding: 24px; margin-bottom: 16px; }
    .form-group { margin-bottom: 18px; }
    .form-group:last-child { margin-bottom: 0; }
    label { display: block; font-size: 12px; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
    input, textarea { width: 100%; background: #000000; border: 1px solid #1c1c1c; border-radius: 10px; padding: 12px 14px; color: #ffffff; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator { filter: invert(0.5); cursor: pointer; }

    textarea { resize: vertical; min-height: 80px; }
    .error-box { display: none; color: #ff4d4d; font-size: 13px; margin-bottom: 14px; background: rgba(255,77,77,0.08); border: 1px solid rgba(255,77,77,0.25); border-radius: 8px; padding: 10px 14px; }

    .btn-secondary { width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; background: #1c1c1c; color: #ffffff; transition: all 0.2s; margin-top: 10px; }
    .btn-secondary:hover { background: #333333; }

    /* ── RESULT VIEW ── */
    .result-card { background: #0b0b0b; border: 1px solid #1c1c1c; border-radius: 20px; padding: 28px; text-align: center; margin-bottom: 16px; }
    .qr-wrapper { display: inline-flex; align-items: center; justify-content: center; background: #fff; border-radius: 16px; padding: 18px; margin: 0 auto 20px; }
    .event-summary { background: #000000; border: 1px solid #1c1c1c; border-radius: 12px; padding: 14px 16px; text-align: left; margin-bottom: 16px; }
    .event-summary .row { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; font-size: 13px; color: #9a9a9a; border-bottom: 1px solid #141414; }
    .event-summary .row:last-child { border-bottom: none; }
    .event-summary .row .emo { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
    .event-summary .row .val { color: #ffffff; }
    .hint { font-size: 12px; color: #555; margin-bottom: 18px; }
    .dl-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .btn-dl { padding: 11px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; background: #1c1c1c; color: #ffffff; transition: all 0.2s; }
    .btn-dl:hover { background: #333333; }
    .btn-save { width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; background: linear-gradient(135deg,#dff20d,#b9cc00); color: #fff; transition: all 0.2s; margin-bottom: 8px; }
    .btn-save:hover { opacity: 0.85; }
    .btn-edit-again { width: 100%; padding: 12px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; background: #1c1c1c; color: #ffffff; transition: all 0.2s; }
    .btn-edit-again:hover { background: #333333; }

    /* ── SAVED BADGE ── */
    .badge-saved { display: inline-block; background: rgba(223,242,13,0.12); border: 1px solid rgba(223,242,13,0.3); color: #dff20d; font-size: 12px; font-weight: 600; padding: 3px 12px; border-radius: 20px; margin-bottom: 14px; }

    /* ── TYPE TOGGLE ── */
    .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }

    .type-btn.active { background: rgba(223,242,13,0.15); border-color: #dff20d; color: #c9dd00; }

    /* ── QR TYPE BADGE in history ── */
    .h-type { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; display: inline-block; white-space: nowrap; flex-shrink: 0; }

/* ══ APSA — Link rút gọn ══════════════════════════════ */
.sl-switch{display:flex;gap:6px;background:#141414;border:1px solid #262626;border-radius:12px;padding:4px;margin:0 0 18px;width:fit-content}
.sl-switch button{appearance:none;border:0;background:transparent;color:#8a8a8a;font:inherit;font-size:13px;font-weight:600;
  padding:8px 16px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s}
.sl-switch button:hover{color:#d8d8d8}
.sl-switch button.on{background:#dff20d;color:#0d0d0d}
.sl-switch svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.sl-bar{display:flex;gap:10px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
.sl-search{flex:1;min-width:200px;position:relative}
.sl-search input{width:100%;background:#141414;border:1px solid #262626;border-radius:10px;color:#f2f2f2;
  font:inherit;font-size:14px;padding:11px 14px 11px 38px;outline:none}
.sl-search input:focus{border-color:#3d3d3d}
.sl-search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;
  fill:none;stroke:#666;stroke-width:2;stroke-linecap:round}
.sl-new{appearance:none;border:0;background:#dff20d;color:#0d0d0d;font:inherit;font-size:13px;font-weight:700;
  padding:11px 18px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.sl-new:hover{background:#eaff2b}
.sl-new svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round}

.sl-scroll{overflow-x:auto;border:1px solid #222;border-radius:14px;background:#111}
table.sl-tb{width:100%;border-collapse:collapse;min-width:820px;font-size:13px}
table.sl-tb th{text-align:left;padding:12px 14px;color:#7a7a7a;font-weight:600;font-size:11px;
  letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid #222;white-space:nowrap;background:#151515}
table.sl-tb td{padding:12px 14px;border-bottom:1px solid #1c1c1c;vertical-align:middle}
table.sl-tb tr:last-child td{border-bottom:0}
table.sl-tb tbody tr:hover{background:#161616}
.sl-name{color:#f2f2f2;font-weight:600;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-meta{color:#5f5f5f;font-size:11px;margin-top:3px}
.sl-code{display:inline-flex;align-items:center;gap:8px}
.sl-code code{color:#dff20d;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;background:#1a1a1a;
  border:1px solid #262626;border-radius:7px;padding:4px 9px}
.sl-dest{color:#8a8a8a;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sl-dest a{color:#8a8a8a;text-decoration:none}
.sl-dest a:hover{color:#dff20d}
.sl-hits{font-variant-numeric:tabular-nums;color:#f2f2f2;font-weight:600}
.sl-pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;border:1px solid}
.sl-pill.yes{color:#dff20d;border-color:#3d4407;background:#20240a}
.sl-pill.no{color:#7a7a7a;border-color:#2a2a2a;background:#181818}
.sl-acts{display:flex;gap:5px;justify-content:flex-end}
.sl-ic{appearance:none;width:30px;height:30px;border-radius:8px;border:1px solid #2a2a2a;background:#181818;
  color:#9a9a9a;cursor:pointer;display:grid;place-items:center;transition:.13s;padding:0}
.sl-ic:hover{background:#222;color:#dff20d;border-color:#3a3a3a}
.sl-ic.del:hover{color:#ff5f56;border-color:#4a2523;background:#241615}
.sl-ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sl-empty{padding:56px 20px;text-align:center;color:#5f5f5f;font-size:14px}
.sl-empty svg{width:38px;height:38px;stroke:#333;fill:none;stroke-width:1.6;margin-bottom:14px}

/* ── Modal ── */
.sl-ov{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:400;display:none;align-items:center;
  justify-content:center;padding:20px;backdrop-filter:blur(3px)}
.sl-ov.open{display:flex}
.sl-modal{background:#131313;border:1px solid #2a2a2a;border-radius:18px;width:100%;max-width:460px;
  padding:24px;max-height:90vh;overflow:auto}
.sl-modal h3{margin:0 0 20px;font-size:17px;font-weight:700;color:#f2f2f2}
.sl-fg{margin-bottom:15px}
.sl-fg label{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:#7a7a7a;margin-bottom:7px}
.sl-fg input[type=text],.sl-fg input[type=url]{width:100%;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:10px;
  color:#f2f2f2;font:inherit;font-size:14px;padding:11px 13px;outline:none}
.sl-fg input:focus{border-color:#dff20d}
.sl-hint{color:#5f5f5f;font-size:11.5px;margin-top:6px;line-height:1.5}
.sl-pre{display:flex;align-items:center;gap:0;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:10px;overflow:hidden}
.sl-pre span{padding:11px 0 11px 13px;color:#5f5f5f;font-size:13.5px;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.sl-pre input{flex:1;border:0!important;background:transparent!important;padding-left:2px!important}
.sl-ck{text-transform:none;font-weight:400;letter-spacing:0;line-height:1.5;display:flex;align-items:flex-start;gap:10px;cursor:pointer;color:#c8c8c8;font-size:13.5px;
  padding:11px 13px;background:#0d0d0d;border:1px solid #2a2a2a;border-radius:10px}
.sl-ck input{width:16px;height:16px;accent-color:#dff20d;margin:1px 0 0;flex:none;cursor:pointer}
.sl-err{display:none;background:#241615;border:1px solid #4a2523;color:#ff8a80;border-radius:10px;
  padding:10px 13px;font-size:13px;margin-bottom:14px}
.sl-row2{display:flex;gap:10px;margin-top:20px}
.sl-btn{flex:1;appearance:none;border:0;border-radius:11px;font:inherit;font-size:14px;font-weight:700;
  padding:12px;cursor:pointer}
.sl-btn.pri{background:#dff20d;color:#0d0d0d}
.sl-btn.pri:hover{background:#eaff2b}
.sl-btn.pri:disabled{opacity:.5;cursor:default}
.sl-btn.sec{background:#1e1e1e;color:#c8c8c8;border:1px solid #2a2a2a}
.sl-btn.sec:hover{background:#252525}

/* ── QR modal ── */
.sl-qrbox{text-align:center}
.sl-qrbox .qw{background:#fff;border-radius:14px;padding:16px;display:inline-block;margin-bottom:16px}
.sl-qrbox .qw svg{display:block;width:220px;height:220px}
.sl-qrurl{color:#dff20d;font-family:ui-monospace,Menlo,monospace;font-size:13px;word-break:break-all;margin-bottom:18px}

/* ── Toast ── */
#slToast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#dff20d;color:#0d0d0d;
  font-weight:700;font-size:13px;padding:11px 20px;border-radius:11px;z-index:600;opacity:0;
  pointer-events:none;transition:.22s}
#slToast.show{opacity:1;transform:translate(-50%,0)}

/* ── Ô rút gọn trong form tạo QR ── */
.sl-inline{margin-top:2px}
#slCodeWrap{margin-top:10px;display:none}

@media(max-width:640px){
  .sl-modal{padding:20px}
  .sl-new{width:100%;justify-content:center}
}
</style>

    var _dataList = [];

        var modules = new Array(moduleCount);

      var bytes = [];

const API_URL    = './api/qr-api.php';

// ── API helpers ───────────────────────────────────────────────
async function apiCall(method, params, body) {
  const url = new URL(API_URL, location.href);
  if (params) Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  const opts = { method, headers: { 'Content-Type': 'application/json', 'X-API-Key': API_SECRET } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  return res.json();
}

// ── Type toggle ───────────────────────────────────────────────
function setType(type) {
  currentType = type;
  document.getElementById('btnTypeEvent').classList.toggle('active', type === 'event');
  document.getElementById('btnTypeLink').classList.toggle('active', type === 'link');
  document.getElementById('eventFields').style.display = type === 'event' ? '' : 'none';
  document.getElementById('linkFields').style.display  = type === 'link'  ? '' : 'none';
  document.getElementById('errorForm').style.display = 'none';
}

// ── View routing ──────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  const wrap = document.querySelector('.wrap');
  if (name === 'history') wrap.classList.add('wrap-full');
  else wrap.classList.remove('wrap-full');
  const navBtn   = document.getElementById('navBtn');
  const navTitle = document.getElementById('navTitle');
  if (name === 'history') {
    navTitle.textContent = 'Quản lý Link';
    navBtn.style.display = 'inline-flex';
    navBtn.onclick = () => { editingId = null; clearForm(); showView('form'); };
    loadAndRenderHistory();
  } else if (name === 'form') {
    navTitle.textContent = editingId ? 'Chỉnh sửa QR' : 'Tạo QR mới';
    navBtn.style.display = 'none';
    document.getElementById('errorForm').style.display = 'none';
  } else if (name === 'result') {
    navTitle.textContent = 'Mã QR';
    navBtn.style.display = 'none';
  }
}

// ── Defaults ──────────────────────────────────────────────────
const pad2    = n => String(n).padStart(2, '0');
const toLocal = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`;

function clearForm() {
  const now = new Date();
  document.getElementById('eventName').value   = '';
  document.getElementById('startTime').value   = toLocal(new Date(now.getTime() + 3600000));
  document.getElementById('endTime').value     = toLocal(new Date(now.getTime() + 7200000));
  document.getElementById('location').value    = '';
  document.getElementById('description').value = '';
  document.getElementById('linkUrl').value     = '';
  document.getElementById('linkLabel').value   = '';
  setType('event');
}
clearForm();

// ── Helpers ───────────────────────────────────────────────────
function formatICSDate(dt) { return new Date(dt).toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z'; }
function formatDisplayDate(dt) {
  if (!dt) return '';
  return new Date(dt).toLocaleString('vi-VN', { dateStyle: 'medium', timeStyle: 'short' });
}
function buildICS(name, start, end, location, desc) {
  const icsUid = Date.now().toString(36).toUpperCase() + '@APSA';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//APSA//QR//VI',
    'BEGIN:VEVENT','UID:' + icsUid,
    'DTSTART:' + formatICSDate(start),'DTEND:' + formatICSDate(end),
    'SUMMARY:' + name,
    location ? 'LOCATION:' + location : '',
    desc      ? 'DESCRIPTION:' + desc.replace(/\n/g,' ') : '',
    'END:VEVENT','END:VCALENDAR'
  ].filter(Boolean).join('\r\n');
}
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function safeName() {
  const n = currentType === 'link'
    ? (document.getElementById('linkLabel').value.trim() || document.getElementById('linkUrl').value.trim() || 'link')
    : (document.getElementById('eventName').value.trim() || 'event');
  return n.replace(/\s+/g,'-').slice(0,40);
}
function showFormError(msg) {
  const el = document.getElementById('errorForm');
  el.textContent = msg;
  el.style.display = 'block';
}

// ── Build clean SVG ───────────────────────────────────────────
function buildQRSVG(qr) {
  const cell = 6, margin = 6;
  const count = qr.getModuleCount();
  const size  = count * cell + margin * 2;
  let rects = '';
  for (let r = 0; r < count; r++)
    for (let c = 0; c < count; c++)
      if (qr.isDark(r, c))
        rects += `<rect x="${c*cell+margin}" y="${r*cell+margin}" width="${cell}" height="${cell}"/>`;
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">\n  <rect width="${size}" height="${size}" fill="white"/>\n  <g fill="black">${rects}</g>\n</svg>`;
}

function renderQR(data) {
  const qr = qrcode(0, 'L');
  qr.addData(data, 'Byte');
  qr.make();
  const canvas     = document.getElementById('qrCanvas');
  const count      = qr.getModuleCount();
  const cellSize   = Math.floor(240 / count);
  const actualSize = count * cellSize;
  canvas.width  = actualSize;
  canvas.height = actualSize;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, actualSize, actualSize);
  qr.renderTo2dContext(ctx, cellSize);
  currentSVG = buildQRSVG(qr);
}

// ── Generate QR ───────────────────────────────────────────────
function generateQR() {
  document.getElementById('errorForm').style.display = 'none';
  if (currentType === 'link') generateLinkQR();
  else generateEventQR();
}

async function generateEventQR() {
  const name  = document.getElementById('eventName').value.trim();
  const start = document.getElementById('startTime').value;
  const end   = document.getElementById('endTime').value;
  const loc   = document.getElementById('location').value.trim();
  const desc  = document.getElementById('description').value.trim();
  if (!name)  { showFormError('Vui lòng nhập tên sự kiện!'); return; }
  if (!start) { showFormError('Vui lòng chọn thời gian bắt đầu!'); return; }
  if (!end)   { showFormError('Vui lòng chọn thời gian kết thúc!'); return; }
  if (new Date(end) <= new Date(start)) { showFormError('Thời gian kết thúc phải sau thời gian bắt đầu!'); return; }
  const btn = document.getElementById('btnGenerate');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Đang tạo…';
  try {
    renderQR(buildICS(name, start, end, loc, desc));
    renderSummary({ type: 'event', name, start, end, loc, desc });
    showView('result');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    await autoSaveQR();
  } catch(err) { showFormError('Lỗi tạo QR: ' + (err.message || err)); }
  finally { btn.disabled = false; btn.innerHTML = '<svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-bolt"/></svg> Tạo mã QR'; }
}

async function generateLinkQR() {
  const url   = document.getElementById('linkUrl').value.trim();
  const label = document.getElementById('linkLabel').value.trim();
  if (!url) { showFormError('Vui lòng nhập URL!'); return; }
  try { new URL(url); } catch { showFormError('URL không hợp lệ (ví dụ: https://apsa.agency)'); return; }
  const btn = document.getElementById('btnGenerate');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Đang tạo…';
  try {
    renderQR(url);
    renderSummary({ type: 'link', url, name: label || url });
    showView('result');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    await autoSaveQR();
  } catch(err) { showFormError('Lỗi tạo QR: ' + (err.message || err)); }
  finally { btn.disabled = false; btn.innerHTML = '<svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-bolt"/></svg> Tạo mã QR'; }
}

async function saveQR() {
  if (!currentSVG) return;
  const btn = document.getElementById('btnSave');
  btn.disabled = true;
  btn.textContent = '⏳ Đang lưu…';

  const canvas = document.getElementById('qrCanvas');
  const padPx = 20;
  const out = document.createElement('canvas');
  out.width  = canvas.width  + padPx * 2;
  out.height = canvas.height + padPx * 2;
  const ctx2 = out.getContext('2d');
  ctx2.fillStyle = '#fff';
  ctx2.fillRect(0, 0, out.width, out.height);
  ctx2.drawImage(canvas, padPx, padPx);

  const payload = currentType === 'link'
    ? { type: 'link',  name: document.getElementById('linkLabel').value.trim() || document.getElementById('linkUrl').value.trim(), url: document.getElementById('linkUrl').value.trim(), svg: currentSVG, png: out.toDataURL('image/png') }
    : { type: 'event', name: document.getElementById('eventName').value.trim(), start: document.getElementById('startTime').value, end: document.getElementById('endTime').value, loc: document.getElementById('location').value.trim(), description: document.getElementById('description').value.trim(), svg: currentSVG, png: out.toDataURL('image/png') };

  try {
    let res;
    if (editingId) {
      res = await apiCall('PUT', { id: editingId }, payload);
    } else {
      res = await apiCall('POST', null, payload);
      if (res.ok) editingId = res.data.id;
    }
    if (!res.ok) throw new Error(res.error);
    document.getElementById('savedBadge').style.display = 'inline-block';
    btn.innerHTML = '<svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-refresh"/></svg> Cập nhật';
    btn.style.background = 'linear-gradient(135deg,#b9cc00,#b9cc00)';
    btn.disabled = false;
    btn.onclick = saveQR; // bấm để cập nhật lại nếu có chỉnh sửa
  } catch(e) {
    btn.textContent = 'Lỗi: ' + e.message;
    btn.disabled = false;
  }
}

function downloadSVG() {
  if (!currentSVG) return;
  const blob = new Blob([currentSVG], { type: 'image/svg+xml;charset=utf-8' });
  const a = document.createElement('a');
  a.download = 'QR-' + safeName() + '.svg';
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function downloadPNG() {
  const canvas = document.getElementById('qrCanvas');
  if (!canvas.width) return;
  const padPx = 24;
  const out = document.createElement('canvas');
  out.width  = canvas.width  + padPx * 2;
  out.height = canvas.height + padPx * 2;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(canvas, padPx, padPx);
  const a = document.createElement('a');
  a.download = 'QR-' + safeName() + '.png';
  a.href = out.toDataURL('image/png');
  a.click();
}

// ── Load & render history from DB ─────────────────────────────
async function loadAndRenderHistory() {
  const container = document.getElementById('historyContent');
  container.innerHTML = '<div style="text-align:center;padding:32px;color:#555;font-size:13px;">⏳ Đang tải…</div>';

function renderHistory(list) {
  const container = document.getElementById('historyContent');
  if (!list || list.length === 0) {
    container.innerHTML = `
      <div class="history-empty">
        <span class="e-icon"><svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-folder"/></svg></span>
        <p>Chưa có QR nào được lưu.<br>Tạo QR đầu tiên để bắt đầu!</p>
        <button class="btn-new-empty" onclick="showView('form')">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          Tạo QR đầu tiên
        </button>
      </div>`;
    return;
  }

  const items = list.map(entry => {
    const isLink = entry.type === 'link';
    const badge  = isLink
      ? `<span class="h-type link"><svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-link"/></svg> Link</span>`
      : `<span class="h-type event"><svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-calendar"/></svg> Sự kiện</span>`;
    const meta   = isLink
      ? (entry.url || '').replace(/^https?:\/\//, '').slice(0, 36)
      : entry.start ? new Date(entry.start).toLocaleDateString('vi-VN', {day:'2-digit',month:'2-digit',year:'numeric'}) : '';
    const thumb  = entry.svg
      ? entry.svg.replace(/width="[^"]*"/, 'width="100%"').replace(/height="[^"]*"/, 'height="100%"')
      : '';

    return `
    <div class="h-card" onclick="viewEntry(${entry.id})">
      <div class="h-qr-wrap">${thumb}</div>
      <div class="h-card-body">
        ${badge}
        <div class="h-card-name" title="${escHtml(entry.name)}">${escHtml(entry.name)}</div>
        <div class="h-card-meta">${escHtml(meta)}</div>
      </div>
      <div class="h-card-btns" onclick="event.stopPropagation()">
        <button class="h-card-btn" title="Sửa" onclick="editEntry(${entry.id}, ${JSON.stringify(entry).replace(/"/g,'&quot;')})"><svg class='pill-ico' viewBox='0 0 48 48' aria-hidden='true'><use href='#i-pen'/></svg></button>
        <button class="h-card-btn" onclick="historyDLSVG(${entry.id}, event)">SVG</button>
        <button class="h-card-btn" onclick="historyDLPNG(${entry.id}, event)">PNG</button>
        <button class="h-card-btn del" title="Xóa" onclick="deleteEntry(${entry.id}, event)"><svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-trash"/></svg></button>
      </div>
    </div>`;
  }).join('');

  container.innerHTML =
    `<div class="history-topbar">
       <div class="history-topbar-left">QR đã lưu <span class="history-count">${list.length}</span></div>
       <button class="btn-clear-all" onclick="clearAll()">Xóa tất cả</button>
     </div>` +
    `<div class="history-grid">${items}</div>`;
  window._qrList = list;
}

// ── View saved entry ──────────────────────────────────────────
function viewEntry(id) {
  const entry = (window._qrList || []).find(e => e.id === id);
  if (!entry) return;
  editingId   = entry.id;
  currentType = entry.type || 'event';
  if (currentType === 'link') {
    document.getElementById('linkUrl').value   = entry.url  || '';
    document.getElementById('linkLabel').value = entry.name || '';
  } else {
    document.getElementById('eventName').value   = entry.name        || '';
    document.getElementById('startTime').value   = entry.start       || '';
    document.getElementById('endTime').value     = entry.end         || '';
    document.getElementById('location').value    = entry.loc         || '';
    document.getElementById('description').value = entry.description || '';
  }
  currentSVG = entry.svg;
  renderStoredSVGToCanvas(entry.svg, document.getElementById('qrCanvas'));
  renderSummary(currentType === 'link'
    ? { type: 'link',  url: entry.url, name: entry.name }
    : { type: 'event', name: entry.name, start: entry.start, end: entry.end, loc: entry.loc, desc: entry.description });
  document.getElementById('savedBadge').style.display = 'inline-block';
  const btn = document.getElementById('btnSave');
  btn.innerHTML = '<svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-refresh"/></svg> Cập nhật';
  btn.style.background = 'linear-gradient(135deg,#b9cc00,#b9cc00)';
  btn.disabled = false;
  btn.onclick = saveQR;
  showView('result');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderStoredSVGToCanvas(svgStr, canvas) {
  const doc   = new DOMParser().parseFromString(svgStr, 'image/svg+xml');
  const svgEl = doc.querySelector('svg');
  if (!svgEl) return;
  const w = parseInt(svgEl.getAttribute('width')) || 200;
  const h = parseInt(svgEl.getAttribute('height')) || 200;
  canvas.width  = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#000';
  svgEl.querySelectorAll('rect[x]').forEach(r => {
    ctx.fillRect(parseFloat(r.getAttribute('x')), parseFloat(r.getAttribute('y')), parseFloat(r.getAttribute('width')), parseFloat(r.getAttribute('height')));
  });
}

// ── Edit entry ────────────────────────────────────────────────
function editEntry(id, entry) {

    document.getElementById('linkLabel').value = entry.name || '';
  } else {
    document.getElementById('eventName').value   = entry.name        || '';
    document.getElementById('startTime').value   = entry.start       || '';
    document.getElementById('endTime').value     = entry.end         || '';
    document.getElementById('location').value    = entry.loc         || '';

}

const SL_API  = './api/short-api.php';

const slEsc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

function slToast(msg) {
  const t = document.getElementById('slToast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2000);
}

async function slApi(action, opts) {
  opts = opts || {};
  const init = { method: opts.method || (opts.body ? 'POST' : 'GET'), credentials: 'same-origin' };
  if (opts.body) {
    init.headers = { 'Content-Type': 'application/json' };
    init.body    = JSON.stringify(opts.body);
  }
  const res = await fetch(SL_API + '?action=' + action + (opts.query || ''), init);
  let j = null;
  try { j = await res.json(); } catch (e) { /* ignore */ }
  if (!res.ok || !j || j.ok === false) {
    throw new Error((j && j.error) || ('Lỗi ' + res.status));
  }
  return j.data;
}

// ── Danh sách ────────────────────────────────────────

  const box = document.getElementById('slList');

    slFilter();

}

function slFilter() {
  const q    = (document.getElementById('slQ').value || '').trim().toLowerCase();

    (r.name || '').toLowerCase().includes(q) ||
    (r.url  || '').toLowerCase().includes(q) ||
    (r.code || '').toLowerCase().includes(q));

}

// ── Sao chép ─────────────────────────────────────────
function slCopy(id) {
  const r = SL_ALL.find(x => x.id === id);
  if (!r) return;
  const write = txt => {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(txt);
    return new Promise(res => {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); res();
    });
  };
  write(r.short).then(() => slToast('Đã sao chép link')).catch(() => slToast('Không sao chép được'));
}

// ── Form tạo / sửa ───────────────────────────────────
function slOpenForm(id) {
  SL_EDIT = id || null;
  const r = id ? SL_ALL.find(x => x.id === id) : null;

  document.getElementById('slFormTitle').textContent = r ? 'Cập nhật link rút gọn' : 'Tạo link rút gọn';
  document.getElementById('slUrl').value    = r ? r.url  : '';
  document.getElementById('slName').value   = r ? (r.name || '') : '';
  document.getElementById('slCode').value   = r ? r.code : '';
  document.getElementById('slPublic').checked = r ? !!r.is_public : true;
  document.getElementById('slPrefix').textContent = location.host + '/u/';

  const err = document.getElementById('slFormErr');
  err.style.display = 'none'; err.textContent = '';

  document.getElementById('slFormOv').classList.add('open');
  setTimeout(() => document.getElementById('slUrl').focus(), 60);
}

function slCloseForm() {
  document.getElementById('slFormOv').classList.remove('open');
  SL_EDIT = null;
}

function slFormError(msg) {
  const err = document.getElementById('slFormErr');
  err.textContent = msg;
  err.style.display = 'block';
}

async function slSave() {
  const url    = document.getElementById('slUrl').value.trim();
  const name   = document.getElementById('slName').value.trim();
  const code   = document.getElementById('slCode').value.trim();
  const pub    = document.getElementById('slPublic').checked;
  const btn    = document.getElementById('slSaveBtn');

  if (!url) { slFormError('Vui lòng nhập link đích.'); return; }
  if (code && !/^[A-Za-z0-9_-]{3,32}$/.test(code)) {
    slFormError('Mã chỉ gồm chữ, số, gạch ngang, gạch dưới — dài 3 đến 32 ký tự.');
    return;
  }

  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = 'Đang lưu…';

  try {
    const body = { url, name, code, is_public: pub };
    if (SL_EDIT) body.id = SL_EDIT;
    await slApi(SL_EDIT ? 'update' : 'create', { body });
    slCloseForm();
    await slLoad();
    slToast(SL_EDIT ? 'Đã cập nhật link' : 'Đã tạo link rút gọn');
  } catch (e) {
    slFormError(e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

async function slDelete(id) {
  const r = SL_ALL.find(x => x.id === id);
  if (!r) return;
  if (!confirm('Xoá link “' + (r.name || r.code) + '”?\n\nMọi mã QR đang trỏ tới link này sẽ ngừng hoạt động.')) return;
  try {
    await slApi('delete', { body: { id } });
    await slLoad();
    slToast('Đã xoá link');
  } catch (e) {
    alert('Không xoá được: ' + e.message);
  }
}

// ── QR của link rút gọn ──────────────────────────────
function slQrSvgFor(text) {
  const qr = qrcode(0, 'L');
  qr.addData(text, 'Byte');
  qr.make();
  return buildQRSVG(qr);
}

function slShowQr(id) {
  const r = SL_ALL.find(x => x.id === id);
  if (!r) return;
  SL_QR = { svg: slQrSvgFor(r.short), name: r.code };
  document.getElementById('slQrTitle').textContent = r.name || 'Mã QR';
  document.getElementById('slQrImg').innerHTML     = SL_QR.svg;
  document.getElementById('slQrUrl').textContent   = r.short;
  document.getElementById('slQrOv').classList.add('open');
}

function slCloseQr() { document.getElementById('slQrOv').classList.remove('open'); }

function slDlQr(kind) {
  if (!SL_QR.svg) return;
  const base = 'qr-' + (SL_QR.name || 'link');
  if (kind === 'svg') {
    const blob = new Blob([SL_QR.svg], { type: 'image/svg+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = base + '.svg';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    return;
  }
  const img = new Image();
  const b64 = btoa(unescape(encodeURIComponent(SL_QR.svg)));
  img.onload = function () {
    const cv = document.createElement('canvas');
    cv.width = 1024; cv.height = 1024;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#fff';
    cx.fillRect(0, 0, 1024, 1024);
    cx.drawImage(img, 0, 0, 1024, 1024);
    cv.toBlob(function (b) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = base + '.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
    });
  };
  img.src = 'data:image/svg+xml;base64,' + b64;
}

// ── Rút gọn link ngay trong luồng tạo QR ─────────────
const __slGenLinkOrig = generateLinkQR;
window.generateLinkQR = async function () {
  const chk = document.getElementById('linkShorten');
  if (!chk || !chk.checked) { return __slGenLinkOrig(); }

  const rawUrl = document.getElementById('linkUrl').value.trim();
  const label  = document.getElementById('linkLabel').value.trim();
  const code   = (document.getElementById('slInlineCode').value || '').trim();

  if (!rawUrl) { showFormError('Vui lòng nhập URL!'); return; }
  try { new URL(rawUrl); } catch (e) {
    showFormError('URL không hợp lệ (ví dụ: https://apsa.agency)');
    return;
  }
  if (code && !/^[A-Za-z0-9_-]{3,32}$/.test(code)) {
    showFormError('Mã rút gọn chỉ gồm chữ, số, gạch ngang, gạch dưới — dài 3 đến 32 ký tự.');
    return;
  }

  const btn = document.getElementById('btnGenerate');
  btn.disabled  = true;
  btn.innerHTML = '<span class="spinner"></span>Đang rút gọn…';

  let short;
  try {
    short = await slApi('create', { body: { url: rawUrl, name: label, code, is_public: true } });
  } catch (e) {
    showFormError('Không rút gọn được link: ' + e.message);
    btn.disabled  = false;
    btn.innerHTML = '<svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-bolt"/></svg> Tạo mã QR';
    return;
  }

  // Dùng link rút gọn làm nội dung QR, rồi chạy tiếp luồng gốc
  document.getElementById('linkUrl').value = short.short;
  chk.checked = false;
  slToggleShorten();
  document.getElementById('slInlineCode').value = '';

  btn.disabled  = false;
  btn.innerHTML = '<svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-bolt"/></svg> Tạo mã QR';

  await __slGenLinkOrig();
  slToast('Đã rút gọn: ' + short.short);
};

// ── Phím tắt: Esc đóng modal ─────────────────────────
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('slQrOv').classList.contains('open'))   slCloseQr();
  else if (document.getElementById('slFormOv').classList.contains('open')) slCloseForm();
});

// ── Khởi tạo nhãn tên miền ───────────────────────────
(function () {
  const p = document.getElementById('slInlinePrefix');
  if (p) p.textContent = location.host + '/u/';
})();
</script>
<script id="apsa-sl-deeplink">if(/[?&]tab=short/.test(location.search))showView("short");</script>
