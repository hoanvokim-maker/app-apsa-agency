<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1">
  <meta name="theme-color" content="#dff20d">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>APSA — Duyệt video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Oxanium:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/theme.css?v=22" />
<style>
  :root {
    --bg: #000; --bg2: #0b0b0b; --bg3: #141414; --bg4: #1c1c1c;
    --border: rgba(255,255,255,.08); --border-h: rgba(255,255,255,.16);
    --text: #fff; --text2: #9a9a9a; --text3: #5e5e5e;
    --green: #dff20d; --pink: #c9dd00; --red: #ff4d4d; --sky: #56ccf2;
    --ok: #22c55e; --gold: #facc15; --blue: #3894ff;
  }
  body { font-family: 'Oxanium', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 100; background: rgba(0,0,0,.9); backdrop-filter: blur(16px);
           border-bottom: 1px solid var(--border); height: 60px; padding: 0 28px;
           display: flex; align-items: center; justify-content: space-between; }
  .logo img { height: 26px; filter: brightness(0) invert(1); opacity: .9; display: block; }
  .back-btn { display: flex; align-items: center; gap: 6px; color: var(--text2); text-decoration: none;
              font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); }
  .back-btn:hover { color: var(--text); border-color: var(--border-h); }
  .page-head { padding: 30px 28px 14px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
  .page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  .page-head p { font-size: 13px; color: var(--text2); margin-top: 4px; max-width: 900px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--text2); }
  .stats b { color: var(--green); font-weight: 800; }
  .spacer { flex: 1 1 auto; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; }
  header .who { font-size: 12px; color: var(--muted, #9aa0a6); }

  .rv { max-width: 1560px; margin: 0 auto; padding: 4px 22px 60px; }
  .rv-head h1 { font-size: 22px; letter-spacing: .3px; margin-bottom: 4px; }
  .rv-head p { font-size: 13px; color: #9aa0a6; }
  .rv-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; margin-top: 16px; align-items: start; }
  @media (max-width: 1080px) { .rv-grid { grid-template-columns: minmax(0, 1fr); } }

  .card { background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.09); border-radius: 14px; }
  .stage { position: relative; background: #000; border-radius: 14px 14px 0 0; overflow: hidden; }
  .stage video { display: block; width: 100%; max-height: 66vh; background: #000; }
  #draw { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; z-index: 3; }
  .stage.drawing #draw { display: block; }
  .stage.drawing video { visibility: hidden; }
  .stage.drawing::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px #dff20d; border-radius: 14px 14px 0 0; pointer-events: none; z-index: 4; }

  .bar { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.08); }
  .tl { position: relative; height: 26px; margin-bottom: 8px; }
  .tl .rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 4px; background: rgba(255,255,255,.13); }
  .tl .mk { position: absolute; top: 4px; width: 3px; height: 18px; border-radius: 3px; background: #dff20d; cursor: pointer; transform: translateX(-1px); }
  .tl .mk.done { background: #4ade80; opacity: .55; }
  .tl .mk:hover { box-shadow: 0 0 0 3px rgba(223,242,13,.25); }
  .tl .cur { position: absolute; top: 2px; width: 2px; height: 22px; background: #fff; opacity: .85; pointer-events: none; }

  .ctrls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .vb { font: inherit; font-size: 12.5px; padding: 7px 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,.14);
         background: rgba(255,255,255,.05); color: #e9eaec; cursor: pointer; white-space: nowrap; transition: .15s; }
  .vb:hover { background: rgba(255,255,255,.1); }
  .vb.pri { background: #dff20d; color: #101010; border-color: #dff20d; font-weight: 700; }
  .vb.pri:hover { filter: brightness(1.08); }
  .vb.on { background: rgba(223,242,13,.16); border-color: #dff20d; color: #dff20d; }
  .vb:disabled { opacity: .4; cursor: default; }
  .tcode { font-family: 'Oxanium', monospace; font-size: 15px; font-weight: 700; color: #dff20d; padding: 0 8px; min-width: 96px; }
  .sp { flex: 1; }

  .cmp { padding: 12px; border-top: 1px solid rgba(255,255,255,.08); display: none; }
  .cmp.open { display: block; }
  .cmp .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  input[type="text"], textarea { font: inherit; font-size: 13.5px; color: #e9eaec; background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.14); border-radius: 9px; padding: 9px 11px; width: 100%; outline: none; }
  input[type="text"]:focus, textarea:focus { border-color: #dff20d; }
  textarea { min-height: 74px; resize: vertical; }
  .cmp .name { max-width: 240px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 0; }
  .thumb { position: relative; width: 92px; height: 62px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.15); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb b { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.75);
             color: #fff; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; }

  .pens { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid rgba(255,255,255,.08); display: none; }
  .pens.open { display: flex; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); cursor: pointer; }
  .sw.on { border-color: #fff; transform: scale(1.12); }

  .list { padding: 12px; max-height: 76vh; overflow: auto; }
  .list h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: #9aa0a6; margin-bottom: 10px; }
  .cm { border: 1px solid rgba(255,255,255,.09); border-radius: 11px; padding: 10px; margin-bottom: 9px; background: rgba(255,255,255,.03); }
  .cm.done { opacity: .5; }
  .cm .top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .cm .ts { font-family: 'Oxanium', monospace; font-weight: 700; font-size: 12.5px; color: #101010; background: #dff20d;
            border: 0; border-radius: 6px; padding: 2px 7px; cursor: pointer; }
  .cm .au { font-size: 12.5px; font-weight: 600; }
  .cm .dt { font-size: 11px; color: #7d838a; margin-left: auto; }
  .cm .bd { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .cm img.att { margin-top: 7px; width: 100%; border-radius: 8px; cursor: zoom-in; display: block; }
  .cm .acts { display: flex; gap: 6px; margin-top: 7px; }
  .cm .acts button { font: inherit; font-size: 11.5px; padding: 4px 8px; border-radius: 7px; cursor: pointer;
                     border: 1px solid rgba(255,255,255,.14); background: transparent; color: #9aa0a6; }
  .cm .acts button:hover { color: #e9eaec; border-color: rgba(255,255,255,.3); }
  .empty { font-size: 12.5px; color: #7d838a; text-align: center; padding: 22px 0; }

  .lb { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 90; padding: 24px; }
  .lb.open { display: flex; }
  .lb img { max-width: 96%; max-height: 92%; border-radius: 10px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #dff20d; color: #101010;
           font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .2s; z-index: 99; }
  .toast.on { opacity: 1; }
  .err { padding: 40px 22px; text-align: center; color: #ff8080; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="logo"><img src="/Logo%20rectange.png" alt="APSA" /></div>
  <div class="who" id="who"></div>
</header>

<div class="rv" id="root" style="display:none">
  <div class="rv-head">
    <h1 id="ttl">…</h1>
    <p id="note"></p>
  </div>

  <div class="rv-grid">
    <div class="card">
      <div class="stage" id="stage">
        <video id="v" playsinline preload="metadata" controls controlslist="nodownload"></video>
        <canvas id="draw"></canvas>
      </div>

      <div class="bar">
        <div class="tl" id="tl"><div class="rail"></div><div class="cur" id="cur" style="left:0"></div></div>
        <div class="ctrls">
          <button class="vb" id="bPlay" onclick="tog()">▶ Phát</button>
          <button class="vb" onclick="step(-1)">⏪ 1s</button>
          <button class="vb" onclick="step(-0.04)">◀|</button>
          <button class="vb" onclick="step(0.04)">|▶</button>
          <button class="vb" onclick="step(1)">1s ⏩</button>
          <span class="tcode" id="tc">00:00.0</span>
          <span class="sp"></span>
          <button class="vb pri" onclick="openCmp()">＋ Góp ý tại giây này</button>
        </div>
      </div>

      <div class="pens" id="pens">
        <span style="font-size:12px;color:#9aa0a6">Bút:</span>
        <span class="sw on" style="background:#ff2d55" onclick="setPen(this,'#ff2d55')"></span>
        <span class="sw" style="background:#dff20d" onclick="setPen(this,'#dff20d')"></span>
        <span class="sw" style="background:#38bdf8" onclick="setPen(this,'#38bdf8')"></span>
        <span class="sw" style="background:#4ade80" onclick="setPen(this,'#4ade80')"></span>
        <span class="sw" style="background:#ffffff" onclick="setPen(this,'#ffffff')"></span>
        <button class="vb" onclick="setW(3)">Mảnh</button>
        <button class="vb" onclick="setW(7)">Vừa</button>
        <button class="vb" onclick="setW(14)">Đậm</button>
        <button class="vb" onclick="undo()">↶ Hoàn tác</button>
        <span class="sp"></span>
        <button class="vb" onclick="drawOff(0)">Hủy vẽ</button>
        <button class="vb pri" onclick="drawOff(1)">✓ Xong, đính vào góp ý</button>
      </div>

      <div class="cmp" id="cmp">
        <div class="row">
          <input type="text" class="name" id="au" placeholder="Tên của bạn" maxlength="120" />
          <span class="tcode" id="tc2">00:00.0</span>
          <span class="sp"></span>
          <button class="vb" onclick="drawOn()">✎ Vẽ lên khung hình</button>
          <button class="vb" onclick="fi.click()">🖼 Chèn ảnh</button>
        </div>
        <textarea id="bd" placeholder="Nhập góp ý cho giây này… (có thể dán ảnh trực tiếp bằng Ctrl+V)"></textarea>
        <div class="thumbs" id="thumbs"></div>
        <div class="row" style="margin-top:10px">
          <span class="sp"></span>
          <button class="vb" onclick="closeCmp()">Đóng</button>
          <button class="vb pri" id="bSend" onclick="send()">Gửi góp ý</button>
        </div>
      </div>
    </div>

    <div class="card list">
      <h3 id="lh">Góp ý</h3>
      <div id="cl"></div>
    </div>
  </div>
</div>

<div class="err" id="err" style="display:none"></div>
<div class="lb" id="lb" onclick="this.classList.remove('open')"><img id="lbi" src="" alt="" /></div>
<div class="toast" id="toast"></div>
<input type="file" id="fi" accept="image/*" multiple style="display:none" />

<script>
var API = './api/review-api.php';
var T = new URLSearchParams(location.search).get('t') || '';
var v, cv, cx, fi, INFO = null, CM = [], IMGS = [], ADMIN = 0;
var pen = '#ff2d55', pw = 7, snaps = [], drawing = false, dpt = null;

function el(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(m) { var t = el('toast'); t.textContent = m; t.classList.add('on'); setTimeout(function () { t.classList.remove('on'); }, 1900); }
function fmt(ms) { var s = ms / 1000, m = Math.floor(s / 60), r = s - m * 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); }

function api(action, body) {
  var u = API + '?action=' + action + '&t=' + encodeURIComponent(T);
  var o = { credentials: 'same-origin' };
  if (body) { o.method = 'POST'; o.headers = { 'Content-Type': 'application/json' }; o.body = JSON.stringify(body); }
  return fetch(u, o).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error || 'Lỗi'); return j.data; });
}

/* ── khởi động ─────────────────────────────────────────── */
function boot() {
  v = el('v'); cv = el('draw'); cx = cv.getContext('2d'); fi = el('fi');
  if (!T) { fail('Thiếu mã liên kết.'); return; }
  api('open').then(function (d) {
    INFO = d; ADMIN = d.admin ? 1 : 0;
    el('root').style.display = '';
    el('ttl').textContent = d.title || d.file_name;
    el('note').textContent = d.note || '';
    el('who').textContent = d.file_name;
    document.title = 'Duyệt video — ' + (d.title || d.file_name);
    v.src = API + '?action=stream&t=' + encodeURIComponent(T);
    loadCm();
  }).catch(function (e) { fail(e.message); });

  v.addEventListener('timeupdate', tick);
  v.addEventListener('seeked', tick);
  v.addEventListener('loadedmetadata', function () { tick(); paintTl(); });
  v.addEventListener('play', function () { el('bPlay').textContent = '❚❚ Dừng'; });
  v.addEventListener('pause', function () { el('bPlay').textContent = '▶ Phát'; });
  v.addEventListener('error', function () { toast('Không tải được video.'); });

  el('tl').addEventListener('click', function (e) {
    if (!v.duration) return;
    var r = this.getBoundingClientRect();
    v.pause(); v.currentTime = Math.max(0, Math.min(v.duration, (e.clientX - r.left) / r.width * v.duration));
  });

  var n = localStorage.getItem('rv_name'); if (n) el('au').value = n;

  fi.addEventListener('change', function () {
    for (var i = 0; i < fi.files.length; i++) addFile(fi.files[i]);
    fi.value = '';
  });
  document.addEventListener('paste', function (e) {
    if (!el('cmp').classList.contains('open')) return;
    var it = e.clipboardData && e.clipboardData.items; if (!it) return;
    for (var i = 0; i < it.length; i++) if (it[i].type.indexOf('image/') === 0) { addFile(it[i].getAsFile()); e.preventDefault(); }
  });
  ['dragover', 'drop'].forEach(function (ev) {
    el('cmp').addEventListener(ev, function (e) { e.preventDefault();
      if (ev === 'drop' && e.dataTransfer) for (var i = 0; i < e.dataTransfer.files.length; i++) addFile(e.dataTransfer.files[i]); });
  });

  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) return;
    if (e.key === ' ') { e.preventDefault(); tog(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(e.shiftKey ? -1 : -0.04); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(e.shiftKey ? 1 : 0.04); }
  });

  cv.addEventListener('pointerdown', pd); cv.addEventListener('pointermove', pm);
  window.addEventListener('pointerup', pu);
}
function fail(m) { el('err').style.display = ''; el('err').textContent = m; }

function tick() {
  var ms = Math.round((v.currentTime || 0) * 1000);
  el('tc').textContent = fmt(ms); el('tc2').textContent = fmt(ms);
  if (v.duration) el('cur').style.left = (v.currentTime / v.duration * 100) + '%';
}
function tog() { if (v.paused) v.play(); else v.pause(); }
function step(d) { v.pause(); v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + d)); }
function seek(ms) { v.pause(); v.currentTime = ms / 1000; window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ── góp ý ─────────────────────────────────────────────── */
function loadCm() {
  api('comments').then(function (d) {
    CM = d.rows || []; ADMIN = d.admin ? 1 : 0; renderCm(); paintTl();
  }).catch(function (e) { toast(e.message); });
}
function renderCm() {
  var open = CM.filter(function (c) { return !Number(c.resolved); }).length;
  el('lh').textContent = 'Góp ý — ' + CM.length + ' mục' + (open ? ' · ' + open + ' chưa xử lý' : '');
  if (!CM.length) { el('cl').innerHTML = '<div class="empty">Chưa có góp ý nào.<br />Dừng video tại giây cần góp ý rồi bấm “Góp ý tại giây này”.</div>'; return; }
  el('cl').innerHTML = CM.map(function (c) {
    var im = Number(c.has_img) ? '<img class="att" src="' + API + '?action=img&t=' + encodeURIComponent(T) + '&id=' + c.id +
      '" onclick="lb(this.src)" alt="" />' : '';
    var ac = ADMIN ? '<div class="acts"><button onclick="res(' + c.id + ',' + (Number(c.resolved) ? 0 : 1) + ')">' +
      (Number(c.resolved) ? '↩ Mở lại' : '✓ Đã xử lý') + '</button><button onclick="cdel(' + c.id + ')">Xóa</button></div>' : '';
    return '<div class="cm' + (Number(c.resolved) ? ' done' : '') + '">' +
      '<div class="top"><button class="ts" onclick="seek(' + c.t_ms + ')">' + fmt(c.t_ms) + '</button>' +
      '<span class="au">' + esc(c.author) + '</span><span class="dt">' + esc((c.created_at || '').slice(5, 16)) + '</span></div>' +
      (c.body ? '<div class="bd">' + esc(c.body) + '</div>' : '') + im + ac + '</div>';
  }).join('');
}
function paintTl() {
  var t = el('tl'); Array.prototype.slice.call(t.querySelectorAll('.mk')).forEach(function (m) { m.remove(); });
  if (!v.duration) return;
  CM.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'mk' + (Number(c.resolved) ? ' done' : '');
    d.style.left = (c.t_ms / 1000 / v.duration * 100) + '%';
    d.title = fmt(c.t_ms) + ' · ' + c.author;
    d.onclick = function (e) { e.stopPropagation(); seek(c.t_ms); };
    t.appendChild(d);
  });
}
function lb(s) { el('lbi').src = s; el('lb').classList.add('open'); }
function res(id, r) { api('resolve', { id: id, resolved: r }).then(loadCm).catch(function (e) { toast(e.message); }); }
function cdel(id) { if (!confirm('Xóa góp ý này?')) return;
  api('cdel', { id: id }).then(loadCm).catch(function (e) { toast(e.message); }); }

function openCmp() { v.pause(); el('cmp').classList.add('open'); tick(); el('bd').focus(); }
function closeCmp() { el('cmp').classList.remove('open'); drawOff(0); }

/* ── ảnh đính kèm ─────────────────────────────────────── */
function addFile(f) {
  if (!f || f.type.indexOf('image/') !== 0) return;
  var r = new FileReader();
  r.onload = function () { shrink(r.result, function (u) { pushImg(u); }); };
  r.readAsDataURL(f);
}
function shrink(url, cb) {
  var i = new Image();
  i.onload = function () {
    var M = 1600, w = i.width, h = i.height, s = Math.min(1, M / Math.max(w, h));
    var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', .85));
  };
  i.onerror = function () { cb(url); };
  i.src = url;
}
function pushImg(u) { IMGS.push(u); paintThumbs(); }
function paintThumbs() {
  el('thumbs').innerHTML = IMGS.map(function (u, i) {
    return '<div class="thumb"><img src="' + u + '" onclick="lb(this.src)" alt="" /><b onclick="rmImg(' + i + ')">×</b></div>';
  }).join('');
}
function rmImg(i) { IMGS.splice(i, 1); paintThumbs(); }

/* ── vẽ lên khung hình ────────────────────────────────── */
function drawOn() {
  if (!v.videoWidth) { toast('Video chưa sẵn sàng.'); return; }
  v.pause();
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  try { cx.drawImage(v, 0, 0, cv.width, cv.height); }
  catch (e) { toast('Không chụp được khung hình.'); return; }
  snaps = [cx.getImageData(0, 0, cv.width, cv.height)];
  el('stage').classList.add('drawing'); el('pens').classList.add('open');
}
function drawOff(keep) {
  if (!el('stage').classList.contains('drawing')) return;
  if (keep) pushImg(cv.toDataURL('image/jpeg', .88));
  el('stage').classList.remove('drawing'); el('pens').classList.remove('open'); snaps = [];
}
function setPen(n, c) { pen = c;
  Array.prototype.slice.call(document.querySelectorAll('.pens .sw')).forEach(function (s) { s.classList.remove('on'); });
  n.classList.add('on'); }
function setW(w) { pw = w; }
function undo() { if (snaps.length > 1) snaps.pop(); if (snaps.length) cx.putImageData(snaps[snaps.length - 1], 0, 0); }
function xy(e) { var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * cv.width, y: (e.clientY - r.top) / r.height * cv.height }; }
function pd(e) { if (!el('stage').classList.contains('drawing')) return;
  drawing = true; dpt = xy(e); cv.setPointerCapture(e.pointerId);
  cx.lineCap = 'round'; cx.lineJoin = 'round'; }
function pm(e) {
  if (!drawing) return;
  var p = xy(e), sc = cv.width / cv.getBoundingClientRect().width;
  cx.strokeStyle = pen; cx.lineWidth = pw * sc;
  cx.beginPath(); cx.moveTo(dpt.x, dpt.y); cx.lineTo(p.x, p.y); cx.stroke(); dpt = p;
}
function pu() { if (!drawing) return; drawing = false;
  if (snaps.length > 24) snaps.shift();
  snaps.push(cx.getImageData(0, 0, cv.width, cv.height)); }

/* ── gửi ──────────────────────────────────────────────── */
function send() {
  var au = el('au').value.trim(), bd = el('bd').value.trim();
  if (!au) { toast('Nhập tên của bạn.'); el('au').focus(); return; }
  if (!bd && !IMGS.length) { toast('Nhập nội dung hoặc đính hình.'); return; }
  localStorage.setItem('rv_name', au);
  var ms = Math.round((v.currentTime || 0) * 1000);
  var b = el('bSend'); b.disabled = true; b.textContent = 'Đang gửi…';
  var list = IMGS.length ? IMGS.slice() : [''];
  var i = 0;
  function next() {
    if (i >= list.length) {
      b.disabled = false; b.textContent = 'Gửi góp ý';
      el('bd').value = ''; IMGS = []; paintThumbs(); el('cmp').classList.remove('open');
      toast('Đã gửi góp ý lúc ' + fmt(ms)); loadCm(); return;
    }
    var payload = { t_ms: ms, author: au, body: i === 0 ? bd : '', img: list[i] };
    if (!payload.body && !payload.img) { i++; next(); return; }
    api('comment', payload).then(function () { i++; next(); })
      .catch(function (e) { b.disabled = false; b.textContent = 'Gửi góp ý'; toast(e.message); });
  }
  next();
}

document.addEventListener('DOMContentLoaded', boot);
</script>
