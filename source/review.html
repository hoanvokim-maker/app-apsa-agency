<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=1">
  <meta name="theme-color" content="#dff20d">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>APSA — Duyệt video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Oxanium:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/theme.css?v=53" />
<style>
  :root {
    --bg: #000; --bg2: #0b0b0b; --bg3: #141414; --bg4: #1c1c1c;
    --border: rgba(255,255,255,.08); --border-h: rgba(255,255,255,.16);
    --text: #fff; --text2: #9a9a9a; --text3: #5e5e5e;
    --green: #dff20d; --pink: #c9dd00; --red: #ff4d4d; --sky: #56ccf2;
    --ok: #22c55e; --gold: #facc15; --blue: #3894ff;
  --w-rgb: 255,255,255;
  }

/* ---- APSA1895 — LIGHT MODE cho trang nay ----
   Trang tu khai bo token rieng o :root nen de len theme.css;
   khoi duoi day dinh nghia lai dung bo token do cho nen sang. */
html[data-theme="light"] {
  --bg: #ffffff;
  --bg2: #ffffff;
  --bg3: #fafaf9;
  --bg4: #f2f2f0;
  --border: rgba(0,0,0,.14);
  --border-h: rgba(194,84,47,.55);
  --text: #3a3a34;
  --text2: #57574f;
  --text3: #6e6e66;
  --green: #d97757;
  --pink: #d97757;
  --red: #b3261e;
  --sky: #2f5fd0;
  --ok: #157a3d;
  --gold: #d97757;
  --blue: #2f5fd0;
  --w-rgb: 0,0,0;
}
  body { font-family: 'Oxanium', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 100; background: rgba(0,0,0,.9); backdrop-filter: blur(16px);
           border-bottom: 1px solid var(--border); height: 60px; padding: 0 28px;
           display: flex; align-items: center; justify-content: space-between; }
  .logo img { height: 26px; filter: brightness(0) invert(1); opacity: .9; display: block; }
  .back-btn { display: flex; align-items: center; gap: 6px; color: var(--text2); text-decoration: none;
              font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); }
  .back-btn:hover { color: var(--text); border-color: var(--border-h); }
  .page-head { padding: 30px 28px 14px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
  .page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
  .page-head p { font-size: 13px; color: var(--text2); margin-top: 4px; max-width: 900px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--text2); }
  .stats b { color: var(--green); font-weight: 800; }
  .spacer { flex: 1 1 auto; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; }
  header .who { font-size: 12px; color: var(--muted, #9aa0a6); }

  .rv { max-width: 1560px; margin: 0 auto; padding: 4px 22px 60px; }
  .rv-head h1 { font-size: 22px; letter-spacing: .3px; margin-bottom: 4px; }
  .rv-head p { font-size: 13px; color: #9aa0a6; }
  .rv-grid { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; margin-top: 16px; align-items: start; }
  @media (max-width: 1080px) { .rv-grid { grid-template-columns: minmax(0, 1fr); } }

  .card { background: rgba(var(--w-rgb),.035); border: 1px solid rgba(var(--w-rgb),.09); border-radius: 14px; }
  .stage { position: relative; background: #000; border-radius: 14px 14px 0 0; overflow: hidden; }
  .stage video { display: block; width: 100%; max-height: 66vh; background: #000; }
  #draw { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; z-index: 3; }
  .stage.drawing #draw { display: block; }
  .stage.drawing video { visibility: hidden; }
  .stage.drawing::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px #dff20d; border-radius: 14px 14px 0 0; pointer-events: none; z-index: 4; }

  .bar { padding: 10px 12px; border-top: 1px solid rgba(var(--w-rgb),.08); }
  .tl { position: relative; height: 26px; margin-bottom: 8px; }
  .tl .rail { position: absolute; left: 0; right: 0; top: 11px; height: 4px; border-radius: 4px; background: rgba(var(--w-rgb),.13); }
  .tl .mk { position: absolute; top: 4px; width: 3px; height: 18px; border-radius: 3px; background: var(--neon); cursor: pointer; transform: translateX(-1px); }
  .tl .mk.done { background: #4ade80; opacity: .55; }
  .tl .mk:hover { box-shadow: 0 0 0 3px rgba(var(--neon-rgb),.25); }
  .tl .cur { position: absolute; top: 2px; width: 2px; height: 22px; background: #fff; opacity: .85; pointer-events: none; }

  .ctrls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .vb { font: inherit; font-size: 12.5px; padding: 7px 11px; border-radius: 9px; border: 1px solid rgba(var(--w-rgb),.14);
         background: rgba(var(--w-rgb),.05); color: #e9eaec; cursor: pointer; white-space: nowrap; transition: .15s; }
  .vb:hover { background: rgba(var(--w-rgb),.1); }
  .vb.pri { background: var(--neon); color: #101010; border-color: var(--neon); font-weight: 700; }
  .vb.pri:hover { filter: brightness(1.08); }
  .vb.on { background: rgba(var(--neon-rgb),.16); border-color: var(--neon); color: var(--neon); }
  .vb:disabled { opacity: .4; cursor: default; }
  .tcode { font-family: 'Oxanium', monospace; font-size: 15px; font-weight: 700; color: var(--neon); padding: 0 8px; min-width: 96px; }
  .sp { flex: 1; }

  .cmp { padding: 12px; border-top: 1px solid rgba(var(--w-rgb),.08); display: none; }
  .cmp.open { display: block; }
  .cmp .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  input[type="text"], textarea { font: inherit; font-size: 13.5px; color: #e9eaec; background: rgba(0,0,0,.35);
    border: 1px solid rgba(var(--w-rgb),.14); border-radius: 9px; padding: 9px 11px; width: 100%; outline: none; }
  input[type="text"]:focus, textarea:focus { border-color: var(--neon); }
  textarea { min-height: 74px; resize: vertical; }
  .cmp .name { max-width: 240px; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 0; }
  .thumb { position: relative; width: 92px; height: 62px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(var(--w-rgb),.15); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb b { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.75);
             color: #fff; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; }

  .pens { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid rgba(var(--w-rgb),.08); display: none; }
  .pens.open { display: flex; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(var(--w-rgb),.25); cursor: pointer; }
  .sw.on { border-color: #fff; transform: scale(1.12); }

  .list { padding: 12px; max-height: 76vh; overflow: auto; }
  .list h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .8px; color: #9aa0a6; margin-bottom: 10px; }
  .cm { border: 1px solid rgba(var(--w-rgb),.09); border-radius: 11px; padding: 10px; margin-bottom: 9px; background: rgba(var(--w-rgb),.03); }
  .cm.done { opacity: .5; }
  .cm .top { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .cm .ts { font-family: 'Oxanium', monospace; font-weight: 700; font-size: 12.5px; color: #101010; background: var(--neon);
            border: 0; border-radius: 6px; padding: 2px 7px; cursor: pointer; }
  .cm .au { font-size: 12.5px; font-weight: 600; }
  .cm .dt { font-size: 11px; color: #7d838a; margin-left: auto; }
  .cm .bd { font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .cm img.att { margin-top: 7px; width: 100%; border-radius: 8px; cursor: zoom-in; display: block; }
  .cm .acts { display: flex; gap: 6px; margin-top: 7px; }
  .cm .acts button { font: inherit; font-size: 11.5px; padding: 4px 8px; border-radius: 7px; cursor: pointer;
                     border: 1px solid rgba(var(--w-rgb),.14); background: transparent; color: #9aa0a6; }
  .cm .acts button:hover { color: #e9eaec; border-color: rgba(var(--w-rgb),.3); }
  .empty { font-size: 12.5px; color: #7d838a; text-align: center; padding: 22px 0; }

  .lb { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none; align-items: center; justify-content: center; z-index: 90; padding: 24px; }
  .lb.open { display: flex; }
  .lb img { max-width: 96%; max-height: 92%; border-radius: 10px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: var(--neon); color: #101010;
           font-weight: 700; font-size: 13px; padding: 9px 16px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .2s; z-index: 99; }
  .toast.on { opacity: 1; }
  .err { padding: 40px 22px; text-align: center; color: #ff8080; font-size: 14px; }

/* APSA1826: chon phien ban + so sanh */
.vbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0 0}
.vbar .vlb{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;margin-right:2px}
.vchip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border:1px solid #2b3138;border-radius:99px;font-size:12px;font-weight:700;color:#c9ced6;text-decoration:none}
.vchip:hover{border-color:#4a535e;color:var(--text)}
.vchip.on{background:var(--neon);border-color:var(--neon);color:#111}
.vchip.off{opacity:.45}
.vchip i{font-style:normal;font-size:10px;background:#ff6b6b;color:#fff;border-radius:99px;padding:0 5px;line-height:15px}
.vchip.on i{background:#111;color:var(--neon)}
.vcmp{margin-left:4px;padding:4px 12px;border:1px solid #2b3138;background:#1b2026;color:#c9ced6;border-radius:99px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.vcmp:hover{border-color:var(--neon);color:var(--neon)}
.tsn{margin-left:6px;padding:1px 8px;border:1px solid #2b3138;background:transparent;color:#8d96a3;border-radius:99px;font:inherit;font-size:11px;cursor:pointer}
.tsn:hover{border-color:var(--neon);color:var(--neon)}
.cmpov{position:fixed;inset:0;background:#0b0d10;z-index:9000;display:none;flex-direction:column}
.cmpov.open{display:flex}
.cmphd{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #20262d;flex-wrap:wrap}
.cmphd b{font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.cmphd select{font:inherit;font-size:13px;background:#151a20;color:#e6e9ee;border:1px solid #2b3138;border-radius:8px;padding:5px 9px}
.cmphd .ar{opacity:.5}
.cmphd .lk{font-size:12px;display:flex;align-items:center;gap:6px;opacity:.85;cursor:pointer}
.cmpbd{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 18px 18px}
.cmpc{display:flex;flex-direction:column;min-width:0;min-height:0}
.cmpt{font-size:11.5px;opacity:.7;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmpc video{width:100%;flex:1;min-height:0;background:#000;border-radius:10px;object-fit:contain}
@media (max-width:860px){.cmpbd{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
    /* APSA1849 */
    .mk.prev { background: #7aa2ff; opacity: .55; }
    .cm.prev { opacity: .72; border-style: dashed; }
    .cm.prev .ts { background: rgba(122,162,255,.14); border-color: rgba(122,162,255,.45); color: #a9c3ff; }
    .pvh { margin: 16px 0 8px; padding-top: 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: #7aa2ff; border-top: 1px dashed rgba(122,162,255,.35); }
  
/* ---- APSA1897 — sua chu mau sang hard-code cho nen trang ---- */
html[data-theme="light"] .vb.on{ color:#d97757 !important; }
html[data-theme="light"] .tcode{ color:#d97757 !important; }
html[data-theme="light"] .err{ color:#b3261e !important; }
html[data-theme="light"] .vchip.on i{ color:#d97757 !important; }
html[data-theme="light"] .vcmp:hover{ color:#d97757 !important; }
html[data-theme="light"] .tsn:hover{ color:#d97757 !important; }
html[data-theme="light"] .cm.prev .ts{ color:#2f5fd0 !important; }
html[data-theme="light"] .pvh{ color:#2f5fd0 !important; }

/* ---- APSA1898 — sua nen hard-code toi / neon cho nen trang ---- */
html[data-theme="light"] .stage{ background:#ffffff !important; }
html[data-theme="light"] .stage video{ background:#ffffff !important; }
html[data-theme="light"] .tl .mk{ background:#d97757 !important; color:#ffffff !important; }
html[data-theme="light"] .tl .mk.done{ background:#157a3d !important; color:#ffffff !important; }
html[data-theme="light"] .vb.pri{ background:#d97757 !important; color:#ffffff !important; }
html[data-theme="light"] .cm .ts{ background:#d97757 !important; color:#ffffff !important; }
html[data-theme="light"] .toast{ background:#d97757 !important; color:#ffffff !important; }
html[data-theme="light"] .vchip.on{ background:#d97757 !important; color:#ffffff !important; }
html[data-theme="light"] .vchip i{ background:#b3261e !important; color:#ffffff !important; }
html[data-theme="light"] .vchip.on i{ background:#fafaf9 !important; }
html[data-theme="light"] .vcmp{ background:#f2f2f0 !important; color:#3a3a34 !important; }
html[data-theme="light"] .cmpov{ background:#fafaf9 !important; }
html[data-theme="light"] .cmphd select{ background:#fafaf9 !important; color:#3a3a34 !important; }
html[data-theme="light"] .cmpc video{ background:#ffffff !important; }
html[data-theme="light"] /* APSA1849 */ .mk.prev{ background:#2f5fd0 !important; color:#ffffff !important; }
  /* APSA1922 */
  .apbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin:8px 0 2px; font-size:12.5px; }
  .apok{ display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px;
    background:rgba(56,180,100,.14); border:1px solid rgba(56,180,100,.45); color:#3fc47a; font-weight:700; }
  .apok b{ font-weight:800; }
  .apok .apwho{ font-weight:500; opacity:.85; }
  .apbtn{ background:#2f9e56; border:0; color:#fff; font-weight:800; font-size:12.5px;
    padding:8px 16px; border-radius:999px; cursor:pointer; letter-spacing:.2px; }
  .apbtn:hover{ filter:brightness(1.08); }
  .aplink{ background:none; border:1px solid rgba(var(--w-rgb),.18); color:inherit; opacity:.8;
    font-size:11.5px; padding:6px 12px; border-radius:999px; cursor:pointer; text-decoration:none; }
  .aplink:hover{ opacity:1; }
  .aphint{ font-size:11.5px; opacity:.6; }
  /* APSA1925: toi uu dien thoai */
  @media (max-width:720px){
    header{ padding:9px 12px }
    .rv{ padding:4px 12px 36px }
    .rv-head #ttl{ font-size:17px; line-height:1.3 }
    .rv-head #note{ font-size:12px }
    .rv-grid{ gap:12px }
    .vbar{ gap:5px; margin:10px 0 0 }
    .bar{ padding:8px }
    .ctrls{ gap:6px }
    .ctrls .vb{ padding:7px 10px; font-size:11.5px }
    .cmp{ padding:10px }
    .cmp .name{ max-width:none; width:100% }
    .apbar{ gap:8px }
    .apbtn{ padding:8px 15px; font-size:12px }
    .aphint{ font-size:11px; line-height:1.4 }
  }
  @media (orientation:landscape) and (max-height:540px){
    header{ display:none }
    .rv{ padding:0 8px 16px }
    .rv-head{ display:none }
    .rv-grid{ gap:8px }
    .bar{ padding:6px }
    .ctrls .vb{ padding:6px 9px; font-size:11px }
  }
  /* APSA1926: icon theo phong cach APSA */
  .ic{ width:14px; height:14px; display:block; flex:0 0 auto }
  .vb{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap }
  .vb .ic{ opacity:.9 }
  .vb:hover .ic{ opacity:1 }
  .vb b{ font-weight:700; font-size:11px; letter-spacing:.02em; opacity:.78 }
  /* APSA1926: che do chi xem + danh sach video tren dien thoai */
  body.ro #cmp, body.ro #pens, body.ro .card.list,
  body.ro .ctrls .vb.pri { display:none !important }
  .robadge{ display:inline-flex; align-items:center; gap:7px; font-size:11.5px;
    padding:6px 12px; border-radius:999px; opacity:.72;
    border:1px solid rgba(var(--w-rgb),.16) }
  .plmini{ display:none }
  .plmini.on{ display:block }
  .plmini{ border:1px solid rgba(var(--w-rgb),.12); border-radius:12px;
      overflow:hidden; background:rgba(var(--w-rgb),.03) }
    .pmh{ font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; opacity:.5;
      padding:11px 14px 9px; font-weight:700 }
    .pmi{ display:flex; gap:11px; align-items:flex-start; padding:10px 14px; cursor:pointer;
      text-decoration:none; color:inherit; border-top:1px solid rgba(var(--w-rgb),.07);
      border-left:3px solid transparent }
    .pmi:hover{ background:rgba(var(--w-rgb),.04) }
    .pmi.on{ border-left-color:var(--neon); background:rgba(var(--w-rgb),.05) }
    .pmn{ font-size:11px; opacity:.4; min-width:15px; padding-top:1px }
    .pmt{ font-size:12.5px; font-weight:600; line-height:1.36 }
  .pmi.on .pmt{ color:var(--neon) }
  body.ro .bar{ display:none !important }
  .eyebadge{ display:inline-flex; align-items:center; gap:8px; font-size:12.5px;
    padding:7px 14px; border-radius:999px; border:1px solid rgba(var(--w-rgb),.16) }
  .eyebadge b{ font-weight:800; font-size:13px }
  .eyebadge .ic{ width:15px; height:15px; opacity:.75 }
</style>
</head>
<body>

<header>
  <div class="logo"><img src="/Logo%20rectange.png" alt="APSA" /></div>
  <div class="who" id="who"></div>
</header>

<div class="rv" id="root" style="display:none">
  <div class="rv-head">
    <h1 id="ttl">…</h1>
    <p id="note"></p>
    <div class="apbar" id="apbar" style="display:none"></div>
    <div class="vbar" id="vbar" style="display:none"></div>
  </div>

  <div class="rv-grid">
    <div class="card">
      <div class="stage" id="stage">
        <video id="v" playsinline preload="metadata" controls controlslist="nodownload"></video>
        <canvas id="draw"></canvas>
      </div>

      <div class="bar">
        <div class="tl" id="tl"><div class="rail"></div><div class="cur" id="cur" style="left:0"></div></div>
        <div class="ctrls">
          <button class="vb" id="bPlay" onclick="tog()"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5.2v13.6L19 12z"/></svg><span>Phát</span></button>
          <button class="vb" onclick="step(-1)" title="Lùi 1 giây"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 6l-6 6 6 6M19 6l-6 6 6 6"/></svg><b>1s</b></button>
          <button class="vb" onclick="step(-0.04)" title="Lùi 1 khung hình"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-7 6 7 6M6 5.5v13"/></svg></button>
          <button class="vb" onclick="step(0.04)" title="Tới 1 khung hình"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l7 6-7 6M18 5.5v13"/></svg></button>
          <button class="vb" onclick="step(1)" title="Tới 1 giây"><b>1s</b><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6l6 6-6 6M5 6l6 6-6 6"/></svg></button>
          <span class="tcode" id="tc">00:00.0</span>
          <span class="sp"></span>
          <button class="vb pri" onclick="openCmp()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.6"/><path d="M12 8.7v6.6M8.7 12h6.6"/></svg><span>Góp ý tại giây này</span></button>
        </div>
      </div>

      <div class="pens" id="pens">
        <span style="font-size:12px;color:#9aa0a6">Bút:</span>
        <span class="sw on" style="background:#ff2d55" onclick="setPen(this,'#ff2d55')"></span>
        <span class="sw" style="background:var(--neon)" onclick="setPen(this,'#dff20d')"></span>
        <span class="sw" style="background:#38bdf8" onclick="setPen(this,'#38bdf8')"></span>
        <span class="sw" style="background:#4ade80" onclick="setPen(this,'#4ade80')"></span>
        <span class="sw" style="background:#ffffff" onclick="setPen(this,'#ffffff')"></span>
        <button class="vb" onclick="setW(3)">Mảnh</button>

<script>
var API = './api/review-api.php';
var T = new URLSearchParams(location.search).get('t') || '';
var PLT = new URLSearchParams(location.search).get('p') || '';   /* APSA1926 */
var VK = '', VIEWID = 0, VIEWS = 0, WSEC = 0, WT0 = 0, RO = 0;   /* APSA1927 */
var v, cv, cx, fi, INFO = null, CM = [], IMGS = [], ADMIN = 0;
var pen = '#ff2d55', pw = 7, snaps = [], drawing = false, dpt = null;

function el(i) { return document.getElementById(i); }
var APSA_IC = { play: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 5.2v13.6L19 12z"/></svg>', pause: '<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8.6 5h2.5v14H8.6zM12.9 5h2.5v14h-2.5z"/></svg>' };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
  return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(m) { var t = el('toast'); t.textContent = m; t.classList.add('on'); setTimeout(function () { t.classList.remove('on'); }, 1900); }
function fmt(ms) { var s = ms / 1000, m = Math.floor(s / 60), r = s - m * 60;
  return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); }

/* --- ghi nho ten nguoi gop y trong 30 ngay ------------------------- */
var WHO_KEY = 'rv_who', WHO_TTL = 30 * 864e5;
function whoSave(n) {
  n = String(n || '').trim().slice(0, 120);
  if (!n) return;
  try {
    localStorage.setItem(WHO_KEY, JSON.stringify({ n: n, e: Date.now() + WHO_TTL }));
    localStorage.setItem('rv_name', n);
  } catch (e) {}
  try {
    document.cookie = WHO_KEY + '=' + encodeURIComponent(n) +
      ';path=/;max-age=' + Math.round(WHO_TTL / 1000) + ';SameSite=Lax';
  } catch (e) {}
}
function whoLoad() {
  try {
    var raw = localStorage.getItem(WHO_KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && o.n) {
        if (o.e > Date.now()) return o.n;
        localStorage.removeItem(WHO_KEY); localStorage.removeItem('rv_name');
        return '';
      }
    }
    var lg = localStorage.getItem('rv_name');
    if (lg) return lg;
  } catch (e) {}
  var m = document.cookie.match(/(?:^|;\s*)rv_who=([^;]*)/);
  try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; }
}

/* --- Che do nhung trong playlist: an header + tieu de --- */
try {

/* --- Ma rieng cua trinh duyet: de biet gop y nao la cua minh --- */
var OKEY = '';
try {

  if (!OKEY) { OKEY = 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12); localStorage.setItem('rv_okey', OKEY); }
} catch (e) { OKEY = 'k' + Math.random().toString(36).slice(2, 14); }
try {

    '.cm .edt{font-size:11px;opacity:.6;font-style:italic;margin-top:2px}' +

    'border:1px solid #3a3f47;background:#14171c;color:inherit;resize:vertical}' +

    '.cm .edbtn button{font:inherit;font-size:11.5px;padding:4px 10px;border-radius:7px;cursor:pointer;' +
    'border:1px solid rgba(var(--w-rgb),.14);background:transparent;color:#9aa0a6}' +
    '.cm .edbtn button.ok{border-color:#d7f205;color:#0d0f12;background:#d7f205;font-weight:700}' +
    '.cm .edbtn button[disabled]{opacity:.55;cursor:default}';
  document.head.appendChild(_rvst);
} catch (e) { }

function api(action, body) {
  var u = API + '?action=' + action + '&t=' + encodeURIComponent(T) + '&ok=' + encodeURIComponent(OKEY);
  var o = { credentials: 'same-origin' };
  if (body) { o.method = 'POST'; o.headers = { 'Content-Type': 'application/json' }; o.body = JSON.stringify(body); }
  return fetch(u, o).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) throw new Error(j.error || 'Lỗi'); return j.data; });
}

/* ── khởi động ─────────────────────────────────────────── */
/* APSA1826: chon phien ban + so sanh 2 ban */
var VERS = [], LATEST = '', CMP = null, CMPLOCK = true, CMPQ = 0;
var APPR = null;                                            /* APSA1922 */
var SHOWALL = new URLSearchParams(location.search).has('all');

function verUrl(tok) { return API + '?action=stream&t=' + encodeURIComponent(tok); }

function verPaint() {
  var b = el('vbar'); if (!b) return;
  if (!VERS || VERS.length < 2) { b.innerHTML = ''; b.style.display = 'none'; return; }
  if (APPR && !SHOWALL) {                                    /* APSA1922 */
    b.style.display = '';
    b.innerHTML = '<a class="aplink" href="./review.html?t=' + encodeURIComponent(T) + '&all=1">'
                + 'Xem các bản trước (' + (VERS.length - 1) + ')</a>';
    return;
  }
  b.style.display = '';
  b.innerHTML = '<span class="vlb">Phiên bản</span>' + VERS.map(function (x) {
    return '<a class="vchip' + (Number(x.cur) ? ' on' : '') + (Number(x.active) ? '' : ' off') + '"' +
           ' href="./review.html?t=' + x.token + '"' +
           ' title="V' + x.ver + (Number(x.n_open) ? ' — ' + x.n_open + ' góp ý chưa xử lý' : '') + '">V' + x.ver +
           (Number(x.n_open) ? '<i>' + x.n_open + '</i>' : '') + '</a>';
  }).join('') + '<button class="vcmp" onclick="cmpOpen()">So sánh 2 bản</button>';
  if (APPR) b.innerHTML += '<a class="aplink" style="margin-left:6px" href="./review.html?t='
    + encodeURIComponent(APPR.token) + '">&larr; Bản đã duyệt (V' + APPR.ver + ')</a>';
}

/* ===== APSA1922: duyet ban video ===== */
function plMini() {
  if (!PLT) return;
  fetch(API + '?action=pl-open&t=' + encodeURIComponent(PLT), { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
    var d = (j && j.ok && j.data) ? j.data : {};
    var rows = d.videos || d.rows || d.items || [];
    if (!rows.length) return;
    var h = '<div class="pmh">Danh sách video · ' + rows.length + '</div>';
    h += rows.map(function (x, i) {
      return '<a class="pmi' + (x.token === T ? ' on' : '') + '" href="./review.html?t='
        + encodeURIComponent(x.token) + '&p=' + encodeURIComponent(PLT) + '">'
        + '<span class="pmn">' + (i + 1) + '</span>'
        + '<span class="pmt">' + esc(x.title || x.file_name || '') + '</span></a>';
    }).join('');
    var b = el('plmini'); if (!b) return;
    b.innerHTML = h; plMiniSync();
  }).catch(function () {});
}

function plMiniSync() {
  var b = el('plmini'); if (!b || !b.innerHTML) return;
  var W = window.innerWidth;
  try { if (window.parent && window.parent !== window && window.parent.innerWidth)
    W = window.parent.innerWidth; } catch (e) {}
  b.style.display = '';
  b.classList[W <= 860 ? 'add' : 'remove']('on');
}
window.addEventListener('resize', plMiniSync);

/* ===== APSA1927: ghi nhan luot xem ===== */
var IC_EYE = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"'
  + ' stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
  + '<path d="M2.6 12S6.5 5.4 12 5.4 21.4 12 21.4 12 17.5 18.6 12 18.6 2.6 12 2.6 12z"/>'
  + '<circle cx="12" cy="12" r="2.9"/></svg>';
function vkeyGet() {
  try {
    var k = localStorage.getItem('apsa_vk') || '';
    if (!/^[a-f0-9]{32}$/.test(k)) {
      var a = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(a);
      k = Array.prototype.map.call(a, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
      localStorage.setItem('apsa_vk', k);
    }
    return k;
  } catch (e) { return ''; }
}
function wFlush() { if (WT0) { WSEC += (Date.now() - WT0) / 1000; WT0 = 0; } }
function vpBody() {
  return { t: T, v: VK, p: PLT, view: VIEWID, secs: Math.round(WSEC),
    pos: Math.round(((v && v.currentTime) || 0) * 1000),
    dur: Math.round((v && isFinite(v.duration) ? v.duration : 0) * 1000) };
}
function vping(beacon) {
  if (!VK || !T) return;
  var body = JSON.stringify(vpBody());
  if (beacon && navigator.sendBeacon) {
    try { navigator.sendBeacon(API + '?action=vping',
      new Blob([body], { type: 'application/json' })); } catch (e) {}
    return;
  }
  fetch(API + '?action=vping', { method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, body: body })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j && j.ok && j.data) {
        VIEWID = Number(j.data.view) || VIEWID;
        VIEWS = Number(j.data.views) || VIEWS;
        roPaint();
      }
    }).catch(function () {});
}
function roPaint() {
  if (!RO) return;
  var b = el('apbar'); if (!b) return;
  b.style.display = '';
  b.innerHTML = '<span class="eyebadge">' + IC_EYE + '<b>' + VIEWS + '</b> lượt xem</span>';
}

function apprFmt(v) {
  var d = new Date(String(v || '').replace(' ', 'T'));
  if (isNaN(d.getTime())) return String(v || '');
  function p(n) { return (n < 10 ? '0' : '') + n; }
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear()
       + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function apprPaint() {
  var b = el('apbar'); if (!b) return;
  b.style.display = '';
  if (APPR) {
    b.innerHTML = '<span class="apok">&#10003; <b>Đã duyệt</b>'
      + '<span class="apwho">· bản V' + APPR.ver + ' · ' + esc(APPR.by)
      + ' · ' + esc(apprFmt(APPR.at)) + '</span></span>'
      + (ADMIN ? '<button class="aplink" onclick="apprUndo(this)">Huỷ duyệt</button>' : '');
    return;
  }
  b.innerHTML = '<button class="apbtn" onclick="apprAsk()">Duyệt bản này</button>'
    + '<span class="aphint">Duyệt xong link chỉ hiển thị bản này và khoá góp ý.</span>';
}
function apprAsk() {
  var b = el('apbar');
  var n = (el('au') && el('au').value) || whoLoad() || '';
  b.innerHTML = '<input class="name" id="apnm" maxlength="120" placeholder="Tên người duyệt"'
    + ' style="max-width:220px" />'
    + '<button class="apbtn" onclick="apprDo()">Xác nhận duyệt</button>'
    + '<button class="aplink" onclick="apprPaint()">Bỏ qua</button>';
  el('apnm').value = n;
  el('apnm').addEventListener('keydown', function (e) { if (e.key === 'Enter') apprDo(); });
  el('apnm').focus();
}
function apprDo() {
  var i = el('apnm'); if (!i) return;
  var n = String(i.value || '').trim();
  if (n.length < 2) { toast('Nhập tên người duyệt.'); i.focus(); return; }
  whoSave(n);
  api('approve', { t: T, name: n }).then(function () {
    location.replace('./review.html?t=' + encodeURIComponent(T));
  }).catch(function (e) { toast(e.message); apprPaint(); });
}
function apprUndo(btn) {
  if (btn && btn.getAttribute('data-ok') !== '1') {
    btn.setAttribute('data-ok', '1'); btn.textContent = 'Chắc chắn huỷ duyệt?';
    setTimeout(function () { if (btn && btn.parentNode) apprPaint(); }, 4000);
    return;
  }
  api('unapprove', { t: T }).then(function () {
    location.replace('./review.html?t=' + encodeURIComponent(T));
  }).catch(function (e) { toast(e.message); apprPaint(); });
}

function cmpOpen(ms) {
  if (!VERS || VERS.length < 2) { toast('Video này mới chỉ có 1 phiên bản.'); return; }
  var ov = document.getElementById('cmpov');
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'cmpov'; ov.className = 'cmpov';
    ov.innerHTML =
      '<div class="cmphd"><b>So sánh phiên bản</b>' +
      '<select id="cmpSL"></select><span class="ar">↔</span><select id="cmpSR"></select>' +
      '<label class="lk"><input type="checkbox" id="cmpLk" checked /> Khoá thời gian</label>' +
      '<button class="vb" onclick="cmpTog()">▶ Phát / Dừng</button>' +
      '<button class="vb" onclick="cmpClose()">✕ Đóng</button></div>' +
      '<div class="cmpbd">' +
      '<div class="cmpc"><div class="cmpt" id="cmpTL"></div><video id="cmpL" playsinline preload="metadata" controls controlslist="nodownload" muted></video></div>' +
      '<div class="cmpc"><div class="cmpt" id="cmpTR"></div><video id="cmpR" playsinline preload="metadata" controls controlslist="nodownload"></video></div>' +
      '</div>';
    document.body.appendChild(ov);
    document.getElementById('cmpLk').onchange = function () { CMPLOCK = this.checked; };
    document.getElementById('cmpSL').onchange = function () { cmpLoad(0, this.value); };
    document.getElementById('cmpSR').onchange = function () { cmpLoad(1, this.value); };
  }
  var opt = VERS.map(function (x) {
    return '<option value="' + x.token + '">V' + x.ver + (Number(x.active) ? '' : ' (đã tắt)') + '</option>';
  }).join('');
  document.getElementById('cmpSL').innerHTML = opt;
  document.getElementById('cmpSR').innerHTML = opt;
  var newer = LATEST || VERS[VERS.length - 1].token;
  var older = VERS[0].token;
  if (older === newer && VERS.length > 1) older = VERS[VERS.length - 2].token;
  document.getElementById('cmpSL').value = older;
  document.getElementById('cmpSR').value = newer;
  CMP = { l: document.getElementById('cmpL'), r: document.getElementById('cmpR'), m: null, raf: 0, at: (Number(ms) || 0) / 1000 };
  CMP.l.muted = true;
  cmpBind(CMP.l); cmpBind(CMP.r);
  cmpLoad(0, older); cmpLoad(1, newer);
  ov.classList.add('open');
  document.body.style.overflow = 'hidden';
  CMP.raf = requestAnimationFrame(cmpTick);
}

function cmpLoad(side, tok) {
  if (!CMP) return;
  var v = side ? CMP.r : CMP.l, x = null, i;
  for (i = 0; i < VERS.length; i++) if (VERS[i].token === tok) x = VERS[i];
  var t = el(side ? 'cmpTR' : 'cmpTL');
  if (t) t.textContent = 'V' + (x ? x.ver : '?') + (x && x.file_name ? ' · ' + x.file_name : '') + (side ? '  (bản mới)' : '  (bản cũ · tắt tiếng)');
  var at = CMP.at || 0;
  v.src = verUrl(tok);
  v.addEventListener('loadedmetadata', function once() {
    v.removeEventListener('loadedmetadata', once);
    if (at > 0 && at < (v.duration || 1e9)) { CMPQ = Date.now(); v.currentTime = at; }
  });
}

function cmpBind(v) {
  if (v.__cb) return; v.__cb = 1;
  ['play', 'pause', 'seeking', 'ratechange'].forEach(function (ev) {
    v.addEventListener(ev, function () { if (CMP && Date.now() - CMPQ > 350) CMP.m = v; });
  });
}

function cmpTick() {
  if (!CMP) return;
  var m = CMP.m || CMP.l, o = (m === CMP.l) ? CMP.r : CMP.l;
  if (CMPLOCK && m.readyState > 0 && o.readyState > 0) {
    if (Math.abs(o.currentTime - m.currentTime) > 0.35 && m.currentTime < (o.duration || 1e9)) { CMPQ = Date.now(); o.currentTime = m.currentTime; }
    if (!m.paused && o.paused) { CMPQ = Date.now(); o.play().catch(function () {}); }
    if (m.paused && !o.paused)  { CMPQ = Date.now(); o.pause(); }
    if (o.playbackRate !== m.playbackRate) o.playbackRate = m.playbackRate;
  }
  CMP.raf = requestAnimationFrame(cmpTick);
}

function cmpTog() {
  if (!CMP) return;
  var m = CMP.m || CMP.l;
  if (m.paused) m.play().catch(function () {}); else m.pause();
}

function cmpClose() {
  var ov = document.getElementById('cmpov'); if (!ov) return;
  if (CMP) {
    try { CMP.l.pause(); CMP.r.pause(); } catch (e) {}
    if (CMP.raf) cancelAnimationFrame(CMP.raf);
    CMP.l.removeAttribute('src'); CMP.r.removeAttribute('src');
    try { CMP.l.load(); CMP.r.load(); } catch (e) {}
    CMP = null;
  }
  ov.classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && CMP) cmpClose(); });

function boot() {
  v = el('v'); cv = el('draw'); cx = cv.getContext('2d'); fi = el('fi');
  if (!T) { fail('Thiếu mã liên kết.'); return; }
  api('open').then(function (d) {
    INFO = d; ADMIN = d.admin ? 1 : 0;
    VERS = d.versions || []; LATEST = d.latest || ''; APPR = d.appr || null;
    if (APPR && !SHOWALL && APPR.token !== T) {               /* APSA1922 */
      location.replace('./review.html?t=' + encodeURIComponent(APPR.token)); return;
    }
    verPaint(); apprPaint(); plMini();
    VIEWS = Number(d.views) || 0;
    if (d.no_cmt && !ADMIN) {                                  /* APSA1926/1927: chi xem */
      RO = 1; document.body.classList.add('ro'); roPaint();
    }
    VK = vkeyGet(); vping();
    if (APPR && !ADMIN) {
      var cw = el('cmp');
      if (cw) cw.innerHTML = '<div class="aphint" style="padding:8px 2px">'
        + 'Video đã được duyệt — không nhận thêm góp ý.</div>';
    }
    el('root').style.display = '';
    el('ttl').textContent = d.title || d.file_name;
    el('note').textContent = d.note || '';
    el('who').textContent = d.file_name;
    document.title = (d.title || d.file_name) || 'Duyệt video';
    v.src = API + '?action=stream&t=' + encodeURIComponent(T);
    loadCm();
  }).catch(function (e) { fail(e.message); });

  v.addEventListener('timeupdate', tick);
  v.addEventListener('play',  function () { WT0 = Date.now(); });
  v.addEventListener('pause', function () { wFlush(); vping(); });
  v.addEventListener('ended', function () { wFlush(); vping(); });
  setInterval(function () { if (WT0) { WSEC += (Date.now() - WT0) / 1000; WT0 = Date.now(); vping(); } }, 20000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { wFlush(); vping(true); } });
  window.addEventListener('pagehide', function () { wFlush(); vping(true); });
  v.addEventListener('seeked', tick);
  v.addEventListener('loadedmetadata', function () { tick(); paintTl(); });
  v.addEventListener('play', function () { el('bPlay').innerHTML = APSA_IC.pause + '<span>Dừng</span>'; });
  v.addEventListener('pause', function () { el('bPlay').innerHTML = APSA_IC.play + '<span>Phát</span>'; });
  v.addEventListener('error', function () { toast('Không tải được video.'); });

  el('tl').addEventListener('click', function (e) {
    if (!v.duration) return;
    var r = this.getBoundingClientRect();
    v.pause(); v.currentTime = Math.max(0, Math.min(v.duration, (e.clientX - r.left) / r.width * v.duration));
  });

  var n = whoLoad(); if (n) { el('au').value = n; whoSave(n); }

  el('au').addEventListener('input', function () { whoSave(this.value); });

  fi.addEventListener('change', function () {
    for (var i = 0; i < fi.files.length; i++) addFile(fi.files[i]);
    fi.value = '';
  });
  document.addEventListener('paste', function (e) {
    if (!el('cmp').classList.contains('open')) return;
    var it = e.clipboardData && e.clipboardData.items; if (!it) return;
    for (var i = 0; i < it.length; i++) if (it[i].type.indexOf('image/') === 0) { addFile(it[i].getAsFile()); e.preventDefault(); }
  });
  ['dragover', 'drop'].forEach(function (ev) {
    el('cmp').addEventListener(ev, function (e) { e.preventDefault();
      if (ev === 'drop' && e.dataTransfer) for (var i = 0; i < e.dataTransfer.files.length; i++) addFile(e.dataTransfer.files[i]); });
  });

  document.addEventListener('keydown', function (e) {
    if (/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) return;
    if (e.key === ' ') { e.preventDefault(); tog(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(e.shiftKey ? -1 : -0.04); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(e.shiftKey ? 1 : 0.04); }
  });

  cv.addEventListener('pointerdown', pd); cv.addEventListener('pointermove', pm);
  window.addEventListener('pointerup', pu);
}
function fail(m) { el('err').style.display = ''; el('err').textContent = m; }

function tick() {
  var ms = Math.round((v.currentTime || 0) * 1000);
  el('tc').textContent = fmt(ms); el('tc2').textContent = fmt(ms);
  if (v.duration) el('cur').style.left = (v.currentTime / v.duration * 100) + '%';
}
function tog() { if (v.paused) v.play(); else v.pause(); }
function step(d) { v.pause(); v.currentTime = Math.max(0, Math.min(v.duration || 1e9, v.currentTime + d)); }
function seek(ms) { v.pause(); v.currentTime = ms / 1000; window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ── góp ý ─────────────────────────────────────────────── */
function loadCm() {
  api('comments').then(function (d) {
    CM = d.rows || []; ADMIN = d.admin ? 1 : 0; loadPrevCm();
  }).catch(function (e) { toast(e.message); });
}
function edtFmt(v) {
  var t = String(v || '').replace('T', ' ');
  var m = t.match(/^(\d{4})-(\d{2})-(\d{2})[ ](\d{2}):(\d{2})/);
  if (!m) return t;
  return m[4] + ':' + m[5] + ' ' + m[3] + '/' + m[2] + '/' + m[1];
}
function cedit(id) {
  var c = null, i;
  for (i = 0; i < CM.length; i++) if (Number(CM[i].id) === Number(id)) c = CM[i];
  if (!c) return;
  var host = document.getElementById('cm' + id);
  if (!host || host.querySelector('.edbox')) return;
  var box = document.createElement('div');
  box.className = 'edbox';
  box.innerHTML = '<textarea class="edta" rows="3"></textarea>' +
    '<div class="edbtn"><button class="ok">Lưu</button><button class="no">Huỷ</button></div>';
  host.appendChild(box);
  var ta = box.querySelector('.edta');
  ta.value = c.body || '';
  ta.focus();
  box.querySelector('.no').onclick = function () { box.parentNode.removeChild(box); };
  box.querySelector('.ok').onclick = function () {
    var b = box.querySelector('.ok');
    b.disabled = true; b.textContent = 'Đang lưu…';
    api('cedit', { id: id, body: ta.value, ok: OKEY })
      .then(function () { loadCm(); })
      .catch(function (e) { b.disabled = false; b.textContent = 'Lưu'; toast(e.message); });
  };
}
/* APSA1849: xem ban moi van thay moc + gop y ban truoc de doi chieu */
var PREV = null, PREVCM = [], PREVTOK = '';
function prevVer() {
  if (!VERS || VERS.length < 2) return null;
  var cur = null, best = null, i;
  for (i = 0; i < VERS.length; i++) if (Number(VERS[i].cur)) cur = VERS[i];
  if (!cur) return null;
  for (i = 0; i < VERS.length; i++) {
    var x = VERS[i];
    if (Number(x.ver) < Number(cur.ver) && (!best || Number(x.ver) > Number(best.ver))) best = x;
  }
  return best;
}
function loadPrevCm() {
  PREV = prevVer();
  if (!PREV) { PREVCM = []; PREVTOK = ''; renderCm(); paintTl(); return; }
  if (PREVTOK === PREV.token) { renderCm(); paintTl(); return; }
  fetch(API + '?action=comments&t=' + encodeURIComponent(PREV.token) + '&ok=' + encodeURIComponent(OKEY),
        { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (j) { PREVCM = (j && j.ok && j.data && j.data.rows) ? j.data.rows : []; PREVTOK = PREV.token; })
    .catch(function () { PREVCM = []; })
    .then(function () { renderCm(); paintTl(); });
}
function prevHtml() {
  if (!PREV || !PREVCM.length) return '';
  return '<div class="pvh">G\u00f3p \u00fd b\u1ea3n V' + PREV.ver + ' \u2014 ' + PREVCM.length + ' m\u1ee5c (tham kh\u1ea3o)</div>' +
    PREVCM.map(function (c) {
      return '<div class="cm prev">' +
        '<div class="top"><button class="ts" onclick="seek(' + c.t_ms + ')">' + fmt(c.t_ms) + '</button>' +
        '<span class="au">' + esc(c.author) + '</span>' +
        (Number(c.resolved) ? '<span class="dt">\u0111\u00e3 x\u1eed l\u00fd</span>' : '') + '</div>' +
        (c.body ? '<div class="bd">' + esc(c.body) + '</div>' : '') +
      '</div>';
    }).join('');
}
function renderCm() {
  var open = CM.filter(function (c) { return !Number(c.resolved); }).length;
  el('lh').textContent = 'Góp ý — ' + CM.length + ' mục' + (open ? ' · ' + open + ' chưa xử lý' : '');
  if (!CM.length) { el('cl').innerHTML = '<div class="empty">Chưa có góp ý nào.<br />Dừng video tại giây cần góp ý rồi bấm “Góp ý tại giây này”.</div>' + prevHtml(); return; }
  el('cl').innerHTML = CM.map(function (c) {
    var im = Number(c.has_img) ? '<img class="att" src="' + API + '?action=img&t=' + encodeURIComponent(T) + '&id=' + c.id +
      '" onclick="lb(this.src)" alt="" />' : '';
    var ac = ADMIN ? '<div class="acts"><button onclick="res(' + c.id + ',' + (Number(c.resolved) ? 0 : 1) + ')">' +
      (Number(c.resolved) ? '↩ Mở lại' : '✓ Đã xử lý') + '</button><button onclick="cdel(' + c.id + ')">Xóa</button></div>' : '';
    var ed = c.edited_at ? '<div class="edt">đã sửa lúc ' + edtFmt(c.edited_at) + '</div>' : '';
    var mb = (ADMIN || Number(c.mine)) ? '<div class="acts mine"><button onclick="cedit(' + c.id + ')">✎ Sửa</button></div>' : '';
    if (ADMIN && ac && mb) { ac = ac.replace('<div class="acts">', '<div class="acts">' + mb.replace(/<\/?div[^>]*>/g, '')); mb = ''; }
    return '<div class="cm' + (Number(c.resolved) ? ' done' : '') + '" id="cm' + c.id + '">' +
      '<div class="top"><button class="ts" onclick="seek(' + c.t_ms + ')">' + fmt(c.t_ms) + '</button>' +
      ((LATEST && LATEST !== T) ? '<button class="tsn" onclick="cmpOpen(' + c.t_ms + ')" title="Xem mốc này trên bản mới nhất, so sánh với bản đang xem">↗ bản mới</button>' : '') +
      '<span class="au">' + esc(c.author) + '</span><span class="dt">' + esc((c.created_at || '').slice(5, 16)) + '</span></div>' +
      (c.body ? '<div class="bd">' + esc(c.body) + '</div>' : '') + ed + im + mb + ac + '</div>';
  }).join('') + prevHtml();
}
function paintTl() {
  var t = el('tl'); Array.prototype.slice.call(t.querySelectorAll('.mk')).forEach(function (m) { m.remove(); });
  /* APSA1849: chua co duration thi ve lai khi video bao metadata */
  if (!v.duration) { v.addEventListener('loadedmetadata', paintTl, { once: true }); return; }
  CM.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'mk' + (Number(c.resolved) ? ' done' : '');
    d.style.left = (c.t_ms / 1000 / v.duration * 100) + '%';
    d.title = fmt(c.t_ms) + ' · ' + c.author;
    d.onclick = function (e) { e.stopPropagation(); seek(c.t_ms); };
    t.appendChild(d);
  });
  /* APSA1849: moc gop y cua ban truoc (mau khac) de doi chieu */
  if (PREV && PREVCM.length) PREVCM.forEach(function (c) {
    var d = document.createElement('div');
    d.className = 'mk prev';
    d.style.left = (c.t_ms / 1000 / v.duration * 100) + '%';
    d.title = 'V' + PREV.ver + ' \u00b7 ' + fmt(c.t_ms) + ' \u00b7 ' + c.author;
    d.onclick = function (e) { e.stopPropagation(); seek(c.t_ms); };
    t.appendChild(d);
  });
}
function lb(s) { el('lbi').src = s; el('lb').classList.add('open'); }
function res(id, r) { api('resolve', { id: id, resolved: r }).then(loadCm).catch(function (e) { toast(e.message); }); }
function cdel(id) { if (!confirm('Xóa góp ý này?')) return;
  api('cdel', { id: id }).then(loadCm).catch(function (e) { toast(e.message); }); }

function openCmp() { v.pause(); el('cmp').classList.add('open'); tick(); el('bd').focus(); }
function closeCmp() { el('cmp').classList.remove('open'); drawOff(0); }

/* ── ảnh đính kèm ─────────────────────────────────────── */
function addFile(f) {
  if (!f || f.type.indexOf('image/') !== 0) return;
  var r = new FileReader();
  r.onload = function () { shrink(r.result, function (u) { pushImg(u); }); };
  r.readAsDataURL(f);
}
function shrink(url, cb) {
  var i = new Image();
  i.onload = function () {
    var M = 1600, w = i.width, h = i.height, s = Math.min(1, M / Math.max(w, h));
    var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', .85));
  };
  i.onerror = function () { cb(url); };
  i.src = url;
}
function pushImg(u) { IMGS.push(u); paintThumbs(); }
function paintThumbs() {
  el('thumbs').innerHTML = IMGS.map(function (u, i) {
    return '<div class="thumb"><img src="' + u + '" onclick="lb(this.src)" alt="" /><b onclick="rmImg(' + i + ')">×</b></div>';
  }).join('');
}
function rmImg(i) { IMGS.splice(i, 1); paintThumbs(); }

/* ── vẽ lên khung hình ────────────────────────────────── */
function drawOn() {
  if (!v.videoWidth) { toast('Video chưa sẵn sàng.'); return; }
  v.pause();
  cv.width = v.videoWidth; cv.height = v.videoHeight;
  try { cx.drawImage(v, 0, 0, cv.width, cv.height); }
  catch (e) { toast('Không chụp được khung hình.'); return; }
  snaps = [cx.getImageData(0, 0, cv.width, cv.height)];
  el('stage').classList.add('drawing'); el('pens').classList.add('open');
}
function drawOff(keep) {
  if (!el('stage').classList.contains('drawing')) return;
  if (keep) pushImg(cv.toDataURL('image/jpeg', .88));
  el('stage').classList.remove('drawing'); el('pens').classList.remove('open'); snaps = [];
}
function setPen(n, c) { pen = c;
  Array.prototype.slice.call(document.querySelectorAll('.pens .sw')).forEach(function (s) { s.classList.remove('on'); });
  n.classList.add('on'); }
function setW(w) { pw = w; }
function undo() { if (snaps.length > 1) snaps.pop(); if (snaps.length) cx.putImageData(snaps[snaps.length - 1], 0, 0); }
function xy(e) { var r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * cv.width, y: (e.clientY - r.top) / r.height * cv.height }; }
function pd(e) { if (!el('stage').classList.contains('drawing')) return;
  drawing = true; dpt = xy(e); cv.setPointerCapture(e.pointerId);
  cx.lineCap = 'round'; cx.lineJoin = 'round'; }
function pm(e) {
  if (!drawing) return;
  var p = xy(e), sc = cv.width / cv.getBoundingClientRect().width;
  cx.strokeStyle = pen; cx.lineWidth = pw * sc;
  cx.beginPath(); cx.moveTo(dpt.x, dpt.y); cx.lineTo(p.x, p.y); cx.stroke(); dpt = p;
}
function pu() { if (!drawing) return; drawing = false;
  if (snaps.length > 24) snaps.shift();
  snaps.push(cx.getImageData(0, 0, cv.width, cv.height)); }

/* ── gửi ──────────────────────────────────────────────── */
function send() {
  var au = el('au').value.trim(), bd = el('bd').value.trim();
  if (!au) { toast('Nhập tên của bạn.'); el('au').focus(); return; }
  if (!bd && !IMGS.length) { toast('Nhập nội dung hoặc đính hình.'); return; }
  whoSave(au);
  var ms = Math.round((v.currentTime || 0) * 1000);
  var b = el('bSend'); b.disabled = true; b.textContent = 'Đang gửi…';
  var list = IMGS.length ? IMGS.slice() : [''];
  var i = 0;
  function next() {
    if (i >= list.length) {
      b.disabled = false; b.textContent = 'Gửi góp ý';
      el('bd').value = ''; IMGS = []; paintThumbs(); el('cmp').classList.remove('open');
      toast('Đã gửi góp ý lúc ' + fmt(ms)); loadCm(); return;
    }
    var payload = { t_ms: ms, author: au, body: i === 0 ? bd : '', img: list[i], ok: OKEY };
    if (!payload.body && !payload.img) { i++; next(); return; }
    api('comment', payload).then(function () { i++; next(); })
      .catch(function (e) { b.disabled = false; b.textContent = 'Gửi góp ý'; toast(e.message); });
  }
  next();
}

document.addEventListener('DOMContentLoaded', boot);
</script>
