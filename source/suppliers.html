<script>
var API = './api/supplier-api.php';
var ITEMS = [], IS_ADMIN = false, CAPS = 0, FQ = '', editing = null, delIdx = -1, qTimer = null;

function el(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function toast(msg, err) {
  var t = el('toast');
  t.textContent = msg;
  t.className = 'on' + (err ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(function () { t.className = ''; }, err ? 5200 : 2800);
}
function nrm(x) {
  x = String(x == null ? '' : x).toLowerCase();
  var o = '', i, c, d;
  for (i = 0; i < x.length; i++) {
    c = x.charAt(i);
    if (c === 'đ') { o += 'd'; continue; }
    d = c.normalize ? c.normalize('NFD').replace(/[̀-ͯ]/g, '') : c;
    o += (d.length ? d.charAt(0) : c);
  }
  return o;
}
function terms(q) {
  var t = nrm(q).split(/[^a-z0-9]+/), o = [], i;
  for (i = 0; i < t.length; i++) if (t[i]) o.push(t[i]);
  return o;
}
function hit(s, tm) {
  var n = nrm(s), i;
  for (i = 0; i < tm.length; i++) if (n.indexOf(tm[i]) < 0) return false;
  return true;
}
function hlt(s, tm) {
  s = String(s == null ? '' : s);
  if (!tm || !tm.length) return esc(s);
  var n = nrm(s), mk = [], i, k, p, t;
  for (i = 0; i < tm.length; i++) {
    t = tm[i]; p = n.indexOf(t);
    while (p >= 0) { for (k = p; k < p + t.length; k++) mk[k] = 1; p = n.indexOf(t, p + 1); }
  }
  var h = '', on = false;
  for (i = 0; i < s.length; i++) {
    if (mk[i] && !on) { h += '<mark>'; on = true; }
    else if (!mk[i] && on) { h += '</mark>'; on = false; }
    h += esc(s.charAt(i));
  }
  return h + (on ? '</mark>' : '');
}
function telLink(v, tm) {
  if (!v) return '';
  var raw = String(v).replace(/[^0-9+]/g, '');
  return '<a href="tel:' + esc(raw) + '">' + hlt(v, tm) + '</a>';
}

function api(action, opt) {
  opt = opt || {};
  var cfg = { credentials: 'same-origin', cache: 'no-store', method: opt.body ? 'POST' : 'GET' };
  if (opt.body) { cfg.headers = { 'Content-Type': 'application/json' }; cfg.body = JSON.stringify(opt.body); }
  return fetch(API + '?action=' + action + (opt.qs || ''), cfg).then(function (r) {
    if (r.status === 401) { location.replace('./login.html'); throw new Error('401'); }
    return r.json().catch(function () { return { ok: false, error: 'Máy chủ trả về dữ liệu không hợp lệ.' }; });
  }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'Có lỗi xảy ra.');
    return j.data;
  });
}

function load() {
  el('view').innerHTML = '<div class="empty">Đang tải…</div>';
  api('list').then(function (d) {
    ITEMS = d.items || [];
    IS_ADMIN = !!Number(d.is_admin);
    CAPS = IS_ADMIN ? 15 : (Number(d.caps) || 0);
    el('btnAdd').style.display = (CAPS & 2) ? '' : 'none';
    if (!(CAPS & 14)) {
      el('warn').innerHTML = '<div class="warnbox" style="margin-bottom:16px">Bạn đang xem ở chế độ chỉ đọc — chưa được cấp quyền thêm/sửa nhà cung cấp.</div>';
    }
    draw();
  }).catch(function (e) {
    el('view').innerHTML = '<div class="empty"><b>Không tải được danh sách</b>' + esc(e.message) + '</div>';
  });
}

/* ── o hien thi tai khoan ngan hang, bam de copy so TK ── */
function bankCell(s, tm) {
  if (!s.bank_name && !s.bank_account) return '<span style="color:var(--text3)">—</span>';
  var out = '';
  if (s.bank_account) {
    out += '<div class="acc" title="Bấm để copy số tài khoản" onclick="copyAcc(this,\'' + esc(s.bank_account) + '\')">'
         + hlt(s.bank_account, tm) + '</div>';
  }
  if (s.bank_name)   out += '<div class="sub">' + hlt(s.bank_name, tm) + (s.bank_branch ? ' · ' + esc(s.bank_branch) : '') + '</div>';
  if (s.bank_holder) out += '<div class="sub">' + hlt(s.bank_holder, tm) + '</div>';
  return out;
}
function copyAcc(node, acc) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(acc).then(function () { toast('Đã copy số tài khoản ' + acc); },
                                           function () { toast('Không copy được — anh bôi đen và copy tay nhé.', true); });
  } else {
    toast('Trình duyệt không cho copy tự động.', true);
  }
}

/* ── khu vuc ── */
var REGIONS = [['bac','Miền Bắc'],['trung','Miền Trung'],['nam','Miền Nam'],['tay','Miền Tây']];
var FR = "";   /* khu vuc dang loc, "" = tat ca */
function regionLabel(v) {
  for (var i = 0; i < REGIONS.length; i++) if (REGIONS[i][0] === v) return REGIONS[i][1];
  return '';
}
function setRegion(v) { FR = (FR === v) ? "" : v; draw(); }

/* --- loc theo loai: cong ty / ca nhan --- */
var KD = '';
function kindOf(s) { return (s && s.kind === 'person') ? 'person' : 'company'; }
function setKind(v) { KD = (KD === v) ? '' : v; draw(); }
function drawKindBar() {
  var pool = FR ? ITEMS.filter(function (s) { return (s.region || '') === FR; }) : ITEMS;
  var nc = 0, np = 0;
  for (var i = 0; i < pool.length; i++) { if (kindOf(pool[i]) === 'person') np++; else nc++; }
  el('kfilter').innerHTML =
      '<button class="rf' + (KD ? '' : ' on') + '" onclick="setKind(\'\')">Tất cả</button>'
    + '<button class="rf' + (KD === 'company' ? ' on' : '') + '" onclick="setKind(\'company\')">Công ty <b>' + nc + '</b></button>'
    + '<button class="rf' + (KD === 'person' ? ' on' : '') + '" onclick="setKind(\'person\')">Cá nhân <b>' + np + '</b></button>';
}
function drawRegionBar() {
  var RP = KD ? ITEMS.filter(function (s) { return kindOf(s) === KD; }) : ITEMS;
  var h = '<button class="rf' + (FR ? '' : ' on') + '" onclick="setRegion(\'\')">Tất cả</button>';
  REGIONS.forEach(function (r) {
    var n = 0;
    for (var i = 0; i < RP.length; i++) if ((RP[i].region || '') === r[0]) n++;
    h += '<button class="rf' + (FR === r[0] ? ' on' : '') + '" onclick="setRegion(\'' + r[0] + '\')">'
       + r[1] + '<b>' + n + '</b></button>';
  });
  var un = 0;
  for (var j = 0; j < RP.length; j++) if (!RP[j].region) un++;
  if (un) h += '<span class="rf-note">' + un + ' chưa xác định</span>';
  el('rfilter').innerHTML = h;
}

function draw() {
  if (!POS_MAP) ensurePos(function () { draw(); });
  var tm = terms(FQ);
  var base = ITEMS;
  if (FR) base = ITEMS.filter(function (s) { return (s.region || '') === FR; });
  if (KD) base = base.filter(function (s) { return kindOf(s) === KD; });
  var rows = tm.length ? base.filter(function (s) {
    return hit([s.name, s.contact, s.phone, s.phone2, s.address, s.email, s.note, s.bank_name, s.bank_account, s.bank_holder, posLabel(s.position)].join(' '), tm);
  }) : base;

  el('chips').innerHTML = '<span class="chip"><b>' + ITEMS.length + '</b> nhà cung cấp</span>'
    + (tm.length ? '<span class="chip" style="margin-left:8px"><b>' + rows.length + '</b> khớp</span>' : '');

  drawRegionBar();
  drawKindBar();
  if (!rows.length) {
    el('view').innerHTML = '<div class="empty"><b>' + (tm.length ? 'Không tìm thấy nhà cung cấp nào' : 'Chưa có nhà cung cấp')
      + '</b>' + (tm.length ? 'Thử từ khoá khác.' : 'Bấm “+ Nhà cung cấp” để thêm.') + '</div>';
    return;
  }

  var h = '<table><thead><tr>'
    + '<th>Công ty</th><th style="width:120px">Khu vực</th><th style="width:130px">Vị trí</th><th style="width:170px">Người liên hệ</th><th style="width:150px">Điện thoại</th>'
    + '<th style="width:210px">Tài khoản</th><th class="addr">Địa chỉ</th><th style="width:100px"></th>'
    + '</tr></thead><tbody>';

  rows.forEach(function (s) {
    var i = ITEMS.indexOf(s);
    var off = !Number(s.active);
    h += '<tr' + (off ? ' class="off"' : '') + '>'
      + '<td><div class="nm">' + hlt(s.name, tm) + (off ? '<span class="badge">ngừng</span>' : '') + (s.kind === 'person' ? '<span class="badge">Cá nhân</span>' : '') + '</div>'
      + (s.email ? '<div class="sub">' + hlt(s.email, tm) + '</div>' : '')
      + (s.tax_code ? '<div class="sub">MST: ' + esc(s.tax_code) + '</div>' : '')
      + (s.note ? '<div class="sub">' + hlt(s.note, tm) + '</div>' : '')
      + '</td>'
      + '<td>' + (s.region ? '<span class="rg rg-' + s.region + '">' + regionLabel(s.region) + '</span>' : '<span style="color:var(--text3)">—</span>') + '</td>'
      + '<td>' + (s.position ? '<b>' + esc(posLabel(s.position)) + '</b>' : '<span style="color:var(--text3)">—</span>') + '</td>'
      + '<td>' + (s.contact ? hlt(s.contact, tm) : '<span style="color:var(--text3)">—</span>') + '</td>'
      + '<td class="tel">' + (s.phone ? telLink(s.phone, tm) : '<span style="color:var(--text3)">—</span>')
      + (s.phone2 ? '<div class="sub tel">' + telLink(s.phone2, tm) + '</div>' : '') + '</td>'
      + '<td>' + bankCell(s, tm) + '</td>'
      + '<td class="addr">' + (s.address ? hlt(s.address, tm) : '<span style="color:var(--text3)">—</span>') + '</td>'
      + '<td class="ac">'
      + ((CAPS & 4) ? '<button class="iconbtn" title="Sửa" onclick="openEdit(' + i + ')"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>' : '')
          + ((CAPS & 8) ? '<button class="iconbtn del" title="Xoá" onclick="askDel(' + i + ')"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>' : '')
      + '</td></tr>';
  });
  el('view').innerHTML = h + '</tbody></table>';
}

/* ── tìm kiếm ── */
el('q').addEventListener('input', function () {
  FQ = this.value;
  el('sbox').classList[FQ ? 'add' : 'remove']('has');
  clearTimeout(qTimer);
  qTimer = setTimeout(draw, 80);
});
el('q').addEventListener('keydown', function (e) { if (e.key === 'Escape') { e.stopPropagation(); clearSearch(); } });
function clearSearch() { el('q').value = ''; FQ = ''; el('sbox').classList.remove('has'); draw(); el('q').focus(); }

/* ── thêm / sửa ── */
var POS_MAP = null;
function posLabel(k) { if (!k) return ''; return (POS_MAP && POS_MAP[k]) ? POS_MAP[k] : k; }
function ensurePos(cb) {
  if (POS_MAP) { if (cb) cb(); return; }
  fetch('./api/auth-api.php?action=positions', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      POS_MAP = (j && j.ok && j.data) ? j.data : {};
      var sel = el('ePos');
      if (sel) sel.innerHTML = '<option value="">— chưa xác định —</option>' +
        Object.keys(POS_MAP).map(function (k) {
          return '<option value="' + k + '">' + POS_MAP[k] + '</option>';
        }).join('');
      if (cb) cb();
    })
    .catch(function () { POS_MAP = {}; if (cb) cb(); });
}

function kindLbl() {
  var p = el('eKind').value === 'person';
  el('eNameLb').textContent  = p ? 'Họ tên *' : 'Công ty *';
  el('eName').placeholder    = p ? 'VD: Nguyễn Văn Nam' : 'VD: Song Khánh';
  var fp = el('fgPos'); if (fp) fp.style.display = p ? '' : 'none';
  ensurePos();
}
function fill(s) {
  el('eKind').value = (s && s.kind === 'person') ? 'person' : 'company';
  kindLbl();
  el('eName').value    = s ? (s.name || '') : '';
  el('eContact').value = s ? (s.contact || '') : '';
  el('eTax').value     = s ? (s.tax_code || '') : '';
  el('ePhone').value   = s ? (s.phone || '') : '';
  el('ePhone2').value  = s ? (s.phone2 || '') : '';
  el('eEmail').value   = s ? (s.email || '') : '';
  el('eAddr').value    = s ? (s.address || '') : '';
  el('eNote').value    = s ? (s.note || '') : '';
  el('eRegion').value  = s ? (s.region || '') : '';
  ensurePos(function(){ var e = el('ePos'); if (e) e.value = s ? (s.position || '') : ''; });
  el('eBank').value    = s ? (s.bank_name || '') : '';
  el('eBranch').value  = s ? (s.bank_branch || '') : '';
  el('eAcc').value     = s ? (s.bank_account || '') : '';
  el('eHolder').value  = s ? (s.bank_holder || '') : '';
  el('eActive').value  = s ? String(Number(s.active) ? 1 : 0) : '1';
}
function openAdd() {
  editing = null;
  el('eTitle').textContent = 'Nhà cung cấp mới';
  fill(null);
  el('mEdit').classList.add('on');
  setTimeout(function () { el('eName').focus(); }, 60);
}
function openEdit(i) {
  editing = ITEMS[i];
  el('eTitle').textContent = 'Sửa nhà cung cấp';
  fill(editing);
  el('mEdit').classList.add('on');
}
function closeEdit() { el('mEdit').classList.remove('on'); }

function saveIt() {
  var name = el('eName').value.trim();
  if (!name) { toast('Tên công ty là bắt buộc.', true); el('eName').focus(); return; }
  var b = {
    id: editing ? Number(editing.id) : 0,
    name: name,
    kind: el('eKind').value,
    contact: el('eContact').value.trim(),
    tax_code: el('eTax').value.trim(),
    phone: el('ePhone').value.trim(),
    phone2: el('ePhone2').value.trim(),
    email: el('eEmail').value.trim(),
    address: el('eAddr').value.trim(),
    note: el('eNote').value.trim(),
    region: el('eRegion').value,
    position: el('ePos') ? el('ePos').value : '',
    bank_name: el('eBank').value.trim(),
    bank_branch: el('eBranch').value.trim(),
    bank_account: el('eAcc').value.trim(),
    bank_holder: el('eHolder').value.trim(),
    active: Number(el('eActive').value)
  };
  var btn = el('eOk');
  btn.disabled = true; btn.textContent = 'Đang lưu…';
  api('save', { body: b }).then(function () {
    closeEdit(); toast('Đã lưu ' + name); load();
  }).catch(function (e) { toast(e.message, true); })
    .then(function () { btn.disabled = false; btn.textContent = 'Lưu'; });
}

/* ── xoá ── */
function askDel(i) {
  delIdx = i;
  el('dSub').textContent = 'Xoá “' + ITEMS[i].name + '” khỏi danh bạ? Nếu đang gắn với sản phẩm trong rate card thì hệ thống chỉ chuyển sang trạng thái Ngừng hợp tác.';
  el('mDel').classList.add('on');
}
function closeDel() { el('mDel').classList.remove('on'); delIdx = -1; }
function okDel() {
  if (delIdx < 0) return;
  var s = ITEMS[delIdx];
  var btn = el('dOk');
  btn.disabled = true; btn.textContent = 'Đang xoá…';
  api('delete', { body: { id: Number(s.id) } }).then(function (d) {
    closeDel();
    toast(d.deactivated ? ('Đang dùng ở ' + d.used + ' sản phẩm — đã chuyển sang Ngừng hợp tác.') : ('Đã xoá ' + s.name));
    load();
  }).catch(function (e) { toast(e.message, true); })
    .then(function () { btn.disabled = false; btn.textContent = 'Xoá'; });
}

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  closeEdit(); closeDel();
});

load();
</script>
</body>
</html>
