  document.documentElement.style.visibility = 'hidden';
  fetch('./api/auth-api.php?action=me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => {

      window.__APSA_USER = res.data;
      document.documentElement.style.visibility = 'visible';
    })
    .catch(() => {
      location.replace('./login.html?next=' + encodeURIComponent(location.pathname + location.search));
    });

/* ---- APSA1895 — LIGHT MODE cho trang nay ----
   Trang tu khai bo token rieng o :root nen de len theme.css;
   khoi duoi day dinh nghia lai dung bo token do cho nen sang. */
html[data-theme="light"] {
  --bg: #ffffff;
  --bg2: #ffffff;
  --bg3: #fafaf9;
  --bg4: #f2f2f0;
  --border: rgba(0,0,0,.14);
  --border-h: rgba(194,84,47,.55);
  --text: #3a3a34;
  --text2: #57574f;
  --text3: #6e6e66;
  --accent: #d97757;
  --accent2: #d97757;
  --glow: rgba(217,119,87,.28);
  --green: #d97757;
  --orange: #242424;
  --pink: #d97757;
  --cyan: #242424;
  --yellow: #d97757;
  --red: #b3261e;
  --w-rgb: 0,0,0;
}
 }
    html { scroll-behavior: smooth; }
    body { font-family: 'Oxanium', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(0,0,0,0.9); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      height: 60px; padding: 0 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo img { height: 26px; filter: brightness(0) invert(1); opacity: .9; display: block; }
    .back-btn {
      display: flex; align-items: center; gap: 6px;
      color: var(--text2); text-decoration: none; font-size: 13px; font-weight: 500;
      padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); transition: all .2s;
    }
    .back-btn:hover { color: var(--text); border-color: var(--border-h); }

    /* ── PAGE HEAD ── */
    .page-head { padding: 32px 28px 20px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
    .page-head h1 { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
    .page-head p  { font-size: 13px; color: var(--text2); margin-top: 4px; }
    .head-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 4px 14px; font-size: 12px; color: var(--text2); }
    .chip strong { color: var(--text); }

    /* ── TOOLBAR ── */
    .toolbar { padding: 0 28px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
    .search-input { width: 100%; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px 8px 34px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color .2s; }
    .search-input:focus { border-color: rgba(var(--neon-rgb),.5); }
    .search-input::placeholder { color: var(--text3); }
    .fsel { background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; color: var(--text2); font-size: 13px; font-family: inherit; outline: none; cursor: pointer; }
    .fsel:focus { border-color: rgba(var(--neon-rgb),.4); }
    .ml { margin-left: auto; }
    .btn { padding: 8px 15px; border-radius: 9px; font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; border: none; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-p { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; box-shadow: 0 0 12px var(--glow); }
    .btn-p:hover { transform: translateY(-1px); box-shadow: 0 4px 18px var(--glow); }
    .btn-g { background: var(--bg2); border: 1px solid var(--border); color: var(--text2); }
    .btn-g:hover { color: var(--text); border-color: var(--border-h); }

    /* ── TABLE ── */
    .tbl-wrap { padding: 0 28px 40px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
    thead tr { border-bottom: 1px solid var(--border); }
    th { padding: 9px 14px; text-align: left; font-size: 10px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--text3); white-space: nowrap; }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:hover td { background: rgba(var(--w-rgb),.02); }
    tbody tr:last-child td { border-bottom: none; }

    /* platform pill */
    .plat-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 11px; border-radius: 20px; font-size: 12px; font-weight: 600;
      background: var(--pill-bg, var(--bg3)); color: var(--pill-fg, var(--text2));
      white-space: nowrap;
    }

    /* username cell */
    .user-cell { display: flex; align-items: center; gap: 8px; }
    .user-val { font-weight: 500; color: var(--text); font-size: 13px; word-break: break-all; }
    .copy-btn {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text3); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .copy-btn:hover { color: var(--accent2); border-color: var(--accent); }

    /* password cell */
    .pw-cell { display: flex; align-items: center; gap: 6px; }
    .pw-dots { font-size: 14px; letter-spacing: 2px; color: var(--text3); user-select: none; }
    .pw-val  { font-size: 13px; color: var(--text); font-family: monospace; word-break: break-all; }
    .eye-btn {
      flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px;
      background: var(--bg3); border: 1px solid var(--border);
      color: var(--text3); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .eye-btn:hover { color: var(--text); border-color: var(--border-h); }

    /* assigned chips */
    .assigned-wrap { display: flex; flex-wrap: wrap; gap: 4px; }
    .person-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: 20px; padding: 2px 9px 2px 4px;
      font-size: 12px; color: var(--text2);
    }
    .person-chip .dot { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; color: var(--text); flex-shrink: 0; }

    /* action buttons */
    .row-act { display: flex; gap: 5px; }   /* APSA1852: doi ten de khong dinh .act cua theme.css */
    .ico-btn { height: 30px; padding: 0 10px; border-radius: 8px; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; font-family: inherit; white-space: nowrap; transition: all .15s; }
    .ico-btn:hover { border-color: var(--border-h); color: var(--text); background: var(--bg4); }
    .ico-btn.del:hover { background: rgba(255,77,77,.12); border-color: rgba(255,77,77,.3); color: var(--red); }

    .note-text { font-size: 11px; color: var(--text3); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── MODAL ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(8px); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
    .overlay.open { display: flex; }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 18px; padding: 28px; width: 100%; max-width: 500px; max-height: 92vh; overflow-y: auto; position: relative; }
    .modal::-webkit-scrollbar { width: 4px; }
    .modal::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
    .modal-x { position: absolute; top: 14px; right: 14px; width: 28px; height: 28px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all .2s; }
    .modal-x:hover { color: var(--text); }
    .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 3px; }
    .modal-sub { font-size: 12px; color: var(--text2); margin-bottom: 22px; }
    .sec-title { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text3); margin: 18px 0 10px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .fg { margin-bottom: 10px; }
    .fg label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 5px; }
    .fg input, .fg select, .fg textarea { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color .2s; }
    .fg input:focus, .fg select:focus, .fg textarea:focus { border-color: rgba(var(--neon-rgb),.5); }
    .fg input::placeholder, .fg textarea::placeholder { color: var(--text3); }
    .fg textarea { resize: none; }

    /* password input with toggle */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 38px; }
    .pw-toggle { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text3); cursor: pointer; padding: 0; display: flex; }
    .pw-toggle:hover { color: var(--text); }

    /* assigned people */
    .people-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .person-row { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; }
    .person-row input { flex: 1; background: none; border: none; color: var(--text); font-size: 13px; font-family: inherit; outline: none; }
    .person-row input::placeholder { color: var(--text3); }
    .person-row select { flex: 1; background: none; border: none; color: var(--text); font-size: 13px; font-family: inherit; outline: none; cursor: pointer; appearance: none; -webkit-appearance: none; }
    .person-row select option { background: var(--bg3); color: var(--text); }
    .person-row select option[value=""] { color: var(--text3); }
    .person-color { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; cursor: pointer; border: 2px solid rgba(var(--w-rgb),.2); }
    .remove-person { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; transition: color .15s; }
    .remove-person:hover { color: var(--red); }
    .add-person-btn { display: flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px dashed var(--border); border-radius: 9px; padding: 8px 12px; font-size: 12px; color: var(--text3); cursor: pointer; width: 100%; transition: all .2s; font-family: inherit; }
    .add-person-btn:hover { border-color: var(--accent); color: var(--accent2); }

    .modal-foot { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

    /* ── PLATFORM COLORS ── */
    /* defined inline via data */

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 56px 24px; color: var(--text3); }
    .empty .ico { font-size: 44px; margin-bottom: 10px; }
    .empty p { font-size: 14px; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(70px); background: var(--bg3); border: 1px solid var(--border); border-radius: 30px; padding: 9px 18px; font-size: 13px; color: var(--text); transition: transform .28s cubic-bezier(.34,1.56,.64,1); z-index: 999; pointer-events: none; white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      .page-head, .toolbar, .tbl-wrap { padding-left: 16px; padding-right: 16px; }
      .frow { grid-template-columns: 1fr; }
    }
  </style>

  <div class="modal">
    <button class="modal-x" onclick="closeOv('ovNew')">×</button>
    <h2 id="nTitle">Thêm bộ font</h2>
    <p class="modal-sub" id="nSub">Nhập tên bộ font rồi kéo file .zip vào. Hệ thống tự bung các file chữ bên trong để xem thử.</p>
    <div class="frow frow2" id="nNameRow">
      <div class="fg"><label>Tên bộ font *</label><input id="nName" type="text" placeholder="Ví dụ: Montserrat" /></div>
    </div>
    <div class="drop" id="drop">Kéo thả file .zip vào đây — hoặc bấm để chọn</div>
    <input type="file" id="fileInput" multiple accept=".zip,.ttf,.otf,.ttc,.woff,.woff2" class="hidden" />
    <div class="uplist" id="uplist"></div>
    <div class="modal-foot">
      <button class="mini" onclick="closeOv('ovNew')">Huỷ</button>
      <button class="btn-primary" id="nSave" onclick="saveNew()">Lưu</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* APSA1859: Kho Font — don gian: ten font + file zip la xong. Ca team deu co quyen. */
var API = '/api/font-api.php';
var LIST = [], FACE = {}, PICK = {}, QUEUE = [], FAM = 0;
var ICO = {
  dl:  '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>',
  pen: '<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  tr:  '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>',
  up:  '<svg viewBox="0 0 24 24"><path d="M12 19V7m0 0l-4 4m4-4l4 4M4 5h16"/></svg>'
};

function el(i) { return document.getElementById(i); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function toast(m) {
  var t = el('toast'); t.textContent = m; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(function () { t.classList.remove('show'); }, 2800);
}
function kb(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + ' B';
  if (n < 1048576) return Math.round(n / 1024) + ' KB';
  return (n / 1048576).toFixed(1) + ' MB';
}
function noAcc(s) {
  s = String(s || '').toLowerCase().normalize('NFD')
      .replace(new RegExp('[' + String.fromCharCode(768) + '-' + String.fromCharCode(879) + ']', 'g'), '');
  return s.replace(/đ/g, 'd');
}
function api(action, body) {
  return fetch(API + '?action=' + action, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {})
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.error) || 'Có lỗi xảy ra');
    return j.data;
  });
}
function face(fid) {
  var nm = 'apsaf' + fid;
  if (!FACE[fid]) {
    var s = document.createElement('style');
    s.textContent = "@font-face{font-family:'" + nm + "';src:url('" + API + "?action=file&id=" + fid + "');font-display:swap;}";
    document.head.appendChild(s);
    FACE[fid] = 1;
  }
  return nm;
}
function applySample() {
  var s = el('size').value;
  el('szv').textContent = s + 'px';
  var txt = el('sample').value || 'AaBbCc 0123';
  [].forEach.call(document.querySelectorAll('.fc-prev span'), function (n) {
    n.textContent = txt; n.style.fontSize = s + 'px';
  });
}

function load() {
  return api('list', {}).then(function (d) { LIST = d.rows || []; render(); })
    .catch(function (e) { toast(e.message); });
}

/* dung luong thuc su se tai ve: uu tien file zip goc cua tung bo */
function packBytes(x) {
  var fs = x.files || [];
  var z = fs.filter(function (f) { return f.ext === 'zip'; });
  var use = z.length ? z : fs, n = 0;
  use.forEach(function (f) { n += (f.bytes || 0); });
  return n;
}

function render() {
  var q = noAcc((el('q').value || '').trim());
  var rows = LIST.filter(function (r) { return !q || noAcc(r.name).indexOf(q) >= 0; });
  el('grid').innerHTML = rows.map(card).join('');
  var em = el('fempty');
  if (rows.length) {
    em.classList.add('hidden');
  } else {
    em.classList.remove('hidden');
    em.innerHTML = LIST.length ? 'Không tìm thấy bộ font nào.'
      : 'Chưa có bộ font nào. Bấm <b>+ Thêm bộ font</b> để bắt đầu.';
  }
  var all = 0, nf = 0;
  LIST.forEach(function (x) { all += packBytes(x); nf += (x.files || []).length; });
  var b = el('dlAll');
  if (nf) {
    b.classList.remove('hidden');
    b.innerHTML = ICO.dl + 'Tải tất cả (' + LIST.length + ' bộ · ' + kb(all) + ')';
  } else {
    b.classList.add('hidden');
  }
  applySample();
}

function stMore(b) {
  var box = b.parentNode; if (!box) return;
  var on = box.classList.toggle('open');
  b.textContent = on ? 'Thu gọn' : ('+' + (b.getAttribute('data-n') || '') + ' kiểu');
}

function card(r) {
  var files = r.files || [];
  var web = files.filter(function (f) { return f.web; });
  var pid = PICK[r.id] || r.preview_id || (web[0] ? web[0].id : 0);
  var pv = pid
    ? '<div class="fc-prev"><span style="font-family:\'' + face(pid) + '\',var(--font-body)"></span></div>'
    : '<div class="fc-prev miss">Chưa xem thử được — file zip không có chữ dạng ttf / otf / woff.</div>';
  var LIMST = 14;                                   /* APSA1929: thu gon danh sach kieu chu */
  var sts = web.map(function (f, i) {
    var onx = (f.id === pid);
    return '<span class="st' + (onx ? ' on' : '')
      + ((i >= LIMST && !onx) ? ' xtra' : '') + '" title="' + esc(f.orig) + ' · ' + kb(f.bytes) + '">' +
      '<span class="nm" onclick="pick(' + r.id + ',' + f.id + ')">' + esc(f.style) + '</span></span>';
  }).join('');
  if (web.length > LIMST) {
    sts += '<button type="button" class="st more" data-n="' + (web.length - LIMST)
         + '" onclick="stMore(this)">+' + (web.length - LIMST) + ' kiểu</button>';
  }
  var pack = files.filter(function (f) { return f.ext === 'zip'; })[0];
  return '<div class="fcard">' +
    '<div class="fc-top"><div class="fc-name">' + esc(r.name) + '</div></div>' +
    pv +
    (sts ? '<div class="styles">' + sts + '</div>' : '') +
    '<div class="fc-foot">' +
      '<div class="fc-meta">' + (web.length ? web.length + ' kiểu chữ · ' : '') + kb(r.bytes) +
        (r.by ? ' · thêm bởi ' + esc(r.by) : '') + '</div>' +
      (pack ? '<button class="mini" onclick="dl(' + pack.id + ')">' + ICO.dl + 'Tải bộ font</button>'
            : (files.length ? '<button class="mini" onclick="dlZip(' + r.id + ')">' + ICO.dl + 'Tải bộ font</button>' : '')) +
      '<button class="mini" onclick="addMore(' + r.id + ')">' + ICO.up + 'Thêm file</button>' +
      '<button class="mini" onclick="rename(' + r.id + ')">' + ICO.pen + 'Đổi tên</button>' +
      '<button class="mini danger" onclick="delFam(' + r.id + ')">' + ICO.tr + 'Xoá</button>' +
    '</div></div>';
}

function pick(fam, fid) {
  PICK[fam] = fid;
  render();
  var f = LIST.filter(function (r) { return r.id === fam; })[0];
  if (f && f.preview_id !== fid) { f.preview_id = fid; api('set-preview', { file_id: fid }).catch(function () {}); }
}
function dl(fid)    { window.location.href = API + '?action=download&id=' + fid; }
function dlZip(fam) { window.location.href = API + '?action=zip&id=' + fam; }
function dlAll() {
  var all = 0;
  LIST.forEach(function (x) { all += packBytes(x); });
  if (all > 1500 * 1024 * 1024) { toast('Kho font hơn 1,5 GB — tải từng bộ giúp anh nhé'); return; }
  toast('Đang gói file, chờ chút...');
  window.location.href = API + '?action=zip-all';
}

function closeOv(id) { el(id).classList.remove('open'); }
function outClose(e, id) { if (e.target === el(id)) closeOv(id); }

function openNew() {
  FAM = 0; QUEUE = [];
  el('nTitle').textContent = 'Thêm bộ font';
  el('nSub').textContent = 'Nhập tên bộ font rồi kéo file .zip vào. Hệ thống tự bung các file chữ bên trong để xem thử.';
  el('nNameRow').classList.remove('hidden');
  el('nName').value = '';
  drawQueue();
  el('ovNew').classList.add('open');
  setTimeout(function () { el('nName').focus(); }, 60);
}

function addMore(id) {
  var r = LIST.filter(function (x) { return x.id === id; })[0];
  if (!r) return;
  FAM = id; QUEUE = [];
  el('nTitle').textContent = 'Thêm file — ' + r.name;
  el('nSub').textContent = 'Kéo thêm file .zip hoặc file chữ vào bộ font này.';
  el('nNameRow').classList.add('hidden');
  drawQueue();
  el('ovNew').classList.add('open');
}

function addFiles(fs) {
  [].forEach.call(fs, function (f) {
    if (!/\.(zip|ttf|otf|ttc|woff2?)$/i.test(f.name)) { toast('Bỏ qua ' + f.name + ' (sai định dạng)'); return; }
    QUEUE.push({ f: f, st: '' });
  });
  drawQueue();
  if (!FAM && !el('nName').value.trim() && QUEUE.length) {
    el('nName').value = QUEUE[0].f.name.replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' ').trim();
  }
}

function drawQueue() {
  el('uplist').innerHTML = QUEUE.map(function (q) {
    var c = q.st === 'ok' ? ' ok' : (q.st && q.st !== '...' ? ' er' : '');
    return '<div class="uprow"><span class="nm" title="' + esc(q.f.name) + '">' + esc(q.f.name) + '</span>' +
      '<span class="stt' + c + '">' + esc(q.st || kb(q.f.size)) + '</span></div>';
  }).join('');
}

function saveNew() {
  var name = (el('nName').value || '').trim();
  if (!FAM && !name) { toast('Chưa nhập tên bộ font'); return; }
  el('nSave').disabled = true;
  var start = FAM
    ? Promise.resolve(FAM)
    : api('save', { id: 0, name: name }).then(function (d) { return d.id; });
  start.then(function (fid) {
    if (!QUEUE.length) {
      closeOv('ovNew');
      return load().then(function () { toast('Đã tạo bộ font'); });
    }
    return sendAll(fid).then(function () {
      return load().then(function () {
        var bad = QUEUE.filter(function (q) { return q.st !== 'ok'; }).length;
        toast(bad ? 'Đã tải xong, ' + bad + ' file lỗi' : 'Đã xong');
        if (!bad) closeOv('ovNew');
      });
    });
  }).catch(function (e) { toast(e.message); })
    .then(function () { el('nSave').disabled = false; });
}

function sendAll(fid) {
  var i = 0;
  var step = function () {
    if (i >= QUEUE.length) return Promise.resolve();
    var q = QUEUE[i];
    q.st = '...'; drawQueue();
    var fd = new FormData();
    fd.append('family_id', fid);
    fd.append('file', q.f);
    return fetch(API + '?action=upload', { method: 'POST', body: fd })
      .then(function (r) { return r.json(); })
      .then(function (j) { q.st = (j && j.ok) ? 'ok' : ((j && j.error) || 'lỗi'); })
      .catch(function () { q.st = 'lỗi mạng'; })
      .then(function () { i++; drawQueue(); return step(); });
  };
  return step();
}

function rename(id) {
  var r = LIST.filter(function (x) { return x.id === id; })[0];
  if (!r) return;
  var v = prompt('Tên bộ font:', r.name);
  if (v === null) return;
  v = v.trim();
  if (!v) { toast('Chưa nhập tên'); return; }
  api('save', { id: id, name: v }).then(function () { toast('Đã đổi tên'); return load(); })
    .catch(function (e) { toast(e.message); });
}

function delFam(id) {
  var r = LIST.filter(function (x) { return x.id === id; })[0];
  if (!r) return;
  if (!confirm('Xoá bộ font "' + r.name + '"? Không khôi phục được.')) return;
  api('delete', { id: id }).then(function () { toast('Đã xoá'); return load(); })
    .catch(function (e) { toast(e.message); });
}

(function boot() {
  var d = el('drop'), fi = el('fileInput');
  d.addEventListener('click', function () { fi.click(); });
  fi.addEventListener('change', function () { addFiles(fi.files); fi.value = ''; });
  ['dragenter', 'dragover'].forEach(function (ev) {
    d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.add('on'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    d.addEventListener(ev, function (e) { e.preventDefault(); d.classList.remove('on'); });
  });
  d.addEventListener('drop', function (e) { if (e.dataTransfer) addFiles(e.dataTransfer.files); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeOv('ovNew'); });
  load();
})();
</script>
</body>
</html>
