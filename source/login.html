<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — APSA</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000000;
      --bg2: #0b0b0b;
      --bg3: #141414;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.18);
      --text: #ffffff;
      --text2: #9a9a9a;
      --text3: #5e5e5e;
      --accent: #dff20d;
      --accent2: #c9dd00;
      --accent-glow: rgba(223,242,13,0.35);
      --red: #ff4d4d;
      --radius: 14px;
    }

    body {
      font-family: 'Oxanium', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(223,242,13,0.15), transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(223,242,13,0.1), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 32px;
    }

    .logo-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
      text-align: center;
    }

    .logo-mark {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      color: white;
      box-shadow: 0 0 24px var(--accent-glow);
    }

    h1 { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .sub { font-size: 13px; color: var(--text2); }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text2);
      margin-bottom: 6px;
      margin-top: 16px;
    }

    label:first-of-type { margin-top: 0; }

    input {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: rgba(223,242,13,0.5);
      box-shadow: 0 0 0 3px rgba(223,242,13,0.1);
    }

    /* --- Nut hien/an mat khau --- */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 46px; }
    .pw-eye {
      position: absolute; top: 50%; right: 6px; transform: translateY(-50%);
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; padding: 0;
      background: none; border: 0; border-radius: 8px; cursor: pointer;
      color: #9a9a9a; transition: color .15s, background .15s;
    }
    .pw-eye:hover { color: var(--accent, #dff20d); background: rgba(255,255,255,.07); }
    .pw-eye:focus-visible { outline: 2px solid var(--accent, #dff20d); outline-offset: 2px; }
    .pw-eye svg { width: 18px; height: 18px; display: block; }

    .btn {
      width: 100%;
      margin-top: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 24px var(--accent-glow); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .error {
      display: none;
      margin-top: 16px;
      background: rgba(255,77,77,0.1);
      border: 1px solid rgba(255,77,77,0.3);
      color: var(--red);
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
    }

    .foot {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--text3);
    }
  </style>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Oxanium:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/theme.css?v=7" />
</head>
<body>

  <form class="card" id="loginForm">
    <div class="logo-row">
      <div class="logo-mark">AP</div>
      <h1>APSA — Bộ công cụ nội bộ</h1>
      <div class="sub">Đăng nhập để tiếp tục</div>
    </div>

    <label for="username">Tài khoản</label>
    <input type="text" id="username" name="username" autocomplete="username" required autofocus />

    <label for="password">Mật khẩu</label>
    <div class="pw-wrap">
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <button type="button" class="pw-eye" id="pwEye" title="Hiện mật khẩu" aria-label="Hiện mật khẩu" tabindex="-1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>

    <button class="btn" type="submit" id="submitBtn">Đăng nhập</button>

    <div class="error" id="errorBox"></div>
    <div class="foot">© APSA Agency</div>
  </form>

  <script>
    /* --- Hien / an mat khau --- */
    (function () {
      var pw = document.getElementById('password'), eye = document.getElementById('pwEye');
      if (!pw || !eye) return;
      var OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
      var SHUT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c6.4 0 10 7 10 7a17 17 0 0 1-3.2 3.9"/><path d="M6.4 7.6A17 17 0 0 0 2 13s3.6 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 10.1a3 3 0 0 0 4.1 4.2"/></svg>';
      eye.addEventListener('click', function () {
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        eye.innerHTML = show ? SHUT : OPEN;
        var lbl = show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu';
        eye.title = lbl; eye.setAttribute('aria-label', lbl);
        pw.focus();
        try { pw.setSelectionRange(pw.value.length, pw.value.length); } catch (e) {}
      });
    })();

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    function getNext() {
      const params = new URLSearchParams(location.search);
      const next = params.get('next');
      if (next && next.startsWith('/')) return next;
      return './index.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đang đăng nhập...';

      try {
        const res = await fetch('./api/auth-api.php?action=login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || 'Đăng nhập thất bại');
        location.href = getNext();
      } catch (err) {
        errorBox.textContent = err.message || 'Có lỗi xảy ra, vui lòng thử lại.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Đăng nhập';
      }
    });

    // Nếu đã đăng nhập rồi thì vào thẳng
    fetch('./api/auth-api.php?action=me', { credentials: 'same-origin' })
      .then(r => r.ok ? r.json() : null)
      .then(json => { if (json && json.ok) location.href = getNext(); })
      .catch(() => {});
  </script>
</body>
</html>
