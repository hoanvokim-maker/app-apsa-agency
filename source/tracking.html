<!DOCTYPE html>
<html lang="vi">
<head>
<script>
  document.documentElement.style.visibility = 'hidden';
  fetch('./api/auth-api.php?action=me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => {
      if (!res.ok) throw new Error();
      window.__APSA_USER = res.data;
      document.documentElement.style.visibility = 'visible';
    })
    .catch(() => {
      location.replace('./login.html?next=' + encodeURIComponent(location.pathname + location.search));
    });
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #000000; --bg2: #0b0b0b; --bg3: #141414;
    --border: rgba(255,255,255,0.08); --border-hover: rgba(255,255,255,0.18);
    --text: #ffffff; --text2: #9a9a9a; --text3: #5e5e5e;
    --accent: #dff20d; --accent2: #c9dd00; --accent-glow: rgba(223,242,13,0.35);
    --green: #dff20d; --cyan: #ffffff; --orange: #ffffff; --red: #ff4d4d;
    --radius: 14px;
  }
  body { font-family: 'Oxanium', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(0,0,0,0.85); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px; height: 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 700; }
  .logo-img { height: 26px; filter: brightness(0) invert(1); opacity: 0.92; }
  .header-title { font-size: 14px; color: var(--text2); font-weight: 500; }
  .btn {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: all 0.2s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--border-hover); }
  .btn-accent {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: white; box-shadow: 0 0 12px var(--accent-glow);
  }
  .btn-accent:hover { transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }

  .container { max-width: 1280px; margin: 0 auto; padding: 32px 24px 80px; }

  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text2); margin-bottom: 28px; }

  /* Stats */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 28px; }
  .stat-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px;
  }
  .stat-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; }
  .stat-value { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  .stat-value small { font-size: 13px; font-weight: 500; color: var(--text2); }

  /* Filters */
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end;
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 20px;
  }
  .filter-group { display: flex; flex-direction: column; gap: 5px; }
  .filter-group label { font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text3); }
  .filter-group input, .filter-group select {
    background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; color: var(--text); font-size: 13px; font-family: inherit; outline: none;
    min-width: 150px;
  }
  .filter-group input:focus, .filter-group select:focus { border-color: rgba(223,242,13,0.5); }
  .filter-group input[type="date"] { color-scheme: dark; }

  /* Table */
  .table-wrap {
    background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
    overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; padding: 12px 16px; font-size: 10px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; color: var(--text3);
    border-bottom: 1px solid var(--border); white-space: nowrap;
    position: sticky; top: 0; background: var(--bg2);
  }
  td { padding: 11px 16px; border-bottom: 1px solid var(--border); color: var(--text2); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(223,242,13,0.04); }
  td.strong { color: var(--text); font-weight: 600; }
  .tag {
    display: inline-block; background: rgba(223,242,13,0.13); border: 1px solid rgba(223,242,13,0.3);
    color: var(--accent2); font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 20px;
  }
  .slide-badge {
    display: inline-block; background: var(--bg3); border: 1px solid var(--border);
    font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 8px; color: var(--text);
  }
  .btn-del {
    background: transparent; border: none; color: var(--text3); cursor: pointer;
    font-size: 14px; padding: 4px 8px; border-radius: 6px; transition: all 0.15s;
  }
  .btn-del:hover { color: var(--red); background: rgba(255,77,77,0.1); }

  .empty { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 14px; }
  .loading { text-align: center; padding: 48px 20px; color: var(--text2); font-size: 14px; }

  .table-footer { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 12px; color: var(--text3); }

  @media (max-width: 640px) {
    .filters { flex-direction: column; align-items: stretch; }
    .filter-group input, .filter-group select { min-width: 0; width: 100%; }
  }
</style>

<header>
  <a class="logo" href="./index.html">
    <img class="logo-img" src="./Logo rectange.png" alt="APSA" onerror="this.outerHTML='<b>APSA</b>'" />
    <span class="header-title">· Tracking Dashboard</span>
  </a>
  <div style="display:flex;gap:8px;">
    <button class="btn" onclick="exportCSV()"><svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-download"/></svg> Xuất CSV</button>
    <button class="btn btn-accent" onclick="loadData()"><svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-refresh"/></svg> Làm mới</button>
  </div>
</header>

<div class="container">
  <h1><svg class="ttl-ico" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="34" r="6" fill="#dff20d"/>
<path d="M13 26a15 15 0 0 1 22 0" fill="none" stroke="#ffffff" stroke-width="5"/>
<path d="M6 18a25 25 0 0 1 36 0" fill="none" stroke="#5e5e5e" stroke-width="5"/></svg> Slide Tracking</h1>
  <p class="subtitle">Theo dõi lượt xem slide từ các trang web — dữ liệu ghi qua <code style="color:var(--accent2)">api/tracking-api.php</code></p>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Tổng lượt xem</div><div class="stat-value" id="statTotal">–</div></div>
    <div class="stat-card"><div class="stat-label">Người dùng</div><div class="stat-value" id="statUsers">–</div></div>
    <div class="stat-card"><div class="stat-label">Dự án</div><div class="stat-value" id="statProjects">–</div></div>
    <div class="stat-card"><div class="stat-label">Bệnh viện</div><div class="stat-value" id="statHospitals">–</div></div>
    <div class="stat-card"><div class="stat-label">Tổng thời gian xem</div><div class="stat-value" id="statDuration">–</div></div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <label>Dự án</label>
      <select id="fProject" onchange="applyFilters()"><option value="">Tất cả</option></select>
    </div>
    <div class="filter-group">
      <label>Tìm kiếm (tên / bệnh viện / IP)</label>
      <input type="text" id="fSearch" placeholder="Gõ để lọc…" oninput="applyFilters()" />
    </div>
    <div class="filter-group">
      <label>Từ ngày</label>
      <input type="date" id="fFrom" onchange="loadData()" />
    </div>
    <div class="filter-group">
      <label>Đến ngày</label>
      <input type="date" id="fTo" onchange="loadData()" />
    </div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th><th>Dự án</th><th>Người sử dụng</th><th>Bệnh viện</th>
          <th>IP</th><th>Bắt đầu</th><th>Slide</th><th>Thời gian xem</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="9" class="loading">Đang tải dữ liệu…</td></tr>
      </tbody>
    </table>
    <div class="table-footer">
      <span id="rowCount"></span>
      <span>Hiển thị tối đa 2000 dòng mới nhất</span>
    </div>
  </div>
</div>

<script>
  // ── API CONFIG ───────────────────────────────────
  const API_URL    = './api/tracking-api.php';
  const API_SECRET = 'APSA_mee53661_X9k2Lp7vQwZn4Rb8';

  let allRows = [];      // data từ server
  let viewRows = [];     // data sau khi lọc client-side

  // ── LOAD ─────────────────────────────────────────
  async function loadData() {
    const tbody = document.getElementById('tbody');
    tbody.innerHTML = '<tr><td colspan="9" class="loading">Đang tải dữ liệu…</td></tr>';

    const url = new URL(API_URL, location.href);
    url.searchParams.set('limit', '2000');
    const from = document.getElementById('fFrom').value;
    const to   = document.getElementById('fTo').value;
    if (from) url.searchParams.set('from', from);
    if (to)   url.searchParams.set('to', to);

    try {
      const res  = await fetch(url, { headers: { 'X-API-Key': API_SECRET } });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'API error');
      allRows = json.data || [];
      buildProjectFilter();
      applyFilters();
    } catch (e) {
      tbody.innerHTML = `<tr><td colspan="9" class="empty"><svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-warning"/></svg> Lỗi tải dữ liệu: ${e.message}</td></tr>`;
    }
  }

  function buildProjectFilter() {
    const sel = document.getElementById('fProject');
    const current = sel.value;
    const projects = [...new Set(allRows.map(r => r.project))].sort();
    sel.innerHTML = '<option value="">Tất cả</option>' +
      projects.map(p => `<option value="${escAttr(p)}">${esc(p)}</option>`).join('');
    if (projects.includes(current)) sel.value = current;
  }

  // ── FILTER + RENDER ──────────────────────────────
  function applyFilters() {
    const project = document.getElementById('fProject').value;
    const q = document.getElementById('fSearch').value.toLowerCase().trim();

    viewRows = allRows.filter(r => {
      if (project && r.project !== project) return false;
      if (q) {
        const hay = [r.user_name, r.hospital, r.ip, r.slide].map(x => (x || '').toLowerCase()).join(' ');
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    renderStats();
    renderTable();
  }

  function renderStats() {
    document.getElementById('statTotal').textContent     = viewRows.length.toLocaleString('vi-VN');
    document.getElementById('statUsers').textContent     = new Set(viewRows.map(r => r.user_name)).size;
    document.getElementById('statProjects').textContent  = new Set(viewRows.map(r => r.project)).size;
    document.getElementById('statHospitals').textContent = new Set(viewRows.filter(r => r.hospital).map(r => r.hospital)).size;

    const totalSec = viewRows.reduce((s, r) => s + (parseFloat(r.view_seconds) || 0), 0);
    document.getElementById('statDuration').innerHTML = fmtDuration(totalSec);
  }

  function fmtDuration(sec) {
    if (sec >= 3600) return (sec/3600).toFixed(1) + '<small> giờ</small>';
    if (sec >= 60)   return (sec/60).toFixed(1)   + '<small> phút</small>';
    return Math.round(sec) + '<small> giây</small>';
  }

  function renderTable() {
    const tbody = document.getElementById('tbody');
    document.getElementById('rowCount').textContent = viewRows.length.toLocaleString('vi-VN') + ' dòng';

    if (!viewRows.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty">Chưa có dữ liệu tracking nào.</td></tr>';
      return;
    }

    tbody.innerHTML = viewRows.map(r => `
      <tr>
        <td>${r.id}</td>
        <td><span class="tag">${esc(r.project)}</span></td>
        <td class="strong">${esc(r.user_name)}</td>
        <td>${esc(r.hospital || '—')}</td>
        <td style="font-family:monospace;font-size:12px;">${esc(r.ip || '—')}</td>
        <td>${fmtDate(r.started_at)}</td>
        <td>${r.slide ? `<span class="slide-badge">${esc(r.slide)}</span>` : '—'}</td>
        <td>${r.view_seconds != null ? parseFloat(r.view_seconds).toLocaleString('vi-VN') + 's' : '—'}</td>
        <td><button class="btn-del" title="Xóa" onclick="delRow(${r.id})">✕</button></td>
      </tr>
    `).join('');
  }

  function fmtDate(s) {
    if (!s) return '—';
    const d = new Date(s.replace(' ', 'T'));
    if (isNaN(d)) return s;
    return d.toLocaleDateString('vi-VN') + ' ' +
           d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  // ── DELETE ───────────────────────────────────────
  async function delRow(id) {
    if (!confirm('Xóa record #' + id + '?')) return;
    try {
      const res = await fetch(`${API_URL}?id=${id}`, {
        method: 'DELETE',
        headers: { 'X-API-Key': API_SECRET },
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Delete failed');
      allRows = allRows.filter(r => r.id !== id);
      applyFilters();
    } catch (e) { alert('Lỗi: ' + e.message); }
  }

  // ── EXPORT CSV ───────────────────────────────────
  function exportCSV() {
    if (!viewRows.length) { alert('Không có dữ liệu để xuất.'); return; }
    const cols = ['id','project','user_name','hospital','ip','started_at','slide','view_seconds','created_at'];
    const lines = [cols.join(',')].concat(viewRows.map(r =>
      cols.map(c => `"${String(r[c] ?? '').replace(/"/g, '""')}"`).join(',')
    ));
    const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'apsa-tracking-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  // ── UTILS ────────────────────────────────────────
  function esc(s)     { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
  function escAttr(s) { return String(s ?? '').replace(/"/g, '&quot;'); }

  loadData();
</script>
</body>
</html>
