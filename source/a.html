<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#0a0a0a" />
<title>Album ảnh — APSA</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --bg:#0a0a0a; --bg2:#141414; --line:rgba(255,255,255,.10);
  --text:#fff; --text2:rgba(255,255,255,.72); --text3:rgba(255,255,255,.45);
  --accent:#DFF20D; --heart:#ff3b5c;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
html,body{ height:100%; }
body{ background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  overscroll-behavior:none; }
img{ display:block; max-width:100%; }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }

/* ── Thanh trên ── */
.top{ position:fixed; top:0; left:0; right:0; z-index:40; padding:calc(var(--safe-t) + 10px) 14px 10px;
  display:flex; align-items:center; gap:10px;
  background:linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,.35) 60%, transparent);
  transition:opacity .25s, transform .25s; }
.top.hide{ opacity:0; transform:translateY(-8px); pointer-events:none; }
.top .t{ flex:1; min-width:0; }
.top .t b{ display:block; font-size:15px; font-weight:650; letter-spacing:-.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top .t span{ display:block; font-size:11.5px; color:var(--text3); margin-top:1px; }
.iconbtn{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-size:17px;
  background:rgba(255,255,255,.10); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); flex:0 0 auto; }
.iconbtn:active{ transform:scale(.92); }

/* ── Lưới ── */
#grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:calc(var(--safe-t) + 58px) 0 calc(var(--safe-b) + 70px); }
#grid .cell{ position:relative; aspect-ratio:1/1; background:var(--bg2); overflow:hidden; content-visibility:auto; contain-intrinsic-size:120px; }
#grid .cell img{ width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .35s; }
#grid .cell img.on{ opacity:1; }
#grid .cell .hb{ position:absolute; right:5px; bottom:4px; font-size:11px; font-weight:700; color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.7); display:flex; align-items:center; gap:3px; }
#grid .cell.picked::after{ content:'✓'; position:absolute; left:5px; top:4px; width:18px; height:18px; border-radius:50%;
  background:var(--accent); color:#000; font-size:12px; font-weight:800; display:grid; place-items:center; }
@media (min-width:700px){ #grid{ grid-template-columns:repeat(5,1fr); gap:4px; padding-left:4px; padding-right:4px; } }

/* ── Feed toàn màn hình ── */
#feed{ position:fixed; inset:0; z-index:30; background:#000; display:none;
  overflow-y:auto; scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
#feed.on{ display:block; }
.slide{ position:relative; height:100dvh; scroll-snap-align:start; scroll-snap-stop:always;
  display:grid; place-items:center; overflow:hidden; }
.slide .ph{ position:relative; z-index:1; width:100%; height:100%; display:grid; place-items:center; touch-action:manipulation; }
.slide .blur{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:blur(28px) saturate(1.2); opacity:.35; transform:scale(1.15); }
.slide .full{ position:relative; max-width:100%; max-height:100dvh; object-fit:contain; opacity:0; transition:opacity .3s; }
.slide .full.on{ opacity:1; }
.slide .cap{ position:absolute; z-index:5; left:16px; right:78px; bottom:calc(var(--safe-b) + 18px); font-size:13.5px; line-height:1.5;
  color:#fff; text-shadow:0 1px 6px rgba(0,0,0,.75); transition:opacity .25s; }
.rail{ position:absolute; z-index:6; right:10px; bottom:calc(var(--safe-b) + 14px); display:flex; flex-direction:column; gap:11px; align-items:center;
  transition:opacity .25s, transform .25s; }
.rail.hide, .cap.hide{ opacity:0; pointer-events:none; }
.rail .b{ display:flex; flex-direction:column; align-items:center; gap:3px; color:#fff; text-decoration:none; }
.rail .b .ic{ width:46px; height:46px; border-radius:50%; display:grid; place-items:center; font-size:21px;
  background:rgba(0,0,0,.38); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.12);
  transition:transform .18s cubic-bezier(.2,1.6,.4,1), background .18s; }
.rail .b:active .ic{ transform:scale(.88); }
.rail .b .n{ font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.7); min-height:13px; }
.rail .b .ic svg{ display:block; }
.rail .b.like.on .ic{ color:var(--heart); background:rgba(255,59,92,.20); border-color:rgba(255,59,92,.55); }
.rail .b.note.on .ic{ color:#7fd7ff; background:rgba(60,180,255,.18); border-color:rgba(120,215,255,.5); }
.rail .b.pick.on .ic{ color:var(--accent); background:rgba(223,242,13,.20); border-color:rgba(223,242,13,.6); }
.pop{ position:absolute; z-index:7; left:50%; top:50%; transform:translate(-50%,-50%) scale(.2); font-size:110px; opacity:0;
  pointer-events:none; filter:drop-shadow(0 6px 24px rgba(0,0,0,.5)); }
.pop.go{ animation:pop .9s cubic-bezier(.2,1.3,.4,1) forwards; }
@keyframes pop{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(6deg)}
  45%{transform:translate(-50%,-50%) scale(.98) rotate(-2deg)}
  75%{opacity:1} 100%{opacity:0;transform:translate(-50%,-58%) scale(1.05)} }

/* ── Thanh dưới lưới ── */
.bottom{ position:fixed; left:0; right:0; bottom:0; z-index:40; padding:10px 14px calc(var(--safe-b) + 12px);
  display:flex; align-items:center; gap:10px; background:linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,.5) 60%, transparent); }
.bottom .st{ flex:1; font-size:12px; color:var(--text3); }
.bottom .st b{ color:var(--text); font-weight:700; }
.pill{ padding:9px 14px; border-radius:999px; font-size:12.5px; font-weight:700;
  background:rgba(255,255,255,.10); border:1px solid var(--line); }
.pill.go{ background:var(--accent); color:#000; border-color:transparent; }

/* ── Bottom sheet ghi chú ── */
.sheet{ position:fixed; inset:0; z-index:60; display:none; }
.sheet.on{ display:block; }
.sheet .mask{ position:absolute; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(3px); }
.sheet .card{ position:absolute; left:0; right:0; bottom:0; background:var(--bg2); border-radius:20px 20px 0 0;
  padding:18px 16px calc(var(--safe-b) + 16px); border-top:1px solid var(--line);
  animation:up .28s cubic-bezier(.2,.9,.3,1); }
@keyframes up{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
.sheet h3{ font-size:15px; margin-bottom:4px; }
.sheet p{ font-size:12px; color:var(--text3); margin-bottom:12px; }
.sheet input, .sheet textarea{ width:100%; background:#0d0d0d; border:1px solid var(--line); border-radius:12px;
  color:#fff; padding:12px; font:inherit; font-size:15px; margin-bottom:10px; }
.sheet textarea{ min-height:110px; resize:vertical; line-height:1.5; }
.sheet .row{ display:flex; gap:8px; }
.sheet .row button{ flex:1; padding:13px; border-radius:12px; font-weight:700; font-size:14px; }
.sheet .row .ok{ background:var(--accent); color:#000; }
.sheet .row .no{ background:rgba(255,255,255,.10); }

.toast{ position:fixed; left:50%; bottom:calc(var(--safe-b) + 84px); transform:translateX(-50%) translateY(14px);
  background:rgba(20,20,20,.95); border:1px solid var(--line); color:#fff; padding:10px 16px; border-radius:999px;
  font-size:12.5px; font-weight:600; opacity:0; transition:.25s; z-index:80; pointer-events:none; white-space:nowrap; }
.toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

.empty{ display:grid; place-items:center; height:100dvh; text-align:center; padding:30px; }
.empty .e{ font-size:44px; margin-bottom:14px; }
.empty h2{ font-size:17px; margin-bottom:6px; }
.empty p{ font-size:13px; color:var(--text3); line-height:1.6; }
.brand{ position:fixed; bottom:calc(var(--safe-b) + 4px); left:0; right:0; text-align:center; font-size:10px;
  color:rgba(255,255,255,.28); z-index:35; letter-spacing:.5px; pointer-events:none; }
</style>
</head>
<body>

<div class="top" id="top">
  <button class="iconbtn" id="btnBack" onclick="closeFeed()" style="display:none"></button>
  <div class="t"><b id="ttl">Đang tải…</b><span id="sub"></span></div>
  <button class="iconbtn" id="btnGrid" onclick="closeFeed()" title="Xem lưới"></button>
</div>

<div id="grid"></div>

<div id="feed"></div>

<div class="bottom" id="bottom">
  <div class="st" id="stats"></div>
  <button class="pill go" onclick="openFeed(0)">▶ Xem toàn màn hình</button>
</div>

<div class="sheet" id="sheet">
  <div class="mask" onclick="closeSheet()"></div>
  <div class="card">
    <h3>Ghi chú cho ảnh này</h3>
    <p>Chỉ APSA đọc được — dùng để anh/chị dặn cắt cúp, chỉnh màu, hoặc chọn dùng ảnh nào.</p>
    <input type="text" id="gName" placeholder="Tên của bạn (không bắt buộc)" />
    <textarea id="gNote" placeholder="VD: ảnh này crop lại cho gọn, để dùng làm ảnh bìa…"></textarea>
    <div class="row">
      <button class="no" onclick="closeSheet()">Đóng</button>
      <button class="ok" onclick="saveNote()">Gửi ghi chú</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="brand">APSA AGENCY</div>


<script>
const SVG = {
  heart: on => '<svg viewBox="0 0 24 24" width="23" height="23" fill="' + (on ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20.7l-1.4-1.3C5.4 14.7 2 11.6 2 7.9 2 5.1 4.2 3 6.9 3c1.6 0 3.1.7 4.1 1.9L12 5.9l1-1C14 3.7 15.5 3 17.1 3 19.8 3 22 5.1 22 7.9c0 3.7-3.4 6.8-8.6 11.5L12 20.7z"/></svg>',
  note: has => '<svg viewBox="0 0 24 24" width="22" height="22" fill="' + (has ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 9 9 0 01-3.8-.8L3 21l1.9-4.9A8.4 8.4 0 013.6 11 8.4 8.4 0 0112 3h.5a8.4 8.4 0 018 8.5z"/></svg>',
  pick: on => on
    ? '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm5 7.2l-6.1 6.1a1 1 0 01-1.4 0L7 12.8a1 1 0 011.4-1.4l1.8 1.8 5.4-5.4A1 1 0 0117 9.2z"/></svg>'
    : '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-4.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>',
  grid: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="7.2" height="7.2" rx="1.4"/><rect x="13.8" y="3" width="7.2" height="7.2" rx="1.4"/><rect x="3" y="13.8" width="7.2" height="7.2" rx="1.4"/><rect x="13.8" y="13.8" width="7.2" height="7.2" rx="1.4"/></svg>',
  back: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>'
};
</script>
<script>
const API = './api/album-api.php';
const K   = new URLSearchParams(location.search).get('k') || '';
let PHOTOS = [], ALBUM = null, CUR = 0, noteFor = 0, uiHidden = false;

/* mã thiết bị — để mỗi máy chỉ thả 1 tim/ảnh */
const V = (() => {
  let v = '';
  try { v = localStorage.getItem('apsa_album_v') || ''; } catch(e){}
  if (!v) {
    v = 'v' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-5);
    try { localStorage.setItem('apsa_album_v', v); } catch(e){}
  }
  return v;
})();
let GUEST = '';
try { GUEST = localStorage.getItem('apsa_album_name') || ''; } catch(e){}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tmr = null;
function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('on');
  clearTimeout(tmr); tmr = setTimeout(() => t.classList.remove('on'), 1900);
}
async function api(action, body, query){
  const r = await fetch(API + '?action=' + action + (query || ''), {
    method: body ? 'POST' : 'GET',
    headers: body ? {'Content-Type':'application/json'} : undefined,
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Lỗi');
  return j.data;
}

/* ══════════ TẢI ALBUM ══════════ */
async function boot(){
  if (!K) return fail('Thiếu mã album', 'Link không hợp lệ — nhờ APSA gửi lại giúp bạn nhé.');
  try {
    const d = await api('view', null, '&k=' + encodeURIComponent(K) + '&v=' + V);
    ALBUM = d.album; PHOTOS = d.photos || [];
    document.title = ALBUM.title + ' — APSA';
    document.getElementById('ttl').textContent = ALBUM.title;
    if (!PHOTOS.length) return fail('Album chưa có ảnh', 'APSA đang chuẩn bị, bạn quay lại sau ít phút nhé.');
    renderGrid(); renderStats();
  } catch(e){ fail('Không mở được album', e.message); }
}
function fail(h, p){
  document.getElementById('grid').innerHTML =
    '<div class="empty" style="grid-column:1/-1"><div class="e">📷</div><h2>' + esc(h) + '</h2><p>' + esc(p) + '</p></div>';
  document.getElementById('bottom').style.display = 'none';
  document.getElementById('ttl').textContent = 'Album ảnh';
}

/* ══════════ LƯỚI ══════════ */
function renderGrid(){
  const g = document.getElementById('grid');
  g.innerHTML = PHOTOS.map((p, i) =>
    '<div class="cell' + (p.picked ? ' picked' : '') + '" id="c' + p.id + '" onclick="openFeed(' + i + ')">' +
      '<img data-src="' + esc(p.thumb) + '" alt="" decoding="async" />' +
      (p.likes ? '<span class="hb">❤ ' + p.likes + '</span>' : '') +
    '</div>').join('');
  const io = new IntersectionObserver((es, ob) => {
    es.forEach(e => {
      if (!e.isIntersecting) return;
      const img = e.target;
      img.src = img.dataset.src;
      img.onload = () => img.classList.add('on');
      ob.unobserve(img);
    });
  }, { rootMargin: '400px' });
  g.querySelectorAll('img').forEach(i => io.observe(i));
}
function renderStats(){
  const liked = PHOTOS.filter(p => p.liked).length;
  const picked = PHOTOS.filter(p => p.picked).length;
  document.getElementById('stats').innerHTML =
    '<b>' + PHOTOS.length + '</b> ảnh' + (liked ? ' · ❤ <b>' + liked + '</b>' : '') + (picked ? ' · ✓ <b>' + picked + '</b> đã chọn' : '');
  document.getElementById('sub').textContent = PHOTOS.length + ' ảnh · chạm để xem lớn';
}

/* ══════════ FEED ══════════ */
function slideHtml(p, i){
  return '<div class="slide" data-i="' + i + '" data-id="' + p.id + '">' +
    '<div class="ph" ondblclick="dbl(' + i + ')">' +
      '<img class="blur" data-src="' + esc(p.thumb) + '" alt="" />' +
      '<img class="full" data-src="' + esc(p.url) + '" data-thumb="' + esc(p.thumb) + '" alt="' + esc(p.caption || '') + '" decoding="async" />' +
      '<div class="pop" id="pop' + i + '">❤️</div>' +
    '</div>' +
    (p.caption ? '<div class="cap">' + esc(p.caption) + '</div>' : '') +
    '<div class="rail">' +
      '<button class="b like' + (p.liked ? ' on' : '') + '" onclick="like(' + i + ')"><span class="ic">' + SVG.heart(p.liked) + '</span><span class="n">' + (p.likes || '') + '</span></button>' +
      '<button class="b note' + (p.my_note ? ' on' : '') + '" onclick="openSheet(' + i + ')"><span class="ic">' + SVG.note(!!p.my_note) + '</span><span class="n"></span></button>' +
      '<button class="b pick' + (p.picked ? ' on' : '') + '" onclick="pick(' + i + ')"><span class="ic">' + SVG.pick(p.picked) + '</span><span class="n"></span></button>' +
      '<a class="b dl" href="' + esc(p.url) + '" download onclick="event.stopPropagation()"><span class="ic">' + SVG.down + '</span><span class="n"></span></a>' +
    '</div></div>';
}

let feedIO = null;
function openFeed(i){
  const f = document.getElementById('feed');
  f.innerHTML = PHOTOS.map(slideHtml).join('');
  f.classList.add('on');
  document.getElementById('grid').style.display = 'none';
  document.getElementById('bottom').style.display = 'none';
  document.getElementById('btnBack').style.display = '';
  document.getElementById('btnGrid').textContent = '▦';
  document.body.style.overflow = 'hidden';

  const slides = [...f.querySelectorAll('.slide')];
  if (feedIO) feedIO.disconnect();
  feedIO = new IntersectionObserver(es => {
    es.forEach(e => {
      if (e.intersectionRatio > .6) { CUR = +e.target.dataset.i; onCur(); }
    });
  }, { root: f, threshold: [.61] });
  slides.forEach(s => feedIO.observe(s));

  f.scrollTo({ top: i * f.clientHeight, behavior: 'instant' });
  CUR = i; onCur(); loadAround(i);
}
function closeFeed(){
  const f = document.getElementById('feed');
  if (!f.classList.contains('on')) return;
  f.classList.remove('on'); f.innerHTML = '';
  document.getElementById('grid').style.display = '';
  document.getElementById('bottom').style.display = '';
  document.getElementById('btnBack').style.display = 'none';
  document.body.style.overflow = '';
  renderGrid(); renderStats();
}
function onCur(){
  document.getElementById('sub').textContent = (CUR + 1) + ' / ' + PHOTOS.length;
  loadAround(CUR);
}
function loadAround(i){
  const f = document.getElementById('feed');
  for (let k = i - 1; k <= i + 2; k++) {
    const s = f.querySelector('.slide[data-i="' + k + '"]');
    if (!s) continue;
    s.querySelectorAll('img[data-src]').forEach(img => {
      img.src = img.dataset.src;
      img.removeAttribute('data-src');
      if (img.classList.contains('full')) img.onload = () => img.classList.add('on');
    });
  }
}

/* ══════════ TIM / CHỌN / GHI CHÚ ══════════ */
let lastTap = 0;
function dbl(i){ if (!PHOTOS[i].liked) like(i, true); else popHeart(i); }
function popHeart(i){
  const el = document.getElementById('pop' + i);
  if (!el) return;
  el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
  if (navigator.vibrate) navigator.vibrate(12);
}
async function like(i, forceOn){
  const p = PHOTOS[i];
  if (forceOn && p.liked) return;
  const was = p.liked;
  p.liked = !was; p.likes = Math.max(0, (p.likes || 0) + (was ? -1 : 1));
  paintSlide(i);
  if (p.liked) popHeart(i);
  try {
    const d = await api('like', { k: K, v: V, photo_id: p.id });
    p.liked = d.on; p.likes = d.count; paintSlide(i);
  } catch(e){ p.liked = was; p.likes = Math.max(0, (p.likes || 0) + (was ? 1 : -1)); paintSlide(i); toast('Không lưu được, thử lại nhé'); }
}
async function pick(i){
  const p = PHOTOS[i];
  const was = p.picked;
  p.picked = !was; paintSlide(i);
  try {
    const d = await api('pick', { k: K, v: V, photo_id: p.id });
    p.picked = d.on; paintSlide(i);
    toast(d.on ? '✓ Đã chọn ảnh này' : 'Đã bỏ chọn');
  } catch(e){ p.picked = was; paintSlide(i); toast('Không lưu được, thử lại nhé'); }
}
function paintSlide(i){
  const s = document.querySelector('.slide[data-i="' + i + '"]');
  if (!s) return;
  const p = PHOTOS[i];
  const lb = s.querySelector('.b.like');
  lb.classList.toggle('on', !!p.liked);
  lb.querySelector('.ic').innerHTML = SVG.heart(p.liked);
  lb.querySelector('.n').textContent = p.likes || '';
  const pb = s.querySelector('.b.pick');
  pb.classList.toggle('on', !!p.picked);
  pb.querySelector('.ic').innerHTML = SVG.pick(p.picked);
  const nb = s.querySelector('.b.note');
  nb.classList.toggle('on', !!p.my_note);
  nb.querySelector('.ic').innerHTML = SVG.note(!!p.my_note);
}
function openSheet(i){
  noteFor = i;
  document.getElementById('gName').value = GUEST;
  document.getElementById('gNote').value = PHOTOS[i].my_note || '';
  document.getElementById('sheet').classList.add('on');
  setTimeout(() => document.getElementById('gNote').focus(), 120);
}
function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
async function saveNote(){
  const p = PHOTOS[noteFor];
  const note = document.getElementById('gNote').value.trim();
  const name = document.getElementById('gName').value.trim();
  GUEST = name;
  try { localStorage.setItem('apsa_album_name', name); } catch(e){}
  closeSheet();
  try {
    const d = await api('note', { k: K, v: V, photo_id: p.id, note: note, name: name });
    p.my_note = d.note; paintSlide(noteFor);
    toast(note ? '💬 Đã gửi ghi chú' : 'Đã xoá ghi chú');
  } catch(e){ toast('Không gửi được, thử lại nhé'); }
}

/* chạm 1 lần để ẩn/hiện nút — xem ảnh cho thoáng */
document.getElementById('feed').addEventListener('click', e => {
  if (!e.target.closest('.ph')) return;   /* chỉ vùng ảnh mới ẩn/hiện nút */
  const now = Date.now();
  if (now - lastTap < 320) { lastTap = 0; return; }   // để dành cho double-tap
  lastTap = now;
  setTimeout(() => {
    if (Date.now() - lastTap < 300) return;
    uiHidden = !uiHidden;
    document.getElementById('top').classList.toggle('hide', uiHidden);
    document.querySelectorAll('.rail, .cap').forEach(el => el.classList.toggle('hide', uiHidden));
  }, 330);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); closeFeed(); }
});

document.getElementById('btnBack').innerHTML = SVG.back;
document.getElementById('btnGrid').innerHTML = SVG.grid;
boot();
</script>
</body>
</html>
