<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive" />
<title>APSA — Tiến độ dự án</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
  :root {
    --ink: #12151a; --ink2: #4a5361; --ink3: #8a93a3; --line: #e6e9ef;
    --line2: #f2f4f8; --bg: #f4f6fa; --card: #ffffff;
    --accent: #1d4ed8; --ok: #15803d; --ok-bg: #eafaf0;
    --run: #1d4ed8; --run-bg: #eaf0ff; --rev: #b45309; --rev-bg: #fdf3e3;
    --wait: #6b7280; --wait-bg: #f1f3f7; --late: #b91c1c; --late-bg: #fdeced;
  }
  body { font-family: 'Oxanium', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
  /* APSA1938: dung tron be ngang man hinh, toi uu cho laptop */
  .wrap { max-width: none; margin: 0 auto; padding: 24px 28px 48px }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px }
  .brand b { font-size: 15px; font-weight: 800; letter-spacing: .14em }
  .brand span { font-size: 11px; color: var(--ink3); letter-spacing: .06em; text-transform: uppercase }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 1px 3px rgba(16,24,40,.04); }
  /* APSA1943: key visual lam nen, phu trang mo de de doc */
  body.kvbg::before { content:''; position:fixed; inset:-40px; z-index:-2;
    background-image:var(--kv); background-size:cover; background-position:center;
    filter:blur(26px) saturate(1.15); }
  body.kvbg::after { content:''; position:fixed; inset:0; z-index:-1;
    background:rgba(244,246,250,.86); }
  body.kvbg .card { background:rgba(255,255,255,.93); backdrop-filter:blur(6px);
    box-shadow:0 6px 28px rgba(16,24,40,.10) }
  body.kvbg .cal .cell.out { background:rgba(251,252,254,.7) }
  body.kvbg .nodue { background:rgba(251,252,254,.75) }
  body.kvbg .brand b, body.kvbg .brand span { text-shadow:0 1px 2px rgba(255,255,255,.7) }
  .head { padding: 22px 22px 20px }
  .code { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--accent);
    text-transform: uppercase }
  h1 { font-size: 21px; font-weight: 800; line-height: 1.3; margin: 6px 0 10px }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--ink2) }
  .meta i { font-style: normal; color: var(--ink3) }
  .prog { display: flex; align-items: center; gap: 18px; padding: 18px 22px;
    border-top: 1px solid var(--line2); flex-wrap: wrap }
  .pct { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.02em }
  .pbar { flex: 1 1 200px; height: 9px; border-radius: 99px; background: var(--line2); overflow: hidden }
  .pbar i { display: block; height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, #22c55e, #16a34a); transition: width .5s ease }
  .cnt { font-size: 12.5px; color: var(--ink2); white-space: nowrap }
  .cnt b { color: var(--ink); font-weight: 700 }
  table { width: 100%; border-collapse: collapse }
  thead th { text-align: left; font-size: 10.5px; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink3); padding: 12px 22px;
    border-top: 1px solid var(--line2); border-bottom: 1px solid var(--line2); white-space: nowrap }
  thead th.c2 { width: 150px } thead th.c3 { width: 110px }
  tbody td { padding: 13px 22px; border-bottom: 1px solid var(--line2); font-size: 13.5px;
    vertical-align: middle }
  tbody tr:last-child td { border-bottom: 0 }
  tbody tr.grp td { background: #fafbfd; font-size: 10.5px; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink3); padding: 10px 22px }
  .nm { font-weight: 500; line-height: 1.45 }
  tr.done .nm { color: var(--ink2) }
  .pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 4px 10px;
    border-radius: 999px; white-space: nowrap }
  .p-done { color: var(--ok); background: var(--ok-bg) }
  .p-doing { color: var(--run); background: var(--run-bg) }
  .p-review { color: var(--rev); background: var(--rev-bg) }
  .p-todo { color: var(--wait); background: var(--wait-bg) }
  .p-cwait { color: var(--rev); background: var(--rev-bg) }
  .due { font-size: 12.5px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums }
  .due.late { color: var(--late); font-weight: 700 }
  .due.non { color: var(--ink3) }
  .foot { margin-top: 16px; text-align: center; font-size: 11.5px; color: var(--ink3); line-height: 1.7 }
  .state { padding: 60px 22px; text-align: center; color: var(--ink2); font-size: 14px }
  .state b { display: block; font-size: 16px; color: var(--ink); margin-bottom: 6px }
  .tabs { display:flex; gap:6px; padding:0 22px 16px; flex-wrap:wrap; align-items:center }
  .tlb { font-size:12px; font-weight:500; color:var(--ink2); margin-right:4px }
  .tab { font-family:inherit; font-size:12px; font-weight:700; padding:7px 14px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink2);
    border-radius:999px; transition:all .15s ease }
  .tab:hover { color:var(--ink); border-color:var(--ink3) }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink) }
  .navm { display:flex; align-items:center; gap:8px; margin-left:auto }
  .navm button { font-family:inherit; font-size:13px; width:28px; height:28px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--ink2); border-radius:8px }
  .navm button:hover { color:var(--ink); border-color:var(--ink3) }
  .navm b { font-size:12.5px; font-weight:700; min-width:118px; text-align:center }
  .chip { display:block; font-size:11.5px; line-height:1.35; padding:5px 8px; border-radius:7px;
    margin-bottom:5px; border-left:3px solid; background:var(--line2); color:var(--ink);
    word-break:break-word }
  .chip.s-done { border-color:var(--ok); background:var(--ok-bg) }
  .chip.s-doing { border-color:var(--run); background:var(--run-bg) }
  .chip.s-review { border-color:var(--rev); background:var(--rev-bg) }
  .chip.s-cwait { border-color:var(--rev); background:var(--rev-bg) }
  .chip.s-todo { border-color:var(--ink3); background:var(--wait-bg) }
  .chip.late { box-shadow:inset 0 0 0 1px rgba(185,28,28,.35) }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); border-top:1px solid var(--line2) }
  .cal .dh { font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink3); padding:9px 8px; text-align:center; border-bottom:1px solid var(--line2) }
  .cal .cell { min-height:max(104px, calc((100vh - 430px) / 6)); padding:7px 7px 4px;
    border-right:1px solid var(--line2);
    border-bottom:1px solid var(--line2) }
  .cal .cell:nth-child(7n) { border-right:0 }
  .cal .cell.out { background:#fbfcfe }
  .cal .cell.today { background:#fffdf0; box-shadow:inset 0 0 0 2px rgba(29,78,216,.25) }
  .cal .dn { font-size:11px; font-weight:700; color:var(--ink3); margin-bottom:6px }
  .cal .cell.today .dn { color:var(--accent) }
  .cal .cell.out .dn { opacity:.4 }
  .tlwrap { display:flex; border-top:1px solid var(--line2); overflow:hidden }
  .nodue { flex:0 0 220px; border-right:1px solid var(--line); padding:10px 14px;
    background:#fbfcfe; max-height:min(64vh,720px); overflow:auto }
  .nodue h4 { font-size:10px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    color:var(--ink3); margin-bottom:8px }
  .tl { flex:1 1 auto; display:flex; overflow-x:auto; scroll-behavior:smooth;
    max-height:min(64vh,720px) }
  .tlcol { flex:0 0 152px; border-right:1px solid var(--line2); padding:0 8px 8px }
  .tlcol.today { background:#fffdf0 }
  .tlcol .th { position:sticky; top:0; background:inherit; padding:9px 0 8px; font-size:10.5px;
    font-weight:700; color:var(--ink3); text-align:center; border-bottom:1px solid var(--line2);
    margin-bottom:8px; line-height:1.4 }
  .tlcol.today .th { color:var(--accent) }
  .tlcol .th i { display:block; font-style:normal; font-size:13px; font-weight:800; color:var(--ink) }
  .tlcol.today .th i { color:var(--accent) }
  .tlcol.wk { background:#fafbfd }
  .empt { font-size:11.5px; color:var(--ink3); padding:4px 0 }
  @media (max-width: 620px) {
    .wrap { padding: 18px 12px 40px }
    .nodue { flex:0 0 150px }
    .head, .prog { padding-left: 16px; padding-right: 16px }
    h1 { font-size: 18px }
    thead th { display: none }
    tbody td { display: block; padding: 0 16px; border: 0 }
    tbody tr { display: block; border-bottom: 1px solid var(--line2); padding: 12px 0 }
    tbody tr:last-child { border-bottom: 0 }
    tbody tr.grp td { padding: 10px 16px }
    td.c1 { margin-bottom: 8px }
    td.c2 { display: inline-block !important; padding-right: 8px }
    td.c3 { display: inline-block !important; padding-left: 0 }
  }
    /* APSA1946/1947: nen rieng tung nhom, dong/mo nhom, viec con, ngay su kien */
    tbody tr.g0{ --gt:#eef2ff; --gb:#c7d2fe }
    tbody tr.g1{ --gt:#f5f3ff; --gb:#ddd6fe }
    tbody tr.g2{ --gt:#fff7ed; --gb:#fed7aa }
    tbody tr.g3{ --gt:#fdf2f8; --gb:#fbcfe8 }
    tbody tr.g4{ --gt:#ecfeff; --gb:#a5f3fc }
    tbody tr.g5{ --gt:#fefce8; --gb:#fde68a }
    tbody tr.grp td{ background:var(--gt, #f7f9fc); cursor:pointer;
      -webkit-user-select:none; user-select:none }
    tbody tr.grp:hover td{ filter:brightness(.97) }
    tbody tr.grp.cl .car{ transform:rotate(0deg) }
    tbody tr.grp .car{ display:inline-block; width:0; height:0; margin-right:11px;
      vertical-align:middle; border-top:5px solid transparent; border-bottom:5px solid transparent;
      border-left:6px solid currentColor; transform:rotate(90deg); transition:transform .15s ease;
      font-size:9px;
      color:var(--ink3); opacity:.45 }
    tbody tr.grp .gct{ float:right; font-size:10.5px; font-weight:700;
      color:var(--ink3); letter-spacing:0 }
    tbody tr td.c1{ box-shadow:inset 3px 0 0 var(--gb, transparent) }
    tbody tr.sub td.c1 .nm{ padding-left:20px; font-size:12.5px; color:var(--ink2) }
    tbody tr.sub td.c1 .nm .sb{ margin-left:-16px; margin-right:5px; opacity:.5 }
    .chip.sub{ font-size:10.5px; opacity:.92 }
    .cal .cell.ev{ background:rgba(225,29,72,.07); border-color:rgba(225,29,72,.38) }
    .cal .cell.ev .dn{ color:#e11d48; font-weight:800 }
    .cal .cell.ev .dn::after{ content:' ● SỰ KIỆN'; font-size:8.5px;
      letter-spacing:.08em; font-weight:800 }
    .tl .tlcol.ev{ background:rgba(225,29,72,.06) }
    .tl .tlcol.ev .th{ color:#e11d48; background:rgba(225,29,72,.11) }
    .tl .tlcol.ev .th i{ color:#e11d48; opacity:1 }

    /* APSA1948: dong xong nen xanh, % theo nhom va theo task cha */
    tbody tr.done td{ background:#e4f6ec }
    tbody tr.done td.c1 .nm{ font-weight:600 }
    tbody tr.grp .gct{ display:flex; align-items:center; gap:8px }
    tbody tr.grp .gct em, .spg em{ font-style:normal; color:var(--ink3); font-weight:600 }
    tbody tr.grp .gbar, .spg .sbar{ display:inline-block; height:5px; border-radius:99px;
      background:rgba(16,24,40,.13); overflow:hidden }
    tbody tr.grp .gbar{ width:70px }
    .spg .sbar{ width:54px }
    tbody tr.grp .gbar i, .spg .sbar i{ display:block; height:100%;
      background:var(--ok); border-radius:99px; transition:width .2s ease }
    .spg{ display:inline-flex; align-items:center; gap:6px; margin-left:12px; vertical-align:middle }
    .spg b{ font-size:10.5px; font-weight:800; color:var(--ok) }
    .spg em{ font-size:10px }

    /* APSA1949: icon uu tien do + dem nguoc han */
    .pri{ width:13px; height:13px; fill:#e11d48 }
    .prw{ display:inline-flex; align-items:center; margin-right:6px; vertical-align:-2px }
    .chip .prw{ margin-right:4px; vertical-align:-1px }
    .chip .pri{ width:11px; height:11px }
    tbody tr.sub .pri{ width:11.5px; height:11.5px }
    .dsub{ display:block; font-style:normal; font-size:10.5px; font-weight:700;
      color:var(--ink3); margin-top:3px; white-space:nowrap; letter-spacing:.01em }
    .dsub.soon{ color:#d97706 }
    .dsub.over{ color:var(--late, #e11d48) }
    tbody tr.done .dsub{ display:none }


    /* ===== APSA1958: gon dau trang + toi uu cho dien thoai ===== */
    .prog{ flex-wrap:wrap; row-gap:12px }
    .cnt{ display:flex; flex-wrap:wrap; gap:6px; white-space:normal; font-size:12px }
    .kchip{ display:inline-flex; align-items:center; gap:6px; padding:4px 11px 4px 9px;
      border:1px solid var(--line2); border-radius:999px; background:var(--card); line-height:1.35 }
    .kchip::before{ content:''; width:7px; height:7px; border-radius:50%; flex:0 0 7px }
    .kchip b{ font-weight:800; color:var(--ink) }
    .k-done::before { background:#22c55e }
    .k-doing::before{ background:#3b82f6 }
    .k-wait::before { background:#f59e0b }
    .k-todo::before { background:#9aa3af }
    .seg{ display:inline-flex; align-items:center; gap:2px; padding:3px;
      border:1px solid var(--line); border-radius:999px; background:var(--card) }
    .seg .tab{ border:0; background:transparent; border-radius:999px; padding:6px 14px;
      display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:700;
      color:var(--ink2); cursor:pointer; transition:background .15s ease, color .15s ease }
    .seg .tab svg{ width:15px; height:15px; flex:0 0 15px; display:block }
    .seg .tab:hover{ color:var(--ink); background:var(--line2) }
    .seg .tab.on, .seg .tab.on:hover{ background:var(--ink); color:#fff }
    @media (max-width: 620px) {
      .prog{ gap:12px; padding-top:14px; padding-bottom:14px }
      .pct{ font-size:26px }
      .cnt{ width:100%; font-size:11.5px }
      .kchip{ padding:3px 9px 3px 8px }
      .tabs{ padding:0 16px 14px }
      .seg{ display:flex; width:100% }
      .seg .tab{ flex:1 1 0; justify-content:center; padding:8px 4px; gap:5px; font-size:11.5px }
      .seg .tab svg{ width:14px; height:14px; flex:0 0 14px }
    }
  
    /* APSA1958b: tren dien thoai gom moi dong thanh 1 the, nen mau phu kin dong */
    @media (max-width: 620px) {
      tbody tr{ display:block; padding:11px 16px 12px; border-bottom:1px solid var(--line2);
        box-shadow:inset 3px 0 0 var(--gb, transparent) }
      tbody tr:last-child{ border-bottom:0 }
      tbody td{ display:block; padding:0 !important; border:0 !important;
        background:transparent !important; box-shadow:none !important }
      tbody tr.done{ background:#e4f6ec }
      tbody tr.grp{ padding:10px 16px; background:var(--gt, #f7f9fc); box-shadow:none;
        border-bottom:1px solid var(--line2) }
      tbody tr.grp td{ padding:0 !important }
      tbody td.c1{ margin-bottom:7px; font-size:13.5px; line-height:1.4 }
      tbody tr.grp td.c1{ margin-bottom:0 }
      tbody td.c2, tbody td.c3{ display:inline-block !important; vertical-align:middle }
      tbody td.c2{ padding-right:10px !important }
      tbody tr.grp .gbar{ width:52px }
      .dsub{ display:block; margin-top:2px }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>APSA</b><span>Tiến độ dự án</span></div>
  <div class="card" id="app"><div class="state">Đang tải…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
/* APSA1935/1937 — trang cong khai: chi doc checklist theo token */
var API = '/api/quotation-api.php';
var TOKEN = (function () {
  var m = location.search.match(/[?&]t=([A-Za-z0-9]{6,64})/);
  if (m) return m[1];
  m = location.pathname.match(/\/ck\/([A-Za-z0-9]{6,64})/);
  return m ? m[1] : '';
})();
var LB = { done: 'Đã hoàn thành', doing: 'Đang làm', review: 'Đang review',
  cwait: 'Chờ khách gửi thêm thông tin', todo: 'Chưa giao' };
var D = null, VIEW = 'list', CUR = null;
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function el(i) { return document.getElementById(i); }
function iso(d) {
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function mkd(s) { var a = String(s).slice(0, 10).split('-'); return new Date(+a[0], +a[1] - 1, +a[2]); }
function dmy(s) {
  if (!s) return '';
  var m = String(s).slice(0, 10).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? (m[3] + '/' + m[2] + '/' + m[1]) : '';
}
var TODAY = iso(new Date());
function st9(r) { return LB[r.status] ? r.status : 'todo'; }
function isLate(r) { var d = String(r.due || '').slice(0, 10); return !!d && st9(r) !== 'done' && d < TODAY; }
function items() { return (D.rows || []).filter(function (r) { return r.kind !== 'group'; }); }
function chip(r) {
  var sb = (r.kind === 'sub');
  return '<span class="chip s-' + st9(r) + (isLate(r) ? ' late' : '') + (sb ? ' sub' : '') + '" title="'
    + esc(r.name) + ' — ' + LB[st9(r)] + '">' + (sb ? '↳ ' : '') + pflag(r) + esc(r.name) + '</span>';
}
function fail(msg) {
  el('app').innerHTML = '<div class="state"><b>Không mở được trang</b>' + esc(msg) + '</div>';
}
function setView(v) {
  VIEW = v;
  try { localStorage.setItem('apsa_ck_view', v); } catch (e) {}
  paint();
}
function shiftM(n) {
  CUR = new Date(CUR.getFullYear(), CUR.getMonth() + n, 1);
  paint();
}
var COLL = {};
function tgGrp(k) { COLL[k] = !COLL[k]; paint(); }
/* APSA1947: ngay dien ra su kien */
function isEv(k) {
  var f = String((D && D.from) || '').slice(0, 10);
  var t = String((D && D.to) || '').slice(0, 10) || f;
  return !!f && k >= f && k <= t;
}
var PFI = '<svg class="pri" viewBox="0 0 24 24" aria-hidden="true">'
  + '<path d="M4.6 22a1.1 1.1 0 0 1-1.1-1.1V3.1a1.1 1.1 0 1 1 2.2 0v17.8A1.1 1.1 0 0 1 4.6 22Z"/>'
  + '<path d="M7 3.6h11.6a.9.9 0 0 1 .73 1.43L17.1 8.2l2.23 3.17a.9.9 0 0 1-.73 1.43H7Z"/></svg>';
function pflag(r) {
  var p = Number(r.prio) || 0;
  if (p < 2) return '';
  return '<span class="prw" title="' + (p >= 3 ? 'Ưu tiên: Khẩn' : 'Ưu tiên: Quan trọng') + '">' + PFI + '</span>';
}
/* APSA1949: con bao nhieu ngay toi han */
function dleft(r) {
  var d = String(r.due || '').slice(0, 10);
  if (!d || st9(r) === 'done') return '';
  var a = mkd(d), b = mkd(TODAY);
  if (!a || !b) return '';
  var n = Math.round((a.getTime() - b.getTime()) / 86400000);
  if (n < 0) return '<em class="dsub over">Quá hạn ' + (-n) + ' ngày</em>';
  if (n === 0) return '<em class="dsub over">Hôm nay</em>';
  return '<em class="dsub' + (n <= 3 ? ' soon' : '') + '">Còn ' + n + ' ngày</em>';
}
function w9(r) {
  var x = st9(r);
  return x === 'done' ? 100 : (x === 'review' ? 75 : ((x === 'doing' || x === 'cwait') ? 40 : 0));
}
function vList() {
  var rows = D.rows || [], body = '', gi = -1, hid = false, i, j;
  for (i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (r.kind === 'group') {
      if (!String(r.name || '').trim()) { gi = -1; hid = false; continue; }
      gi++;
      var tot = 0, dne = 0, wsum = 0;
      for (j = i + 1; j < rows.length && rows[j].kind !== 'group'; j++) {
        tot++; wsum += w9(rows[j]); if (st9(rows[j]) === 'done') dne++;
      }
      var gp = tot ? Math.round(wsum / tot) : 0;
      hid = !!COLL[gi];
      body += '<tr class="grp g' + (gi % 6) + (hid ? ' cl' : '') + '" onclick="tgGrp(' + gi + ')">'
        + '<td colspan="3"><span class="car"></span>' + esc(r.name)
        + '<span class="gct"><span class="gbar"><i style="width:' + gp + '%"></i></span>'
        + '<b>' + gp + '%</b><em>' + dne + '/' + tot + '</em></span></td></tr>';
      continue;
    }
    if (hid) continue;
    var st = st9(r), due = dmy(r.due), late = isLate(r), extra = '';
    if (r.kind === 'item') {
      var sn = 0, sd = 0, sw = 0;
      for (j = i + 1; j < rows.length && rows[j].kind === 'sub'; j++) {
        sn++; sw += w9(rows[j]); if (st9(rows[j]) === 'done') sd++;
      }
      if (sn) {
        var sp = Math.round(sw / sn);
        extra = '<span class="spg" title="' + sd + '/' + sn + ' việc con đã xong">'
          + '<span class="sbar"><i style="width:' + sp + '%"></i></span>'
          + '<b>' + sp + '%</b><em>' + sd + '/' + sn + '</em></span>';
      }
    }
    body += '<tr class="g' + (gi < 0 ? 0 : gi % 6) + (st === 'done' ? ' done' : '')
        + (r.kind === 'sub' ? ' sub' : '') + '">'
      + '<td class="c1"><div class="nm">'
      + (r.kind === 'sub' ? '<span class="sb">↳</span>' : '')
      + pflag(r) + esc(r.name || '—') + extra + '</div></td>'
      + '<td class="c2"><span class="pill p-' + st + '">' + LB[st] + '</span></td>'
      + '<td class="c3"><span class="due ' + (late ? 'late' : (due ? '' : 'non')) + '">'
      + (due ? esc(due) : '—') + '</span>' + dleft(r) + '</td></tr>';
  }
  if (!body) body = '<tr><td colspan="3" class="empt">Chưa có đầu việc nào.</td></tr>';
  return '<table><thead><tr><th>Công việc</th><th class="c2">Trạng thái</th>'
    + '<th class="c3">Hạn</th></tr></thead><tbody>' + body + '</tbody></table>';
}
function vCal() {
  var its = items(), byDay = {}, i, d;
  for (i = 0; i < its.length; i++) {
    d = String(its[i].due || '').slice(0, 10);
    if (!d) continue;
    (byDay[d] = byDay[d] || []).push(its[i]);
  }
  var y = CUR.getFullYear(), m = CUR.getMonth();
  var first = new Date(y, m, 1), start = new Date(y, m, 1);
  start.setDate(1 - ((first.getDay() + 6) % 7));
  var h = '<div class="cal">';
  var dn = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
  for (i = 0; i < 7; i++) h += '<div class="dh">' + dn[i] + '</div>';
  for (i = 0; i < 42; i++) {
    var cur = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    var k = iso(cur), out = cur.getMonth() !== m;
    if (i >= 35 && out) break;
    h += '<div class="cell' + (out ? ' out' : '') + (k === TODAY ? ' today' : '') + (isEv(k) ? ' ev' : '') + '">'
      + '<div class="dn">' + cur.getDate() + '</div>';
    var list = byDay[k] || [];
    for (var j = 0; j < list.length; j++) h += chip(list[j]);
    h += '</div>';
  }
  return h + '</div>';
}
function vTl() {
  var its = items(), withd = [], nod = [], i;
  for (i = 0; i < its.length; i++) {
    if (String(its[i].due || '').slice(0, 10)) withd.push(its[i]); else nod.push(its[i]);
  }
  var h = '<div class="tlwrap"><div class="nodue"><h4>Chưa có hạn</h4>';
  if (!nod.length) h += '<div class="empt">Không có</div>';
  for (i = 0; i < nod.length; i++) h += chip(nod[i]);
  h += '</div><div class="tl" id="tlScroll">';
  if (!withd.length) {
    h += '<div class="empt" style="padding:20px">Chưa có đầu việc nào đặt hạn.</div>';
    return h + '</div></div>';
  }
  var ds = withd.map(function (r) { return String(r.due).slice(0, 10); }).sort();
  var a = mkd(ds[0]), b = mkd(ds[ds.length - 1]), t = mkd(TODAY);
  if (t < a) a = t;
  if (t > b) b = t;
    /* APSA1947: keo dai timeline de luon thay ngay su kien */
    var _ef = String(D.from || '').slice(0, 10), _et = String(D.to || '').slice(0, 10) || _ef;
    if (_ef) { var _ea = mkd(_ef), _eb = mkd(_et);
      if (_ea && _ea < a) a = _ea; if (_eb && _eb > b) b = _eb; }
  a = new Date(a.getFullYear(), a.getMonth(), a.getDate() - 2);
  b = new Date(b.getFullYear(), b.getMonth(), b.getDate() + 2);
  var dn = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
  var mo = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];
  var guard = 0;
  for (var c = a; c <= b && guard < 400; c = new Date(c.getFullYear(), c.getMonth(), c.getDate() + 1)) {
    guard++;
    var k = iso(c), wk = (c.getDay() === 0 || c.getDay() === 6);
    h += '<div class="tlcol' + (k === TODAY ? ' today' : (wk ? ' wk' : '')) + (isEv(k) ? ' ev' : '') + '"'
      + (k === TODAY ? ' id="tlToday"' : '') + '><div class="th">' + dn[c.getDay()]
      + '<i>' + c.getDate() + '/' + mo[c.getMonth()] + '</i></div>';
    var any = 0;
    for (i = 0; i < withd.length; i++) {
      if (String(withd[i].due).slice(0, 10) === k) { h += chip(withd[i]); any++; }
    }
    h += '</div>';
  }
  return h + '</div></div>';
}
function paint() {
  var d = D;
  if (d.thumb) {
    document.body.style.setProperty('--kv', 'url("' + String(d.thumb).replace(/"/g, '') + '")');
    document.body.classList.add('kvbg');
  } else { document.body.classList.remove('kvbg'); }
  var h = '<div class="head"><div class="code">' + esc(d.code || '') + '</div>'
    + '<h1>' + esc(d.title || 'Dự án') + '</h1><div class="meta">';
  if (d.client) h += '<span><i>Khách hàng:</i> ' + esc(d.client) + '</span>';
  var f = dmy(d.from), t = dmy(d.to);
  if (f || t) h += '<span><i>Thời gian:</i> ' + esc(f || '—') + (t && t !== f ? ' – ' + esc(t) : '') + '</span>';
  h += '</div></div>';
  h += '<div class="prog"><div class="pct">' + (Number(d.pct) || 0) + '%</div>'
    + '<div class="pbar"><i style="width:' + (Number(d.pct) || 0) + '%"></i></div>'
    + '<div class="cnt">'
        + '<span class="kchip k-done"><b>' + (Number(d.done) || 0) + '/' + (Number(d.total) || 0) + '</b>&nbsp;vi&#7879;c xong</span>'
        + (Number(d.doing) ? '<span class="kchip k-doing"><b>' + d.doing + '</b>&nbsp;&#273;ang l&#224;m</span>' : '')
        + (Number(d.cwait) ? '<span class="kchip k-wait"><b>' + d.cwait + '</b>&nbsp;ch&#7901; kh&#225;ch</span>' : '')
        + (Number(d.todo)  ? '<span class="kchip k-todo"><b>' + d.todo + '</b>&nbsp;ch&#432;a giao</span>' : '')
        + '</div></div>';
  var SEGI = {
        list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>',
        cal:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>',
        tl:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M4 12h16M4 17h6"/><circle cx="15.5" cy="7" r="1.5" fill="currentColor" stroke="none"/><circle cx="8.5" cy="17" r="1.5" fill="currentColor" stroke="none"/></svg>'
      };
      var tb = [['list', 'B&#7843;ng'], ['cal', 'L&#7883;ch'], ['tl', 'Timeline']];
      h += '<div class="tabs"><div class="seg">';
      for (var i = 0; i < tb.length; i++) {
        h += '<button type="button" class="tab' + (VIEW === tb[i][0] ? ' on' : '')
          + '" onclick="setView(\'' + tb[i][0] + '\')">' + SEGI[tb[i][0]]
          + '<span>' + tb[i][1] + '</span></button>';
      }
      h += '</div>';
  if (VIEW === 'cal') {
    h += '<div class="navm"><button type="button" onclick="shiftM(-1)" title="Tháng trước">&lsaquo;</button>'
      + '<b>Tháng ' + (CUR.getMonth() + 1) + '/' + CUR.getFullYear() + '</b>'
      + '<button type="button" onclick="shiftM(1)" title="Tháng sau">&rsaquo;</button></div>';
  }
  h += '</div>';
  h += (VIEW === 'cal') ? vCal() : (VIEW === 'tl' ? vTl() : vList());
  el('app').innerHTML = h;
  if (VIEW === 'tl') {
      /* APSA1947: cuon toi hom nay (hoac ngay su kien) cho chac an */
      var sc = el('tlScroll');
      var td = el('tlToday') || document.querySelector('.tl .tlcol.ev');
      if (sc && td) {
        var go = function () {
          var r1 = sc.getBoundingClientRect(), r2 = td.getBoundingClientRect();
          var x = sc.scrollLeft + (r2.left - r1.left) - (sc.clientWidth / 2) + 76;
          var sb = sc.style.scrollBehavior;
          sc.style.scrollBehavior = 'auto';
          sc.scrollLeft = Math.max(0, x);
          sc.style.scrollBehavior = sb;
        };
        go(); requestAnimationFrame(go); setTimeout(go, 60);
      }
  }
  document.title = 'CHECKLIST theo dõi tiến độ'
    + (d.title ? ' ' + d.title : '') + ' · APSA';
  el('foot').innerHTML =
    'Trang này cập nhật tự động theo tiến độ thực tế.<br>Vui lòng không chia sẻ đường dẫn ra ngoài.';
}
function boot(d) {
  D = d;
  /* APSA1941: luon mo o dang Bang cho lan dau, khong nho lua chon cu */
  VIEW = 'list';
  var its = items(), ds = [];
  for (var i = 0; i < its.length; i++) {
    var k = String(its[i].due || '').slice(0, 10);
    if (k) ds.push(k);
  }
  ds.sort();
  CUR = ds.length ? mkd(ds[Math.floor(ds.length / 2)]) : new Date();
  CUR = new Date(CUR.getFullYear(), CUR.getMonth(), 1);
  paint();
}
if (!TOKEN) {
  fail('Thiếu mã liên kết. Hãy mở đúng đường dẫn đã được gửi cho bạn.');
} else {
  fetch(API + '?action=chk-view&t=' + encodeURIComponent(TOKEN), { cache: 'no-store' })
    .then(function (r) {
      return r.json().catch(function () {
        return { ok: false, error: 'Máy chủ trả về dữ liệu không hợp lệ.' };
      });
    })
    .then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || 'Có lỗi xảy ra.');
      boot(j.data);
    })
    .catch(function (e) { fail(e.message); });
}
