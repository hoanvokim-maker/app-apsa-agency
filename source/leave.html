  fetch('./api/auth-api.php?action=me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject())

    .tab.on .cnt { background: #000; color: var(--green); }

    .btn {
      background: var(--bg3); border: 1px solid var(--border); color: var(--text);

      cursor: pointer; transition: all .18s;

<script>
/* ══════════════════════════════════════════════════════════
   APSA — Xin nghỉ phép
   ══════════════════════════════════════════════════════════ */
const API = './api/leave-api.php';

let ME = null, IS_ADMIN = false, TYPES = {}, CAL = { enabled: false, mailbox: '' };
let WORK_DAYS = [1,2,3,4,5,6], HOLIDAYS = {};   // 1=T2 ... 7=CN
let TAB = 'mine', ROWS = [], SUMMARY = null, EDIT = 0, DECIDE = { id: 0, mode: '' };
const YEAR = new Date().getFullYear();

/* ── helpers ── */
async function api(action, opts) {
  opts = opts || {};
  const url = API + '?action=' + encodeURIComponent(action) + (opts.qs || '');
  const init = { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } };
  if (opts.body) { init.method = 'POST'; init.body = JSON.stringify(opts.body); }
  const r = await fetch(url, init);
  let j = {};
  try { j = await r.json(); } catch (e) { throw new Error('Máy chủ trả về dữ liệu không đọc được.'); }
  if (!r.ok || j.ok === false) throw new Error(j.error || ('Lỗi ' + r.status));
  return j;
}

let toastT = null;
function toast(msg, isErr) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'on' + (isErr ? ' err' : '');
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.className = ''; }, isErr ? 6000 : 3200);
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const nd  = n => { const v = Math.round(Number(n) * 10) / 10; return (v % 1 === 0 ? String(v) : String(v).replace('.', ',')); };
const dvn = d => { if (!d) return ''; const p = String(d).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };

function partLb(p) { return p === 'am' ? 'buổi sáng' : (p === 'pm' ? 'buổi chiều' : ''); }
function rangeText(r) {
  const a = dvn(r.start_date), b = dvn(r.end_date);
  if (r.start_date === r.end_date) {
    const p = partLb(r.start_part);
    return a + (p ? ' (' + p + ')' : '');
  }
  const pa = partLb(r.start_part), pb = partLb(r.end_part);
  return a + (pa ? ' (' + pa + ')' : '') + ' → ' + b + (pb ? ' (' + pb + ')' : '');
}

/* Tính số ngày — cùng công thức với server */
function countDays(sd, sp, ed, ep, skipWe) {
  if (!sd) return 0;
  if (!ed) ed = sd;
  if (ed < sd) return 0;
  const single = (sd === ed);
  let total = 0, guard = 0;
  const cur = new Date(sd + 'T00:00:00'), end = new Date(ed + 'T00:00:00');
  while (cur <= end && guard++ < 400) {
    const key = cur.getFullYear() + '-' + String(cur.getMonth()+1).padStart(2,'0') + '-' + String(cur.getDate()).padStart(2,'0');
    const iso = cur.getDay() === 0 ? 7 : cur.getDay();   // 1=T2 ... 7=CN
    const offDay = skipWe && WORK_DAYS.indexOf(iso) === -1;
    if (!offDay && !HOLIDAYS[key]) {
      let part = 'full';
      if (single) part = sp;
      else if (key === sd) part = sp;
      else if (key === ed) part = ep;
      total += (part === 'am' || part === 'pm') ? 0.5 : 1;
    }
    cur.setDate(cur.getDate() + 1);
  }
  return Math.round(total * 10) / 10;
}

/* ── khởi động ── */
async function init() {
  try {
    const j = await api('me', { qs: '&year=' + YEAR });
    ME = j.me; IS_ADMIN = !!j.is_admin; TYPES = j.types; SUMMARY = j.summary; CAL = j.calendar;
    if (Array.isArray(j.work_days) && j.work_days.length) WORK_DAYS = j.work_days;
    if (j.holidays) HOLIDAYS = j.holidays;
    paintSkipLabel();
  } catch (e) { toast(e.message, true); return; }

  const sel = document.getElementById('fType');
  sel.innerHTML = Object.keys(TYPES).map(k => '<option value="' + k + '">' + esc(TYPES[k]) + '</option>').join('');

  if (IS_ADMIN) {
    document.querySelectorAll('.tab[data-tab="pending"],.tab[data-tab="all"],.tab[data-tab="quota"]')
      .forEach(b => b.style.display = '');
    document.getElementById('btnCalTest').style.display = '';
    if (!CAL.enabled) {
      document.getElementById('calWarn').innerHTML =
        '<div class="banner warn"><div class="bx"><b>Chưa kết nối lịch Outlook.</b> ' +
        'Đơn vẫn duyệt được bình thường, nhưng chưa tự thêm vào lịch ' + esc(CAL.mailbox) + '. ' +
        'Cần điền Tenant ID / Client ID / Client Secret vào <code>api/msgraph-config.php</code> rồi đặt <code>enabled =&gt; true</code>.</div></div>';
    }
  }

  paintChips();
  refreshPending();
  setTab(IS_ADMIN ? 'pending' : 'mine');   /* APSA1214 */

  // Mở thẳng 1 đơn nếu URL có ?id=
  const q = new URLSearchParams(location.search);
  if (q.get('id')) setTimeout(() => {
    const el = document.getElementById('row-' + q.get('id'));
    if (el) { el.scrollIntoView({ block: 'center' }); el.style.background = 'rgba(223,242,13,.07)'; }
  }, 400);
}

/* Nhãn ô tick đọc đúng theo cấu hình ngày làm việc trong Cài đặt */
function paintSkipLabel() {
  const NAME = { 1:'T2', 2:'T3', 3:'T4', 4:'T5', 5:'T6', 6:'T7', 7:'CN' };
  const off = [1,2,3,4,5,6,7].filter(d => WORK_DAYS.indexOf(d) === -1).map(d => NAME[d]);
  const el = document.getElementById('fSkipLb');
  if (el) el.innerHTML = off.length
    ? 'Không tính ' + off.join(' &amp; ') + ' và ngày lễ'
    : 'Không tính ngày lễ';
}

/* ── APSA1213: bo loc + sap xep cho danh sach nghi phep ───────────────── */
var LVF = { who: '', type: '', status: '', from: '', to: '' };
var LVS = { key: 'time', dir: -1 };

function lvReset() {
  LVF = { who: '', type: '', status: '', from: '', to: '' };
  lvRender(TAB !== 'mine');
}

function lvSet(k, v) { LVF[k] = v; lvPaintRows(); }

function lvSort(k) {
  if (LVS.key === k) LVS.dir = -LVS.dir;
  else { LVS.key = k; LVS.dir = (k === 'time' || k === 'days') ? -1 : 1; }
  lvPaintRows();
}

function lvKey(r, k) {
  if (k === 'who')    return (r.user_name  || '').toLowerCase();
  if (k === 'type')   return (r.type_label || '').toLowerCase();
  if (k === 'time')   return String(r.start_date || '');
  if (k === 'days')   return Number(r.days) || 0;
  if (k === 'status') return (r.status_label || '').toLowerCase();
  return '';
}

function lvRows() {
  var out = ROWS.filter(function (r) {
    if (LVF.who    && r.user_name  !== LVF.who)    return false;
    if (LVF.type   && r.leave_type !== LVF.type)   return false;
    if (LVF.status && r.status     !== LVF.status) return false;
    if (LVF.from && String(r.end_date || r.start_date) < LVF.from) return false;
    if (LVF.to   && String(r.start_date) > LVF.to) return false;
    return true;
  });
  var d = LVS.dir;
  out.sort(function (a, b) {
    var x = lvKey(a, LVS.key), y = lvKey(b, LVS.key);
    if (x < y) return -d;
    if (x > y) return d;
    return (a.id - b.id) * d;
  });
  return out;
}

function lvTh(k, label, show) {
  if (show === false) return '';
  var ar = (LVS.key === k) ? (LVS.dir > 0 ? ' ▲' : ' ▼') : '';
  return '<th class="lv-sort" onclick="lvSort(\'' + k + '\')" title="Bấm để sắp xếp">' + label + ar + '</th>';
}

function lvPaintRows() {
  var showWho = (TAB !== 'mine');
  var rows = lvRows();
  var head =
    '<div class="tbl-wrap"><table><thead><tr>' +
    lvTh('who', 'Người xin nghỉ', showWho) +
    lvTh('type', 'Loại') +
    lvTh('time', 'Thời gian') +
    lvTh('days', 'Số ngày') +
    '<th>Lý do</th>' +
    lvTh('status', 'Trạng thái') +
    (IS_ADMIN ? '<th>Lịch</th>' : '') +
    '<th></th></tr></thead><tbody>';
  var body = rows.length
    ? rows.map(function (r) { return rowHtml(r, showWho); }).join('')
    : '<tr><td colspan="9" style="text-align:center;color:var(--text3);padding:34px">Không có đơn nào khớp bộ lọc.</td></tr>';
  document.getElementById('lvTable').innerHTML = head + body + '</tbody></table></div>';
  var c = document.getElementById('lvCount');
  if (c) c.textContent = rows.length + ' / ' + ROWS.length + ' đơn';
}

function lvRender(showWho) {
  if (!showWho) LVF.who = '';

  var whos = [], stats = [], stLb = {};
  ROWS.forEach(function (r) {
    if (r.user_name && whos.indexOf(r.user_name) < 0) whos.push(r.user_name);
    if (r.status && stats.indexOf(r.status) < 0) stats.push(r.status);
    if (r.status) stLb[r.status] = r.status_label;
  });
  whos.sort(function (a, b) { return String(a).localeCompare(String(b), 'vi'); });

  var sel = function (key, label, opts) {
    return '<label class="lvf"><span>' + label + '</span>' +
      '<select onchange="lvSet(\'' + key + '\', this.value)"><option value="">Tất cả</option>' +
      opts.map(function (o) {
        return '<option value="' + esc(o[0]) + '"' + (LVF[key] === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') +
      '</select></label>';
  };

  var typeOpts = Object.keys(TYPES).map(function (k) { return [k, TYPES[k]]; });

  var bar =
    '<div class="lvbar">' +
    (showWho ? sel('who', 'Nhân viên', whos.map(function (w) { return [w, w]; })) : '') +
    sel('type', 'Loại nghỉ', typeOpts) +
    sel('status', 'Trạng thái', stats.map(function (s) { return [s, stLb[s] || s]; })) +
    '<label class="lvf"><span>Từ ngày</span><input type="date" value="' + esc(LVF.from) + '" onchange="lvSet(\'from\', this.value)"></label>' +
    '<label class="lvf"><span>Đến ngày</span><input type="date" value="' + esc(LVF.to) + '" onchange="lvSet(\'to\', this.value)"></label>' +
    '<button class="btn sm" onclick="lvReset()">✕ Xoá lọc</button>' +
    '<span class="spacer"></span><span class="lvcnt" id="lvCount"></span>' +
    '</div>';

  document.getElementById('view').innerHTML = bar + '<div id="lvTable"></div>';
  lvPaintRows();
}

function renderList() {
  if (!ROWS.length) {
    const msg = TAB === 'pending' ? 'Không có đơn nào đang chờ duyệt.' : 'Chưa có đơn xin nghỉ nào.';
    document.getElementById('view').innerHTML = '<div class="empty"><b>Trống</b>' + msg + '</div>';
    return;
  }
  const showWho = (TAB !== 'mine');
  return lvRender(showWho);   /* APSA1213 */
  const html =
    '<div class="tbl-wrap"><table><thead><tr>' +
    (showWho ? '<th>Người xin nghỉ</th>' : '') +
    '<th>Loại</th><th>Thời gian</th><th>Số ngày</th><th>Lý do</th><th>Trạng thái</th>' +
    (IS_ADMIN ? '<th>Lịch</th>' : '') +
    '<th></th></tr></thead><tbody>' +
    ROWS.map(r => rowHtml(r, showWho)).join('') +
    '</tbody></table></div>';
  document.getElementById('view').innerHTML = html;
}

function rowHtml(r, showWho) {
  let cal = '';
  if (IS_ADMIN) {
    if (r.status !== 'approved')      cal = '<span class="cal-off">—</span>';
    else if (r.cal_status === 'ok')   cal = '<span class="cal-ok">✓ Đã lên lịch</span>';
    else if (r.cal_status === 'error') cal = '<span class="cal-err" title="' + esc(r.cal_error) + '">✕ Lỗi</span>';
    else                              cal = '<span class="cal-off">chưa đẩy</span>';
  }

  const acts = [];
  const mine = (r.user_id === ME.id);
  if (r.status === 'pending' && mine)        acts.push('<button class="btn sm" onclick="openForm(' + r.id + ')">Sửa</button>');
  if (r.status === 'pending' && IS_ADMIN)    acts.push('<button class="btn sm primary" onclick="openDecide(' + r.id + ',\'approve\')">Duyệt</button>');
  if (r.status === 'pending' && IS_ADMIN)    acts.push('<button class="btn sm danger" onclick="openDecide(' + r.id + ',\'reject\')">Từ chối</button>');
  if (r.status === 'pending' && mine)        acts.push('<button class="btn sm danger" onclick="cancelReq(' + r.id + ')">Huỷ</button>');
  if (r.status === 'approved' && IS_ADMIN)   acts.push('<button class="btn sm danger" onclick="cancelReq(' + r.id + ')">Huỷ đơn</button>');
  if (r.status === 'approved' && IS_ADMIN && CAL.enabled && r.cal_status !== 'ok')
    acts.push('<button class="btn sm" onclick="calRetry(' + r.id + ')">Đẩy lên lịch</button>');
  if (r.status === 'approved' && IS_ADMIN && CAL.enabled && r.cal_status === 'ok')   /* APSA1218 */
    acts.push('<button class="btn sm" onclick="calRetry(' + r.id + ')">Đồng bộ lịch</button>');
  if ((r.status === 'canceled' || r.status === 'rejected') && (mine || IS_ADMIN))
    acts.push('<button class="btn sm danger" onclick="delReq(' + r.id + ')">Xoá</button>');

  const decided = r.decided_by_name
    ? '<div class="sub">' + (r.status === 'approved' ? 'Duyệt bởi ' : (r.status === 'rejected' ? 'Từ chối bởi ' : 'Xử lý bởi ')) + esc(r.decided_by_name) + '</div>'
    : '';
  const note = r.decide_note ? '<div class="sub">“' + esc(r.decide_note) + '”</div>' : '';

  return '<tr id="row-' + r.id + '">' +
    (showWho ? '<td><div class="lv-who">' + esc(r.user_name) + '</div><div class="sub">' + dvn(r.created_at) + '</div></td>' : '') +
    '<td class="nowrap">' + esc(r.type_label) + '</td>' +
    '<td class="nowrap">' + esc(rangeText(r)) + '</td>' +
    '<td class="days nowrap">' + nd(r.days) + '</td>' +
    '<td class="reason">' + esc(r.reason) + (r.handover ? '<div class="sub">Bàn giao: ' + esc(r.handover) + '</div>' : '') + '</td>' +
    '<td><span class="pill st-' + r.status + '">' + esc(r.status_label) + '</span>' + decided + note + '</td>' +
    (IS_ADMIN ? '<td class="nowrap">' + cal + '</td>' : '') +
    '<td><div class="acts">' + acts.join('') + '</div></td>' +
  '</tr>';
}

/* ── form ── */
function openForm(id) {
  EDIT = id || 0;
  const r = id ? ROWS.find(x => x.id === id) : null;
  document.getElementById('fTitle').textContent = r ? 'Sửa đơn xin nghỉ' : 'Tạo đơn xin nghỉ';
  document.getElementById('fSave').textContent  = r ? 'Lưu thay đổi' : 'Gửi đơn';

  const _t = new Date(); const today = _t.getFullYear() + '-' + String(_t.getMonth()+1).padStart(2,'0') + '-' + String(_t.getDate()).padStart(2,'0');
  document.getElementById('fType').value      = r ? r.leave_type : 'annual';
  document.getElementById('fStart').value     = r ? r.start_date : today;
  document.getElementById('fEnd').value       = r ? r.end_date   : today;
  document.getElementById('fStartPart').value = r ? r.start_part : 'full';
  document.getElementById('fEndPart').value   = r ? r.end_part   : 'full';
  document.getElementById('fSkip').checked    = r ? !!r.skip_weekend : true;
  document.getElementById('fReason').value    = r ? r.reason   : '';
  document.getElementById('fHandover').value  = r ? r.handover : '';

  onDates();
  document.getElementById('mForm').classList.add('on');
}

function onDates() {
  const s = document.getElementById('fStart').value;
  const e = document.getElementById('fEnd').value;
  if (s && (!e || e < s)) document.getElementById('fEnd').value = s;
  const same = (document.getElementById('fStart').value === document.getElementById('fEnd').value);
  document.getElementById('fEndPart').disabled = same;
  if (same) document.getElementById('fEndPart').value = document.getElementById('fStartPart').value;
  calc();
}

function calc() {
  const sd = document.getElementById('fStart').value;
  const ed = document.getElementById('fEnd').value || sd;
  const sp = document.getElementById('fStartPart').value;
  const ep = (sd === ed) ? sp : document.getElementById('fEndPart').value;
  const n  = countDays(sd, sp, ed, ep, document.getElementById('fSkip').checked);
  document.getElementById('fDays').innerHTML = nd(n) + '<small>ngày</small>';

  // Cảnh báo vượt quỹ phép năm
  const box = document.getElementById('fQuotaWarn');
  box.innerHTML = '';
  if (document.getElementById('fType').value === 'annual' && SUMMARY) {
    const already = EDIT ? 0 : 0;
    const left = SUMMARY.remaining - already;
    if (n > left) {
      box.innerHTML = '<div class="banner warn"><div class="bx"><b>Vượt quỹ phép năm.</b> ' +
        'Bạn còn <b>' + nd(left) + '</b> ngày nhưng đang xin <b>' + nd(n) + '</b> ngày. ' +
        'Vẫn gửi được, nhưng phần vượt sẽ do Admin quyết.</div></div>';
    }
  }
}
document.getElementById('fType').addEventListener('change', calc);

async function saveForm() {
  const body = {
    id:           EDIT,
    leave_type:   document.getElementById('fType').value,
    start_date:   document.getElementById('fStart').value,
    start_part:   document.getElementById('fStartPart').value,
    end_date:     document.getElementById('fEnd').value,
    end_part:     document.getElementById('fEndPart').value,
    skip_weekend: document.getElementById('fSkip').checked ? 1 : 0,
    reason:       document.getElementById('fReason').value.trim(),
    handover:     document.getElementById('fHandover').value.trim()
  };
  if (!body.start_date) return toast('Chọn ngày bắt đầu đã nhé.', true);
  if (!body.reason)     return toast('Nhập lý do nghỉ giúp tôi.', true);

  const btn = document.getElementById('fSave');
  btn.disabled = true;
  try {
    await api('save', { body: body });
    closeModal();
    toast(EDIT ? 'Đã lưu thay đổi.' : 'Đã gửi đơn — chờ Admin duyệt.');
    await reloadAll();
  } catch (e) { toast(e.message, true); }
  btn.disabled = false;
}

/* ── duyệt / từ chối ── */
function openDecide(id, mode) {
  DECIDE = { id: id, mode: mode };
  const r = ROWS.find(x => x.id === id);
  const ok = (mode === 'approve');
  document.getElementById('dTitle').textContent = ok ? 'Duyệt đơn nghỉ' : 'Từ chối đơn nghỉ';
  document.getElementById('dSub').innerHTML =
    esc(r.user_name) + ' — ' + esc(r.type_label) + ', <b>' + nd(r.days) + '</b> ngày<br>' + esc(rangeText(r)) +
    (ok && CAL.enabled ? '<br><span style="color:var(--green)">Duyệt xong sẽ tự thêm vào lịch ' + esc(CAL.mailbox) + '.</span>' : '');
  document.getElementById('dNoteLb').textContent = ok ? 'Ghi chú (không bắt buộc)' : 'Lý do từ chối (bắt buộc)';
  document.getElementById('dNote').value = '';
  document.getElementById('dNote').placeholder = ok ? '' : 'Ví dụ: trùng lịch chạy campaign, dời sang tuần sau giúp anh.';
  const go = document.getElementById('dGo');
  go.textContent = ok ? 'Duyệt đơn' : 'Từ chối';
  go.className = 'btn ' + (ok ? 'primary' : 'danger');
  document.getElementById('mDecide').classList.add('on');
}

async function doDecide() {
  const note = document.getElementById('dNote').value.trim();
  if (DECIDE.mode === 'reject' && !note) return toast('Nhập lý do từ chối giúp nhân viên hiểu.', true);
  const go = document.getElementById('dGo');
  go.disabled = true;
  try {
    const j = await api(DECIDE.mode, { body: { id: DECIDE.id, note: note } });
    closeModal();
    toast(j.message || 'Xong.', DECIDE.mode === 'approve' && j.calendar === false);
    await reloadAll();
  } catch (e) { toast(e.message, true); }
  go.disabled = false;
}

async function cancelReq(id) {
  const r = ROWS.find(x => x.id === id);
  if (!confirm('Huỷ đơn nghỉ ' + rangeText(r) + '?' + (r.has_event ? '\n\nSự kiện trên lịch Outlook cũng sẽ bị xoá.' : ''))) return;
  try {
    const j = await api('cancel', { body: { id: id } });
    toast(j.message || 'Đã huỷ đơn.');
    await reloadAll();
  } catch (e) { toast(e.message, true); }
}

async function delReq(id) {
  const r = ROWS.find(x => x.id === id);
  if (!confirm('Xoá hẳn đơn ' + rangeText(r) + ' khỏi danh sách?\n\nĐơn đã huỷ/bị từ chối nên không ảnh hưởng quỹ phép. Thao tác này không hoàn tác được.')) return;
  try { const j = await api('delete', { body: { id } }); toast(j.message); await reloadAll(); }
  catch (e) { toast(e.message, true); }
}

async function calRetry(id) {
  try {
    const j = await api('cal-retry', { body: { id: id } });
    toast(j.message, !j.ok);
    await reloadAll();
  } catch (e) { toast(e.message, true); }
}

async function calTest() {
  const b = document.getElementById('btnCalTest');
  b.disabled = true; b.textContent = 'Đang kiểm tra…';
  try {
    const j = await api('cal-test');
    toast(j.message, !j.ok);
  } catch (e) { toast(e.message, true); }
  b.disabled = false; b.textContent = 'Kiểm tra Outlook';
}

/* ── quỹ phép ── */
/* APSA1219UI */
function qdmy(s) {
  if (!s) return '—';
  const p = String(s).slice(0, 10).split('-');
  return (p.length === 3) ? (p[2] + '/' + p[1] + '/' + p[0]) : String(s);
}

        '• Từ tháng chính thức, <b>mỗi tháng làm việc cộng 1 ngày phép</b>, cộng dần tới hết tháng 12.<br>' +
        '• Ngày <b>1/1</b> mỗi năm được cộng <b>12 ngày mới</b>.<br>' +
        '• Ngày phép còn dư của năm trước dùng tới <b>hết 31/03</b> năm sau, sau đó tự hết hạn.<br>' +
        '• Ô <i>Quỹ ' + YEAR + '</i> là số chỉnh tay: nhập số vào đây sẽ <b>ghi đè</b> công thức tự động cho riêng người đó trong năm ' + YEAR + '.' +
      '</div>';

    document.getElementById('view').innerHTML = html;
  } catch (e) {
    document.getElementById('view').innerHTML = '<div class="empty"><b>Không tải được</b> — ' + esc(e.message) + '</div>';
  }
}

async function saveOfficial(uid) {
  const v = document.getElementById('o-' + uid).value;
  try {
    const j = await api('hr-official', { body: { user_id: uid, official_at: v } });
    toast(j.message);
    loadQuota();
  } catch (e) { toast(e.message, true); }
}

async function saveQuota(uid) {
  const v = parseFloat(document.getElementById('q-' + uid).value);
  if (isNaN(v)) return toast('Số ngày không hợp lệ.', true);
  try {
    await api('quota-set', { body: { user_id: uid, year: YEAR, total: v } });
    toast('Đã lưu quỹ phép.');
    if (uid === ME.id) { const s = await api('me', { qs: '&year=' + YEAR }); SUMMARY = s.summary; paintChips(); }
    loadQuota();
  } catch (e) { toast(e.message, true); }
}

/* ── chung ── */
async function reloadAll() {
  try { const s = await api('me', { qs: '&year=' + YEAR }); SUMMARY = s.summary; paintChips(); } catch (e) {}
  refreshPending();
  if (TAB === 'quota') loadQuota(); else loadList();
}

function closeModal() {
  document.querySelectorAll('.mask').forEach(m => m.classList.remove('on'));
}
document.querySelectorAll('.mask').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

init();
</script>
</body>
</html>
