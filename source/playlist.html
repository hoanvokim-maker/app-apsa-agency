<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>APSA — Playlist duyệt video</title>
<link rel="icon" href="/favicon.ico" />
<style>
  :root { --bg:#0d0f12; --pn:#14171c; --bd:#262b33; --tx:#e6e8ea; --mu:#9aa0a6; --ac:#d7f205; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--tx);
         font:14px/1.5 Oxanium, -apple-system, system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 18px;
           border-bottom:1px solid var(--bd); background:var(--pn); position:sticky; top:0; z-index:5 }
  header .logo img { height:24px; filter:brightness(0) invert(1); opacity:.9; display:block }
  header .ttl { font-weight:700; letter-spacing:.04em; text-transform:uppercase; font-size:14px }
  header .cnt { margin-left:auto; color:var(--mu); font-size:12px }
  .note { padding:8px 18px; color:var(--mu); font-size:12.5px; border-bottom:1px solid var(--bd) }
  .wrap { display:flex; align-items:flex-start; gap:0; min-height:calc(100vh - 50px) }
  .side { width:290px; flex:0 0 290px; border-right:1px solid var(--bd); background:var(--pn);
          max-height:calc(100vh - 50px); overflow:auto; position:sticky; top:50px }
  .side h2 { margin:0; padding:12px 14px 8px; font-size:11px; letter-spacing:.1em;
             text-transform:uppercase; color:var(--mu) }
  .vi { display:flex; gap:10px; padding:10px 14px; cursor:pointer; border-left:3px solid transparent;
        border-bottom:1px solid rgba(255,255,255,.05) }
  .vi:hover { background:rgba(255,255,255,.04) }
  .vi.on { background:rgba(215,242,5,.1); border-left-color:var(--ac) }
  .vi .no { flex:0 0 22px; color:var(--mu); font-size:12px; padding-top:1px }
  .vi .bd { min-width:0; flex:1 }
  .vi .nm { font-weight:600; font-size:13px; word-break:break-word }
  .vi.on .nm { color:var(--ac) }
  .vi .sub { color:var(--mu); font-size:11.5px; margin-top:2px; white-space:nowrap;
             overflow:hidden; text-overflow:ellipsis }
  .pill { display:inline-block; padding:1px 7px; border-radius:20px; font-size:10.5px;
          border:1px solid var(--bd); color:var(--mu); margin-top:4px }
  .pill.n { border-color:var(--ac); color:var(--ac) }
  .main { flex:1; min-width:0 }
  .main iframe { width:100%; border:0; display:block; min-height:calc(100vh - 50px) }
  .empty { padding:40px 18px; color:var(--mu); text-align:center }
  .side .tog { display:none }
  /* APSA1925: toi uu dien thoai */
  @media (max-width:860px) {
    .wrap { flex-direction:column }
    .main { order:1; width:100% }
    .side { order:2; width:100%; flex:0 0 auto; position:static; max-height:none; border-right:0;
            border-top:1px solid var(--bd) }
    .side .list { max-height:none; overflow:visible }
    .main iframe { min-height:0; height:76vh }
  }
  @media (max-width:640px) {
    header { padding:10px 12px; gap:10px }
    header .logo img { height:18px }
    header .ttl { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0 }
    header .cnt { font-size:11px; flex:0 0 auto; margin-left:auto }
    .note { padding:7px 12px; font-size:11.5px }
    .vi { padding:9px 12px; gap:9px }
    .vi .nm { font-size:12.5px }
    .vi .sub { font-size:11px }
    .side h2 { padding:10px 12px 7px }
    .main iframe { height:80vh }
  }
  /* xoay ngang tren dien thoai: an danh sach, video chiem het man */
  @media (orientation:landscape) and (max-height:540px) {
    header { padding:5px 12px }
    .side { display:none }
    .note { display:none }
    .main iframe { height:calc(100vh - 38px); min-height:0 }
  }
  @media (max-width:860px) {
    .zz-unused { display:none }
  --w-rgb: 255,255,255;
  }

/* ---- APSA1895 — LIGHT MODE cho trang nay ----
   Trang tu khai bo token rieng o :root nen de len theme.css;
   khoi duoi day dinh nghia lai dung bo token do cho nen sang. */
html[data-theme="light"] {
  --bg: #ffffff;
  --bd: rgba(0,0,0,.14);
  --tx: #3a3a34;
  --mu: #87877e;
  --ac: #d97757;
  --w-rgb: 0,0,0;
}
  /* APSA1925: goi y xoay ngang */
  .rothint{ position:fixed; inset:0; z-index:99998; background:rgba(0,0,0,.88);
    display:none; align-items:center; justify-content:center; padding:24px }
  .rothint.on{ display:flex }
  .rh-box{ text-align:center; color:#fff; max-width:290px }
  .rh-ph{ width:62px; height:104px; margin:0 auto 26px; border:3px solid #fff; border-radius:13px;
    position:relative; animation:rhSpin 2.8s ease-in-out infinite }
  .rh-ph:after{ content:''; position:absolute; left:50%; transform:translateX(-50%); bottom:5px;
    width:20px; height:3px; border-radius:2px; background:rgba(255,255,255,.6) }
  .rh-scr{ position:absolute; inset:9px 6px 15px; border-radius:5px; background:rgba(215,242,5,.22) }
  @keyframes rhSpin{ 0%,18%{ transform:rotate(0) } 46%,76%{ transform:rotate(-90deg) }
    100%{ transform:rotate(0) } }
  .rh-tx{ font-size:15.5px; font-weight:700; line-height:1.5; letter-spacing:.3px }
  .rh-tx span{ display:block; font-size:12.5px; font-weight:400; opacity:.62; margin-top:6px }
  .rh-ok{ margin-top:22px; background:#d7f205; border:0; color:#111; font-weight:800;
    font-size:12.5px; padding:9px 24px; border-radius:999px; cursor:pointer }
</style>
</head>
<body>
<div class="rothint" id="rotHint">
  <div class="rh-box">
    <div class="rh-ph"><span class="rh-scr"></span></div>
    <div class="rh-tx">Xoay ngang điện thoại<span>để xem video rõ hơn</span></div>
    <button class="rh-ok" onclick="rotClose()">Đã hiểu</button>
  </div>
</div>
<header>
  <div class="logo"><img src="/Logo%20rectange.png" alt="APSA" /></div>
  <div class="ttl" id="ttl">Đang tải…</div>
  <div class="cnt" id="cnt"></div>
</header>
<div class="note" id="note" style="display:none"></div>
<div class="wrap">
  <aside class="side">
    <h2>Danh sách video</h2>
    <div class="list" id="list"></div>
  </aside>
  <main class="main" id="main"><div class="empty" id="emp">Đang tải…</div></main>
</div>
<script>
var API = './api/review-api.php';
var T = (location.search.match(/[?&]t=([a-f0-9]{32})/i) || [])[1] || '';
var VIDS = [], CUR = -1;

function el(i) { return document.getElementById(i); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function mb(n) {
  n = Number(n) || 0;
  return n >= 1073741824 ? (n / 1073741824).toFixed(2) + ' GB' : (n / 1048576).toFixed(1) + ' MB';
}
function api(action, qs) {
  return fetch(API + '?action=' + action + (qs || ''), { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (j) { if (!j.ok) throw new Error(j.error || 'Lỗi'); return j.data; });
}

function draw() {
  el('list').innerHTML = VIDS.map(function (v, i) {
    var n = Number(v.n_open) || 0;
    return '<div class="vi' + (i === CUR ? ' on' : '') + '" onclick="pick(' + i + ')">' +
      '<div class="no">' + (i + 1) + '</div>' +
      '<div class="bd"><div class="nm">' + esc(v.title || v.file_name) + '</div>' +
      '<div class="sub">' + esc(v.file_name) +
      (Number(v.file_size) ? ' · ' + mb(v.file_size) : '') + '</div>' +
      (n ? '<span class="pill n">' + n + ' góp ý chưa xử lý</span>'
         : (Number(v.n_cmt) ? '<span class="pill">' + v.n_cmt + ' góp ý</span>' : '')) +
      '</div></div>';
  }).join('');
}

function pick(i) {
  if (i < 0 || i >= VIDS.length) return;
  CUR = i;
  draw();
  var u = './review.html?t=' + encodeURIComponent(VIDS[i].token) + '&embed=1';
  el('main').innerHTML = '<iframe id="fr" src="' + u + '" allowfullscreen></iframe>';
  try { history.replaceState(null, '', '?t=' + T + '&v=' + (i + 1)); } catch (e) { }
  if (window.innerWidth <= 860) {
    var m = el('main'); if (m && m.scrollIntoView) m.scrollIntoView({ behavior: 'smooth' });
  }
}

function fail(m) {
  el('ttl').textContent = 'Không mở được playlist';
  el('main').innerHTML = '<div class="empty">' + esc(m) + '</div>';
}

(function boot() {
  if (!T) { fail('Thiếu mã link.'); return; }
  api('pl-open', '&t=' + encodeURIComponent(T)).then(function (d) {
    document.title = (d.title || 'Playlist') + ' — APSA';
    el('ttl').textContent = d.title || 'Playlist';
    if (d.note) { el('note').textContent = d.note; el('note').style.display = ''; }
    VIDS = d.videos || [];
    el('cnt').textContent = VIDS.length + ' video';
    if (!VIDS.length) {
      el('list').innerHTML = '<div class="empty">Chưa có video nào.</div>';
      el('main').innerHTML = '<div class="empty">Playlist này chưa có video.</div>';
      return;
    }
    var want = Number((location.search.match(/[?&]v=(\d+)/) || [])[1] || 1) - 1;
    if (!(want >= 0 && want < VIDS.length)) want = 0;
    pick(want);
  }).catch(function (e) { fail(e.message); });
})();
</script>
<script>
/* APSA1925: goi y xoay ngang dien thoai */
function rotClose(){
  try { sessionStorage.setItem('apsa_rot', '1'); } catch (e) {}
  var b = document.getElementById('rotHint'); if (b) b.classList.remove('on');
}
function rotShow(){
  var b = document.getElementById('rotHint'); if (!b) return;
  var seen = false;
  try { seen = sessionStorage.getItem('apsa_rot') === '1'; } catch (e) {}
  var small = Math.min(window.innerWidth, window.innerHeight) <= 560;
  var port  = window.innerHeight > window.innerWidth;
  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  b.classList[(small && port && touch && !seen) ? 'add' : 'remove']('on');
}
window.addEventListener('resize', rotShow);
window.addEventListener('orientationchange', function () { setTimeout(rotShow, 350); });
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', rotShow);
else rotShow();
</script>
</body>
</html>
