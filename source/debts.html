<!DOCTYPE html>
<html lang="vi">
<head>
<script>
  document.documentElement.style.visibility = 'hidden';
  fetch('./api/auth-api.php?action=me', { credentials: 'same-origin' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(res => {
      if (!res.ok) throw new Error();
      window.__APSA_USER = res.data;
      document.documentElement.style.visibility = 'visible';
    })
    .catch(() => {
      location.replace('./login.html?next=' + encodeURIComponent(location.pathname + location.search));
      return;
    })
    .then(() => { if (window.__APSA_USER) window.dispatchEvent(new Event('apsa-auth-ready')); });
</script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root{
  --bg:#000000; --bg2:#0b0b0b; --bg3:#141414;
  --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.18);
  --text:#ffffff; --text2:#9a9a9a; --text3:#5e5e5e;
  --accent:#dff20d; --accent2:#c9dd00; --accent-glow:rgba(223,242,13,.35);
  --green:#dff20d; --orange:#ffffff; --pink:#c9dd00; --cyan:#ffffff; --red:#ff4d4d; --yellow:#dff20d;
  --radius:14px;
}
body{ font-family:'Oxanium', sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
body::before{ content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E"); }

header{ position:sticky; top:0; z-index:100; height:56px; padding:0 20px;
  background:rgba(0,0,0,.85); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.back{ display:flex; align-items:center; gap:7px; text-decoration:none; color:var(--text2); font-size:13px; font-weight:600;
  padding:6px 12px; border-radius:20px; border:1px solid var(--border); transition:.2s; flex-shrink:0; white-space:nowrap; }
.back:hover{ color:var(--text); border-color:var(--border-hover); background:var(--bg3); }
.page-title{ font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; flex-shrink:0; white-space:nowrap; }
.page-title .count{ font-size:11px; font-weight:600; color:var(--text3); background:var(--bg3); border:1px solid var(--border); padding:2px 8px; border-radius:20px; }
.header-search{ flex:1; max-width:300px; position:relative; }
.header-search svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text3); pointer-events:none; }
.search-input{ width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:40px;
  padding:8px 14px 8px 36px; color:var(--text); font-size:13px; font-family:inherit; outline:none; transition:.2s; }
.search-input::placeholder{ color:var(--text3); }
.search-input:focus{ border-color:rgba(223,242,13,.5); box-shadow:0 0 0 3px rgba(223,242,13,.1); }
.hsel{ background:var(--bg3); border:1px solid var(--border); border-radius:20px; padding:7px 12px; color:var(--text2);
  font-size:12px; font-family:inherit; font-weight:600; outline:none; max-width:220px; cursor:pointer; }
.hsel:focus{ border-color:rgba(223,242,13,.5); color:var(--text); }
.hbtn{ display:inline-flex; align-items:center; gap:6px; cursor:pointer; font-family:inherit; font-size:12px; font-weight:600;
  padding:7px 14px; border-radius:20px; border:1px solid var(--border); background:transparent; color:var(--text2); transition:.2s; white-space:nowrap; text-decoration:none; }
.hbtn:hover{ color:var(--text); border-color:var(--border-hover); background:var(--bg3); }
.hbtn.active{ color:var(--text); background:var(--bg3); border-color:var(--border-hover); }
.hbtn.primary{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-color:transparent; box-shadow:0 0 12px var(--accent-glow); }
.hbtn.primary:hover{ transform:translateY(-1px); box-shadow:0 4px 20px var(--accent-glow); }
.who{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text2); padding:5px 10px;
  border-radius:20px; border:1px solid var(--border); white-space:nowrap; flex-shrink:0; }
.avatar{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; font-size:10px; font-weight:800; flex-shrink:0; }

.wrap{ max-width:1560px; margin:0 auto; padding:18px 24px 80px; position:relative; z-index:1; }

.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
.stat{ background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; position:relative; overflow:hidden; }
.stat::after{ content:''; position:absolute; inset:0 auto 0 0; width:3px; background:var(--accent); opacity:.8; }
.stat.green::after{ background:var(--green); } .stat.orange::after{ background:var(--orange); } .stat.red::after{ background:var(--red); }
.stat .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); font-weight:700; margin-bottom:6px; }
.stat .val{ font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
.stat .sub{ font-size:11px; color:var(--text3); margin-top:3px; }
.stat.green .val{ color:#eaff6b; } .stat.orange .val{ color:#ffffff; } .stat.red .val{ color:#ff8f8f; }

.toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.toolbar .spacer{ flex:1; }
.pill{ white-space:nowrap; padding:7px 14px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer;
  border:1px solid var(--border); background:var(--bg2); color:var(--text2); transition:.2s; font-family:inherit; display:inline-flex; align-items:center; gap:6px; }
.pill:hover{ border-color:var(--border-hover); color:var(--text); }
.pill.active{ background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 14px var(--accent-glow); }
.pill .n{ font-size:10px; font-weight:700; background:rgba(255,255,255,.14); padding:1px 7px; border-radius:20px; }
.pill.active .n{ background:rgba(255,255,255,.26); }

.tbl-wrap{ overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border); }
table.t{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:1120px; }
table.t thead th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--text3);
  font-weight:700; padding:10px 12px; background:var(--bg2); border-bottom:1px solid var(--border); white-space:nowrap; }
table.t tbody td{ padding:10px 12px; border-bottom:1px solid var(--border); background:var(--bg2); vertical-align:middle; }
table.t tbody tr.inv{ transition:background .15s; cursor:pointer; }
table.t tbody tr.inv:hover td{ background:var(--bg3); }
table.t tbody tr.overdue td{ background:rgba(255,77,77,.05); }
table.t tbody tr.overdue:hover td{ background:rgba(255,77,77,.1); }
table.t tbody tr.done td{ opacity:.62; }
.num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:600; }
.num.zero{ color:var(--text3); font-weight:400; }
.nm{ font-weight:700; }
.sm{ color:var(--text2); font-size:11.5px; }
.xs{ color:var(--text3); font-size:11px; }
.caret{ color:var(--text3); font-size:10px; display:inline-block; transition:transform .2s; }
tr.open .caret{ transform:rotate(90deg); color:var(--accent2); }
.chip{ display:inline-block; font-size:10.5px; font-weight:700; padding:2px 9px; border-radius:20px; white-space:nowrap; }
.chip.unpaid{ color:#e6e6e6; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); }
.chip.partial{ color:#eaff6b; background:rgba(223,242,13,.15); border:1px solid rgba(223,242,13,.36); }
.chip.paid{ color:#eaff6b; background:rgba(223,242,13,.14); border:1px solid rgba(223,242,13,.34); }
.chip.od{ color:#ff8f8f; background:rgba(255,77,77,.15); border:1px solid rgba(255,77,77,.36); }
.actions-cell{ white-space:nowrap; text-align:right; }
.act{ width:27px; height:27px; border-radius:8px; display:inline-flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid transparent; color:var(--text3); cursor:pointer; font-size:12px; transition:.15s; }
.act:hover{ color:#fff; background:var(--accent); border-color:var(--accent); }
.act.pay:hover{ background:var(--green); border-color:var(--green); }
.act.del:hover{ background:var(--red); border-color:var(--red); }

tr.paylist > td{ padding:0 !important; background:var(--bg) !important; }
.paybox{ padding:12px 16px 14px 44px; }
.paybox .ph{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--text3); font-weight:700; margin-bottom:8px; }
table.pt{ width:100%; border-collapse:collapse; font-size:12px; }
table.pt th{ text-align:left; font-size:10px; text-transform:uppercase; color:var(--text3); font-weight:700; padding:5px 10px; }
table.pt td{ padding:6px 10px; border-top:1px solid var(--border); background:transparent; }
.pay-none{ font-size:12px; color:var(--text3); font-style:italic; }

.empty{ text-align:center; padding:80px 24px; color:var(--text3); }
.empty .ico{ font-size:52px; margin-bottom:16px; }
.empty h3{ font-size:17px; color:var(--text2); font-weight:600; margin-bottom:8px; }
.empty p{ font-size:13px; line-height:1.7; max-width:440px; margin:0 auto; }

.ov{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.78); backdrop-filter:blur(8px);
  z-index:300; align-items:center; justify-content:center; padding:24px; overflow-y:auto; }
.ov.open{ display:flex; }
#pyOv, #cfOv{ z-index:700; }
.modal{ background:var(--bg2); border:1px solid var(--border); border-radius:20px; padding:30px; width:100%; max-width:620px; position:relative; margin:auto; }
.modal.narrow{ max-width:440px; }
.modal h2{ font-size:19px; font-weight:700; margin-bottom:6px; }
.modal .sub{ font-size:12.5px; color:var(--text2); margin-bottom:22px; }
.x{ position:absolute; top:14px; right:14px; width:31px; height:31px; border-radius:50%; background:var(--bg3);
  border:1px solid var(--border); color:var(--text2); cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; transition:.2s; }
.x:hover{ color:var(--text); background:var(--border); }
.fg{ margin-bottom:14px; }
.fg label{ display:block; font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
.fg input, .fg textarea, .fg select{ width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:10px;
  padding:9px 13px; color:var(--text); font-size:13.5px; font-family:inherit; outline:none; transition:border-color .2s; resize:vertical; }
.fg input:focus, .fg textarea:focus, .fg select:focus{ border-color:rgba(223,242,13,.5); }
.fg .hint{ font-size:11px; color:var(--text3); margin-top:5px; line-height:1.5; }
.fg .money-hint{ color:var(--accent2); font-weight:600; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
.quick{ display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
.quick button{ font-size:11px; font-weight:600; padding:4px 10px; border-radius:20px; cursor:pointer; font-family:inherit;
  border:1px solid var(--border); background:var(--bg3); color:var(--text2); transition:.15s; }
.quick button:hover{ color:#fff; background:var(--accent); border-color:var(--accent); }
.recap{ background:var(--bg3); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:18px; font-size:12.5px; line-height:1.9; }
.recap b{ color:var(--text); }
.recap .r{ display:flex; justify-content:space-between; gap:12px; }
.recap .r span:last-child{ font-variant-numeric:tabular-nums; font-weight:700; }
.btn{ width:100%; padding:12px; border:none; border-radius:10px; font-size:14px; font-weight:600; font-family:inherit;
  cursor:pointer; transition:.2s; margin-top:6px; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; box-shadow:0 0 20px var(--accent-glow); }
.btn:hover{ transform:translateY(-1px); box-shadow:0 4px 24px var(--accent-glow); }
.btn:disabled{ opacity:.5; cursor:not-allowed; transform:none; }
.btn.green{ background:linear-gradient(135deg,#b9cc00,#dff20d); box-shadow:0 0 20px rgba(223,242,13,.3); }
.btn.ghost{ background:transparent; border:1px solid var(--border); color:var(--text2); box-shadow:none; }
.btn.ghost:hover{ color:var(--text); border-color:var(--border-hover); background:var(--bg3); }
.btn.danger{ background:transparent; border:1px solid rgba(255,77,77,.4); color:#ff6b6b; box-shadow:none; }
.btn.danger:hover{ background:rgba(255,77,77,.12); border-color:var(--red); }
.toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(90px); background:var(--bg3);
  border:1px solid var(--border); border-radius:12px; padding:12px 20px; font-size:13px; font-weight:500; z-index:900;
  transition:transform .3s cubic-bezier(.4,0,.2,1); box-shadow:0 12px 40px rgba(0,0,0,.5); max-width:88vw; text-align:center; }
.toast.show{ transform:translateX(-50%) translateY(0); }
.toast.err{ border-color:rgba(255,77,77,.5); color:#ff8f8f; }
.toast.ok{ border-color:rgba(223,242,13,.5); color:#eaff6b; }
.bar{ position:fixed; top:0; left:0; height:3px; width:0; background:linear-gradient(90deg,var(--accent),var(--accent2)); z-index:999; transition:width .25s; }
@media(max-width:900px){
  header{ padding:8px 12px; gap:8px; flex-wrap:wrap; height:auto; }
  .header-search{ flex-basis:100%; max-width:none; order:6; }
  .wrap{ padding:14px 14px 70px; }
  .stats{ grid-template-columns:1fr 1fr; }
  .modal{ padding:22px 18px; }
  .row2, .row3{ grid-template-columns:1fr; }
}

/* ── Bổ sung cho trang công nợ theo khách hàng ─────────────── */
.legend{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--text3);
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:9px 14px; margin-bottom:14px; }
.legend b{ color:var(--text2); font-weight:700; }
.legend .lg{ display:inline-flex; align-items:center; gap:6px; }
.dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.dot.yellow{ background:#ffd54a; }
.dot.orange{ background:#ff9f43; }
.dot.red{ background:#ff4d4d; }

tr.al-yellow td{ background:rgba(255,213,74,.07) !important; }
tr.al-yellow:hover td{ background:rgba(255,213,74,.13) !important; }
tr.al-orange td{ background:rgba(255,159,67,.09) !important; }
tr.al-orange:hover td{ background:rgba(255,159,67,.15) !important; }
tr.al-red td{ background:rgba(255,77,77,.10) !important; }
tr.al-red:hover td{ background:rgba(255,77,77,.16) !important; }
tr.al-yellow td:first-child{ box-shadow:inset 3px 0 0 #ffd54a; }
tr.al-orange td:first-child{ box-shadow:inset 3px 0 0 #ff9f43; }
tr.al-red td:first-child{ box-shadow:inset 3px 0 0 #ff4d4d; }
tr.flash td{ animation:flash 1.1s ease-out; }
@keyframes flash{ 0%{ background:rgba(223,242,13,.22); } 100%{ } }

.chip.yellow{ color:#ffd54a; background:rgba(255,213,74,.14); border:1px solid rgba(255,213,74,.4); }
.chip.orange{ color:#ff9f43; background:rgba(255,159,67,.14); border:1px solid rgba(255,159,67,.4); }
.chip.red   { color:#ff8f8f; background:rgba(255,77,77,.15);  border:1px solid rgba(255,77,77,.4); }
.chip.ok    { color:#9a9a9a; background:rgba(255,255,255,.06); border:1px solid var(--border); }

.qcell{ white-space:nowrap; }
.qform{ display:inline-flex; align-items:center; gap:4px; }
.qin{ width:118px; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:6px 9px;
  color:var(--text); font-size:12px; font-family:inherit; outline:none; text-align:right; font-variant-numeric:tabular-nums; transition:.15s; }
.qin::placeholder{ color:var(--text3); font-weight:400; }
.qin:focus{ border-color:rgba(223,242,13,.55); box-shadow:0 0 0 3px rgba(223,242,13,.09); }
.qin.pay:focus{ border-color:rgba(120,255,150,.5); box-shadow:0 0 0 3px rgba(120,255,150,.09); }
.qbtn{ width:27px; height:27px; border-radius:8px; border:1px solid var(--border); background:var(--bg3); color:var(--text2);
  cursor:pointer; font-size:12px; display:inline-flex; align-items:center; justify-content:center; transition:.15s; flex-shrink:0; }
.qbtn:hover{ color:#000; background:var(--accent); border-color:var(--accent); }
.qbtn.pay:hover{ background:#8ee06a; border-color:#8ee06a; }
.qbtn:disabled{ opacity:.4; cursor:not-allowed; }
.qhint{ font-size:10px; color:var(--text3); margin-top:3px; display:block; }

/* Drawer lịch sử */
.drawer{ position:fixed; top:0; right:0; bottom:0; width:440px; max-width:94vw; background:var(--bg2);
  border-left:1px solid var(--border); z-index:800; transform:translateX(105%); transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; box-shadow:-20px 0 60px rgba(0,0,0,.6); }
.drawer.open{ transform:translateX(0); }
.drawer .dh{ padding:16px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
.drawer .dh h3{ font-size:15px; font-weight:700; flex:1; }
.drawer .db{ overflow-y:auto; padding:8px 0 24px; flex:1; }
.log{ padding:11px 18px; border-bottom:1px solid var(--border); font-size:12.5px; line-height:1.55; }
.log:hover{ background:var(--bg3); }
.log .lt{ font-size:10.5px; color:var(--text3); display:flex; gap:8px; margin-bottom:3px; }
.log .ls{ color:var(--text); }
.log .lc{ font-size:11px; color:var(--text2); margin-top:2px; }
.log .tag{ display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
  padding:1px 7px; border-radius:20px; border:1px solid var(--border); color:var(--text3); }
.log .tag.pay{ color:#a7e07a; border-color:rgba(167,224,122,.4); background:rgba(167,224,122,.1); }
.log .tag.create{ color:#eaff6b; border-color:rgba(223,242,13,.4); background:rgba(223,242,13,.1); }
.log .tag.delete, .log .tag.purge{ color:#ff8f8f; border-color:rgba(255,77,77,.4); background:rgba(255,77,77,.1); }
.log .tag.update{ color:#8fd0ff; border-color:rgba(143,208,255,.4); background:rgba(143,208,255,.1); }

.sect{ margin-top:22px; }
.sect .sh{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.sect .sh h2{ font-size:14px; font-weight:700; letter-spacing:.3px; }
.sect .sh .cnt2{ font-size:10.5px; font-weight:700; color:var(--text3); background:var(--bg3);
  border:1px solid var(--border); padding:2px 9px; border-radius:20px; }
.sect .sh .spacer{ flex:1; }
.custcard{ background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; margin-bottom:16px;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
.custcard .nm2{ font-size:19px; font-weight:800; }
.custcard .meta{ font-size:12.5px; color:var(--text2); }
.custcard .meta span{ margin-right:14px; }
table.t tfoot td{ padding:10px 12px; background:var(--bg3); border-top:1px solid var(--border-hover); font-weight:800; }

table.t thead th.num{ text-align:right; }

/* ══════════ CÔNG NỢ — SỔ NỢ ĐƠN GIẢN ══════════ */
.hgrow{ flex:1 1 auto; min-width:8px; }
.showall{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--text3); white-space:nowrap; cursor:pointer; }
.showall input{ width:auto; cursor:pointer; }

.stats{ max-width:1500px; margin:0 auto; padding:16px 24px 0; display:grid;
  grid-template-columns:repeat(3,1fr); gap:12px; position:relative; z-index:2; }
.st{ background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; display:flex; align-items:center; gap:12px; }
.st .sico{ width:32px; height:32px; flex-shrink:0; }
.st .sv{ font-family:'Orbitron',sans-serif; font-size:21px; font-weight:800; line-height:1; }
.st .sl{ font-size:11px; color:var(--text3); text-transform:uppercase; letter-spacing:.5px; font-weight:700; margin-top:5px; }
.st.owe .sv{ color:#ff6b6b; }

.wrap{ max-width:1500px; margin:0 auto; padding:16px 24px 80px; position:relative; z-index:1; }

/* Nhóm công ty */
.cogrp{ background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; margin-bottom:12px; }
.cohead{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); }
.coname{ font-size:14.5px; font-weight:700; }
.copeople{ font-size:11.5px; color:var(--text3); }
.cobal{ margin-left:auto; font-family:'Orbitron',sans-serif; font-size:15px; font-weight:800;
  color:#ff6b6b; font-variant-numeric:tabular-nums; white-space:nowrap; }

/* Dòng nhân viên */
.prow{ display:grid; grid-template-columns:minmax(0,1fr) 130px 130px 190px 26px;
  gap:12px; align-items:center; padding:11px 16px; border-bottom:1px solid var(--border);
  cursor:pointer; transition:.15s; }
.prow:last-of-type{ border-bottom:none; }
.prow:hover{ background:var(--bg3); }
.pnm{ font-weight:600; font-size:13px; }
.pmeta{ font-size:11px; color:var(--text3); margin-top:2px; }
.pnum{ text-align:right; font-variant-numeric:tabular-nums; font-size:12.5px; white-space:nowrap; }
.pnum .lbl{ display:block; font-size:10px; color:var(--text3); font-weight:700;
  text-transform:uppercase; letter-spacing:.4px; margin-bottom:2px; }
.pbal{ text-align:right; font-weight:800; font-size:14px; color:#ff6b6b;
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.pbal.clear{ color:#7ee787; }
.pbal .lbl{ display:block; font-size:10px; color:var(--text3); font-weight:700;
  letter-spacing:.3px; margin-top:3px; text-transform:none; }
.pchev{ color:var(--text3); text-align:center; transition:.2s; }
.prow.open .pchev{ transform:rotate(180deg); color:var(--accent); }

/* Lịch sử giao dịch */
.hist{ display:none; padding:0 16px 14px; background:var(--bg); border-bottom:1px solid var(--border); }
.hist.open{ display:block; }
table.ht{ width:100%; border-collapse:collapse; font-size:12.5px; }
table.ht th{ background:var(--bg3); padding:7px 10px; text-align:left; font-size:10px;
  text-transform:uppercase; letter-spacing:.5px; color:var(--text3); font-weight:700; white-space:nowrap; }
table.ht td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
table.ht tr:last-child td{ border-bottom:none; }
.kpill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:800; white-space:nowrap; }
.kpill.debt{ background:rgba(255,77,77,.15); color:#ff8f8f; }
.kpill.credit{ background:rgba(126,231,135,.15); color:#7ee787; }
.hamt{ text-align:right; font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
.hamt.debt{ color:#ff8f8f; } .hamt.credit{ color:#7ee787; }
table.ht th.amt, table.ht td.hamt{ width:1%; padding-right:20px; }
.hdel{ background:none; border:none; color:var(--text3); cursor:pointer; padding:3px 6px; border-radius:6px; font-size:12px; }
.hdel:hover{ color:#ff6b6b; background:rgba(255,77,77,.12); }
.hedit{ background:none; border:none; color:var(--text3); cursor:pointer; padding:3px 6px; border-radius:6px; font-size:12px; }
.hedit:hover{ color:var(--accent); background:rgba(223,242,13,.14); }

/* Chọn loại giao dịch */
.kindpick{ display:flex; gap:9px; }
.kbtn{ flex:1; padding:11px; border-radius:11px; border:1px solid var(--border); background:var(--bg3);
  color:var(--text2); font-family:inherit; font-size:13.5px; font-weight:800; cursor:pointer; transition:.18s; }
.kbtn:hover{ border-color:var(--border-hover); color:var(--text); }
.kbtn.debt.on{ background:rgba(255,77,77,.16); border-color:rgba(255,77,77,.55); color:#ff8f8f; }
.kbtn.credit.on{ background:rgba(126,231,135,.16); border-color:rgba(126,231,135,.55); color:#7ee787; }

/* Gợi ý dự án */
.ac{ position:relative; }
.acmenu{ display:none; position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:60;
  max-height:250px; overflow-y:auto; padding:6px; border-radius:12px;
  background:#0b0b0b; border:1px solid rgba(255,255,255,.14); box-shadow:0 16px 40px rgba(0,0,0,.6); }
.acmenu.open{ display:block; }
.acitem{ display:block; width:100%; text-align:left; background:transparent; border:none; cursor:pointer;
  color:var(--text2); font-family:inherit; font-size:12.5px; padding:8px 10px; border-radius:8px; transition:.12s; }
.acitem:hover, .acitem.sel{ background:#161616; color:#fff; }
.acitem .cd{ font-family:'Orbitron',sans-serif; font-size:10.5px; font-weight:800; color:var(--accent); margin-right:8px; }

/* Thanh ghi nhanh trong lịch sử từng người */
.qk{ display:grid; grid-template-columns:auto minmax(0,1fr) 160px 150px auto; gap:9px;
  align-items:center; margin:10px 0 2px; padding:10px;
  border:1px solid var(--border); border-radius:12px; background:var(--bg2); }
.qkkind{ display:flex; gap:5px; }
.qkb{ padding:8px 13px; border-radius:9px; border:1px solid var(--border); background:var(--bg3);
  color:var(--text3); font-family:inherit; font-size:11.5px; font-weight:800; cursor:pointer; white-space:nowrap; }
.qkb:hover{ border-color:var(--border-hover); color:var(--text); }
.qkb.debt.on{ background:rgba(255,77,77,.16); border-color:rgba(255,77,77,.55); color:#ff8f8f; }
.qkb.credit.on{ background:rgba(126,231,135,.16); border-color:rgba(126,231,135,.55); color:#7ee787; }
.qk input{ width:100%; padding:8px 10px; border-radius:9px; border:1px solid var(--border);
  background:var(--bg3); color:var(--text); font-family:inherit; font-size:12.5px; }
.qk input:focus{ outline:none; border-color:var(--accent); }
.qk input.qkamt{ text-align:right; font-variant-numeric:tabular-nums; font-weight:700; }
.qksave{ padding:9px 17px; border-radius:9px; border:none; background:var(--accent); color:#000;
  font-family:inherit; font-weight:800; font-size:12px; cursor:pointer; white-space:nowrap; }
.qksave:hover{ background:var(--accent2); }
.qksave:disabled{ opacity:.45; cursor:default; }
.qkhint{ font-size:10.5px; color:var(--text3); margin:0 2px 4px; min-height:14px; }
@media (max-width:900px){
  .qk{ grid-template-columns:1fr 1fr; }
  .qk .ac{ grid-column:1 / -1; }
}
.mlact{ display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.fg .hint{ font-size:11px; color:var(--text3); margin-top:5px; }

@media(max-width:900px){
  .stats{ grid-template-columns:1fr; padding-left:14px; padding-right:14px; }
  .wrap{ padding:12px 14px 70px; }
  .prow{ grid-template-columns:minmax(0,1fr) 30px; row-gap:8px; }
  .prow .pnum, .prow .pbal{ grid-column:1; text-align:left; }
  .showall{ display:none; }
  .row2{ grid-template-columns:1fr; }
}

<script>
const API = './api/crm-api.php';

let BOARD = [], COMPANIES = [], CONTACTS = [], KIND = 'debt';
let OPEN = new Set(), HIST = {}, searchTimer = null, projTimer = null, PROJ = [], PSEL = -1;
let ENTRY = {};      // id giao dịch → dữ liệu gốc, dùng khi sửa
let QKCO = {}, QKK = {}, QKP = {}, qkTimer = {};   // ghi nhanh: công ty · loại · gợi ý dự án
let EDIT_ID = 0;     // 0 = đang thêm mới

const $   = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = n => (Number(n) || 0).toLocaleString('vi-VN');

function dmy(s){
  if (!s) return '';
  const p = String(s).slice(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

/* Nhập tắt kiểu Excel: 1e6 = 1.000.000 · 4tr = 4.000.000 · 1tr5 = 1.500.000 · 500k = 500.000 */
function parseMoney(v){
  let s = String(v ?? '').trim().toLowerCase()
    .replace(/\s+/g,'').replace(/đ|vnd|vnđ/g,'');
  if (!s) return 0;
  const neg = s.startsWith('-'); if (neg) s = s.slice(1);

  // Hậu tố: k / ng (nghìn), tr / m (triệu), ty / tỷ / b (tỷ) — cho phép đuôi kiểu 1tr5
  const MULT = { k:1e3, ng:1e3, ngan:1e3, nghin:1e3, tr:1e6, m:1e6, trieu:1e6, ty:1e9, 'tỷ':1e9, b:1e9 };
  const suf = s.match(/^([\d.,]+)(k|ng|ngan|nghin|tr|trieu|m|ty|tỷ|b)(\d*)$/);
  if (suf) {
    let base = suf[1].replace(/,/g,'.');
    const dots = base.split('.').length - 1;
    if (dots > 1) base = base.replace(/\./g,'');            // 1.000tr → 1000tr
    let n = parseFloat(base) || 0;
    const mult = MULT[suf[2]] || 1;
    let val = n * mult;
    if (suf[3]) val += (parseInt(suf[3],10) || 0) * mult / Math.pow(10, suf[3].length);
    return Math.round(neg ? -val : val);
  }

  // Ký hiệu khoa học kiểu Excel: 1e6, 1.5e6, 2E5
  const sci = s.match(/^([\d.,]+)e([+-]?\d+)$/);
  if (sci) {
    const mant = parseFloat(sci[1].replace(/,/g,'.')) || 0;
    const val = mant * Math.pow(10, parseInt(sci[2],10) || 0);
    return Math.round(neg ? -val : val);
  }

  // Số thường: bỏ mọi dấu phân cách nghìn
  const plain = Number(s.replace(/[^\d]/g,'')) || 0;
  return neg ? -plain : plain;
}

let tT = null;
function toast(msg, type){
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(tT);
  tT = setTimeout(() => { t.className = 'toast ' + (type || ''); }, 2800);
}
function progress(on){
  const b = $('bar');
  if (on){ b.style.width = '35%'; setTimeout(() => { b.style.width = '75%'; }, 200); }
  else { b.style.width = '100%'; setTimeout(() => { b.style.width = '0'; }, 300); }
}
async function api(action, opt){
  opt = opt || {};
  const init = { method: opt.body ? 'POST' : 'GET', credentials: 'same-origin' };
  if (opt.body){ init.headers = { 'Content-Type':'application/json' }; init.body = JSON.stringify(opt.body); }
  const r = await fetch(API + '?action=' + action + (opt.qs || ''), init);
  const j = await r.json().catch(() => ({ ok:false, error:'Lỗi kết nối' }));
  if (!j.ok) throw new Error(j.error || 'Lỗi không xác định');
  return j.data;
}

function paintUser(tries){
  const u = window.__APSA_USER;
  if (!u){ if ((tries||0) < 40) setTimeout(() => paintUser((tries||0)+1), 120); return; }
  const n = u.display_name || u.username || 'Khách';
  $('uname').textContent = n;
  $('av').textContent = (n.trim()[0] || '?').toUpperCase();
}

/* ══════════ TẢI & VẼ ══════════ */
async function load(){
  progress(true);
  try{
    const q  = $('q').value.trim();
    const qs = (q ? '&q=' + encodeURIComponent(q) : '') + ($('showAll').checked ? '&all=1' : '');
    const d  = await api('debt-board', { qs });
    BOARD = d.rows || [];
    renderStats(d.totals || {});
    render();
  }catch(e){ toast(e.message, 'err'); }
  progress(false);
}

function renderStats(t){
  const card = (ico, val, label, cls) =>
    '<div class="st ' + (cls||'') + '"><svg class="sico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-' + ico + '"/></svg>' +
    '<div><div class="sv">' + val + '</div><div class="sl">' + label + '</div></div></div>';
  $('stats').innerHTML =
    card('money',    fmt(Math.round(t.outstanding || 0)), 'Tổng còn nợ', 'owe') +
    card('people',   t.people_count  || 0, 'Nhân viên còn nợ') +
    card('building', t.company_count || 0, 'Công ty');
  $('cnt').textContent = t.people_count || 0;
}

function personRow(p, coId){
  QKCO[p.customer_id] = coId || 0;
  const open = OPEN.has(p.customer_id);
  const meta = [p.dept, p.phone].filter(Boolean).join(' · ');
  return '<div class="prow' + (open ? ' open' : '') + '" onclick="togglePerson(' + p.customer_id + ')">' +
      '<div><div class="pnm">' + esc(p.customer_name) + '</div>' +
        (meta ? '<div class="pmeta">' + esc(meta) + '</div>' : '') + '</div>' +
      '<div class="pnum"><span class="lbl">Đã ghi nợ</span>' + fmt(Math.round(p.total_debt)) + '</div>' +
      '<div class="pnum"><span class="lbl">Đã trừ</span>' + fmt(Math.round(p.total_paid)) + '</div>' +
      '<div class="pbal' + (Math.abs(p.balance) < 1 ? ' clear' : '') + '">' + fmt(Math.round(p.balance)) +
        '<span class="lbl" style="font-weight:700">' + p.entry_count + ' giao dịch · ' + dmy(p.last_date) + '</span></div>' +
      '<span class="pchev">▾</span>' +
    '</div>' +
    '<div class="hist' + (open ? ' open' : '') + '" id="h' + p.customer_id + '">' +
      (open ? (HIST[p.customer_id] || '<div class="xs" style="color:var(--text3);padding:10px 0">Đang tải…</div>') : '') +
    '</div>';
}

function render(){
  if (!BOARD.length){
    $('wrap').innerHTML =
      '<div class="empty"><div class="ico"><svg viewBox="0 0 48 48" aria-hidden="true"><use href="#i-check"/></svg></div>' +
      '<h3>' + ($('q').value.trim() ? 'Không tìm thấy' : 'Không còn ai nợ') + '</h3>' +
      '<p>' + ($('q').value.trim()
        ? 'Thử từ khoá khác, hoặc bỏ trống ô tìm kiếm.'
        : 'Bấm <b>＋ Ghi nợ / Trừ nợ</b> để thêm giao dịch đầu tiên.') + '</p></div>';
    return;
  }
  $('wrap').innerHTML = BOARD.map(c =>
    '<div class="cogrp">' +
      '<div class="cohead">' +
        '<svg class="pill-ico" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-building"/></svg>' +
        '<span class="coname">' + esc(c.company_name) + '</span>' +
        '<span class="copeople">' + c.people.length + ' người</span>' +
        '<span class="cobal">' + fmt(Math.round(c.balance)) + '</span>' +
      '</div>' +
      c.people.map(pp => personRow(pp, c.company_id)).join('') +
    '</div>').join('');
}

/* ══════════ LỊCH SỬ 1 NGƯỜI ══════════ */
async function togglePerson(id){
  if (OPEN.has(id)){ OPEN.delete(id); render(); return; }
  OPEN.add(id);
  render();
  try{
    const d = await api('debt-entries', { qs: '&customer_id=' + id });
    (d.rows || []).forEach(r => { ENTRY[r.id] = Object.assign({}, r, { customer_id: id }); });
    const rows = (d.rows || []).map(r =>
      '<tr><td style="white-space:nowrap">' + dmy(r.entry_date) + '</td>' +
      '<td><span class="kpill ' + r.kind + '">' + (r.kind === 'credit' ? 'Trừ nợ' : 'Nợ') + '</span></td>' +
      '<td>' + (r.project ? esc(r.project) : '<span style="color:var(--text3)">—</span>') +
        (r.project_code ? ' <span class="xs" style="color:var(--text3)">· ' + esc(r.project_code) + '</span>' : '') + '</td>' +
      '<td class="hamt ' + r.kind + '">' + (r.kind === 'credit' ? '−' : '+') + fmt(Math.round(r.amount)) + '</td>' +
      '<td>' + (r.note ? esc(r.note) : '') + '</td>' +
      '<td style="text-align:right;white-space:nowrap">' +
        '<button class="hedit" onclick="event.stopPropagation();openEdit(' + r.id + ')" title="Sửa giao dịch">✎</button>' +
        '<button class="hdel" onclick="event.stopPropagation();delEntry(' + r.id + ',' + id + ')" title="Xoá giao dịch">✕</button></td></tr>').join('');
    HIST[id] = quickBar(id) + (rows
      ? '<div class="tbl-wrap" style="margin-top:10px"><table class="ht"><thead><tr>' +
        '<th>Ngày</th><th>Loại</th><th>Dự án</th>' +
        '<th class="amt" style="text-align:right">Số tiền</th><th>Ghi chú</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div class="xs" style="color:var(--text3);padding:10px 0">Chưa có giao dịch nào.</div>');
    const box = $('h' + id);
    if (box){ box.innerHTML = HIST[id]; const pj = $('qkProj' + id); if (pj) pj.focus(); }
  }catch(e){ toast(e.message, 'err'); }
}

/* ══════════ GHI NHANH NGAY TRÊN DÒNG NHÂN VIÊN ══════════
   Không phải mở hộp thoại, không phải chọn lại công ty / nhân viên.
   Lưu xong thanh vẫn ở đó để ghi tiếp khoản kế. */
function quickBar(id){
  const k = QKK[id] || 'debt';
  return '<div class="qk">' +
      '<div class="qkkind">' +
        '<button type="button" class="qkb debt'   + (k === 'debt'   ? ' on' : '') + '" id="qkD' + id + '" onclick="qkKind(' + id + ',\'debt\')">＋ Nợ</button>' +
        '<button type="button" class="qkb credit' + (k === 'credit' ? ' on' : '') + '" id="qkC' + id + '" onclick="qkKind(' + id + ',\'credit\')">− Trừ nợ</button>' +
      '</div>' +
      '<div class="ac">' +
        '<input type="text" id="qkProj' + id + '" autocomplete="off" placeholder="Dự án hoặc mã báo giá…" ' +
          'oninput="qkSuggest(' + id + ')" onfocus="qkSuggest(' + id + ')" ' +
          'onkeydown="if(event.key===\'Enter\'){event.preventDefault();var a=$(\'qkAmt' + id + '\');if(a)a.focus();}" />' +
        '<div class="acmenu" id="qkMenu' + id + '"></div>' +
        '<input type="hidden" id="qkCode' + id + '" />' +
      '</div>' +
      '<input type="text" class="qkamt" id="qkAmt' + id + '" inputmode="numeric" placeholder="Số tiền" ' +
        'oninput="qkHint(' + id + ')" onblur="qkBlur(' + id + ')" ' +
        'onkeydown="if(event.key===\'Enter\'){event.preventDefault();qkSave(' + id + ');}" />' +
      '<input type="date" id="qkDate' + id + '" value="' + todayStr() + '" />' +
      '<button class="qksave" id="qkBtn' + id + '" onclick="qkSave(' + id + ')">Lưu</button>' +
    '</div>' +
    '<div class="qkhint" id="qkHint' + id + '">Gõ tắt được: <b>2e6</b> = 2.000.000 · <b>35tr</b> · <b>500k</b> · Enter để lưu</div>';
}

function qkKind(id, k){
  QKK[id] = k;
  const d = $('qkD' + id), c = $('qkC' + id);
  if (d) d.classList.toggle('on', k === 'debt');
  if (c) c.classList.toggle('on', k === 'credit');
  const a = $('qkAmt' + id); if (a) a.focus();
}
function qkHint(id){
  const n = parseMoney($('qkAmt' + id).value);
  const h = $('qkHint' + id); if (!h) return;
  h.innerHTML = n
    ? ((QKK[id] === 'credit' ? 'Trừ nợ ' : 'Ghi nợ ') + fmt(n) + ' đ · Enter để lưu')
    : 'Gõ tắt được: <b>2e6</b> = 2.000.000 · <b>35tr</b> · <b>500k</b> · Enter để lưu';
}
function qkBlur(id){
  const el = $('qkAmt' + id); if (!el) return;
  const n = parseMoney(el.value);
  el.value = n ? fmt(n) : '';
  qkHint(id);
}
function qkSuggest(id){
  clearTimeout(qkTimer[id]);
  const el = $('qkProj' + id); if (!el) return;
  const q = el.value.trim();
  const code = $('qkCode' + id); if (code) code.value = '';
  const m = $('qkMenu' + id);
  if (q.length < 1){ if (m) m.classList.remove('open'); return; }
  qkTimer[id] = setTimeout(async () => {
    try{
      QKP[id] = await api('project-suggest', { qs: '&q=' + encodeURIComponent(q) });
      const mm = $('qkMenu' + id); if (!mm) return;
      if (!QKP[id].length){ mm.classList.remove('open'); return; }
      mm.innerHTML = QKP[id].map((pr, i) =>
        '<button type="button" class="acitem" onclick="qkPick(' + id + ',' + i + ')">' +
        (pr.code ? '<span class="cd">' + esc(pr.code) + '</span>' : '') + esc(pr.title || '') + '</button>').join('');
      mm.classList.add('open');
    }catch(e){ const mm = $('qkMenu' + id); if (mm) mm.classList.remove('open'); }
  }, 220);
}
function qkPick(id, i){
  const pr = (QKP[id] || [])[i]; if (!pr) return;
  $('qkProj' + id).value = pr.title || pr.code || '';
  $('qkCode' + id).value = pr.code || '';
  const m = $('qkMenu' + id); if (m) m.classList.remove('open');
  const a = $('qkAmt' + id); if (a) a.focus();
}
async function qkSave(id){
  const amt = parseMoney(($('qkAmt' + id) || {}).value);
  if (!amt) return toast('Nhập số tiền', 'err');
  const body = {
    company_id:   QKCO[id] || 0,
    customer_id:  id,
    project:      ($('qkProj' + id) || {}).value.trim(),
    project_code: ($('qkCode' + id) || {}).value.trim(),
    kind:         QKK[id] || 'debt',
    amount:       amt,
    entry_date:   ($('qkDate' + id) || {}).value || todayStr(),
    note:         ''
  };
  if (!body.company_id) return toast('Không xác định được công ty', 'err');
  const btn = $('qkBtn' + id); if (btn) btn.disabled = true;
  try{
    const d = await api('debt-add', { body });
    toast(d.message, 'ok');
    delete HIST[id];
    await load();
    if (OPEN.has(id)){ OPEN.delete(id); await togglePerson(id); }
  }catch(e){
    toast(e.message, 'err');
    const b = $('qkBtn' + id); if (b) b.disabled = false;
  }
}

async function delEntry(id, cus){
  if (!confirm('Xoá giao dịch này?')) return;
  try{
    await api('debt-delete', { body: { id } });
    delete HIST[cus];
    toast('Đã xoá giao dịch', 'ok');
    await load();
    if (OPEN.has(cus)){ OPEN.delete(cus); await togglePerson(cus); }
  }catch(e){ toast(e.message, 'err'); }
}

/* ══════════ THÊM GIAO DỊCH ══════════ */
async function loadRefs(){
  try{
    const [co, cu] = await Promise.all([api('companies'), api('customers')]);
    COMPANIES = (co.rows || co || []).filter(x => x && x.name);
    CONTACTS  = (cu.rows || cu || []).filter(x => x && x.name);
  }catch(e){ toast('Không tải được danh sách công ty / nhân viên: ' + e.message, 'err'); }
}

function openAdd(){
  EDIT_ID = 0;
  $('addTitle').textContent = 'Ghi nợ / Trừ nợ';
  $('addSub').textContent = 'Ngày ghi nhận tự động lấy hôm nay.';
  $('btnSaveAdd').textContent = 'Lưu giao dịch';
  KIND = 'debt'; setKind('debt');
  $('fCo').innerHTML = '<option value="">— Chọn công ty —</option>' +
    COMPANIES.map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('');
  $('fCus').innerHTML = '<option value="">— Chọn công ty trước —</option>';
  $('fProj').value = ''; $('fProjCode').value = '';
  $('fAmt').value = ''; $('amtHint').textContent = '';
  $('fNote').value = '';
  $('fDate').value = todayStr();
  $('addOv').classList.add('open');
  setTimeout(() => $('fCo').focus(), 60);
}
function closeAdd(){ $('addOv').classList.remove('open'); closeProj(); EDIT_ID = 0; }

/* Mở modal ở chế độ sửa 1 giao dịch đã ghi */
function openEdit(id){
  const r = ENTRY[id];
  if (!r) return toast('Không tìm thấy giao dịch', 'err');
  EDIT_ID = id;
  $('addTitle').textContent = 'Sửa giao dịch';
  $('addSub').textContent = 'Chỉnh lại thông tin rồi bấm Cập nhật.';
  $('btnSaveAdd').textContent = 'Cập nhật';

  $('fCo').innerHTML = '<option value="">— Chọn công ty —</option>' +
    COMPANIES.map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join('');
  $('fCo').value = String(r.company_id || '');
  coChanged();
  $('fCus').value = String(r.customer_id || '');

  $('fProj').value     = r.project || '';
  $('fProjCode').value = r.project_code || '';
  setKind(r.kind === 'credit' ? 'credit' : 'debt');
  $('fAmt').value = fmt(Math.round(Number(r.amount) || 0));
  amtInput();
  $('fDate').value = String(r.entry_date || todayStr()).slice(0, 10);
  $('fNote').value = r.note || '';

  $('addOv').classList.add('open');
  setTimeout(() => $('fAmt').focus(), 60);
}

/* Rời ô số tiền → viết lại thành con số đầy đủ có dấu phân cách */
function amtBlur(){
  const el = $('fAmt');
  const n  = parseMoney(el.value);
  el.value = n ? fmt(n) : '';
  amtInput();
}

function coChanged(){
  const id = Number($('fCo').value) || 0;
  const list = CONTACTS.filter(c => Number(c.company_id) === id);
  $('fCus').innerHTML = list.length
    ? '<option value="">— Chọn nhân viên —</option>' +
      list.map(c => '<option value="' + c.id + '">' + esc(c.name) + (c.dept ? ' · ' + esc(c.dept) : '') + '</option>').join('')
    : '<option value="">Công ty này chưa có nhân viên</option>';
}

function setKind(k){
  KIND = k;
  $('kDebt').classList.toggle('on', k === 'debt');
  $('kCredit').classList.toggle('on', k === 'credit');
}

const AMT_TIP = 'Gõ tắt được: <b>2e6</b> = 2.000.000 · <b>35tr</b> · <b>500k</b>';
function amtInput(){
  const n = parseMoney($('fAmt').value);
  $('amtHint').innerHTML = n ? (fmt(n) + ' đ') : AMT_TIP;
}

/* Gợi ý dự án */
function projInput(){
  clearTimeout(projTimer);
  const q = $('fProj').value.trim();
  $('fProjCode').value = '';
  if (q.length < 1){ closeProj(); return; }
  projTimer = setTimeout(async () => {
    try{
      PROJ = await api('project-suggest', { qs: '&q=' + encodeURIComponent(q) });
      PSEL = -1;
      const m = $('projMenu');
      if (!PROJ.length){ closeProj(); return; }
      m.innerHTML = PROJ.map((p, i) =>
        '<button type="button" class="acitem" onclick="pickProj(' + i + ')">' +
        (p.code ? '<span class="cd">' + esc(p.code) + '</span>' : '') + esc(p.title || '') + '</button>').join('');
      m.classList.add('open');
    }catch(e){ closeProj(); }
  }, 220);
}
function pickProj(i){
  const p = PROJ[i]; if (!p) return;
  $('fProj').value = p.title || p.code || '';
  $('fProjCode').value = p.code || '';
  closeProj();
  $('fAmt').focus();
}
function closeProj(){ document.querySelectorAll('.acmenu.open').forEach(m => m.classList.remove('open')); }

async function saveAdd(){
  const body = {
    company_id:   Number($('fCo').value) || 0,
    customer_id:  Number($('fCus').value) || 0,
    project:      $('fProj').value.trim(),
    project_code: $('fProjCode').value.trim(),
    kind:         KIND,
    amount:       parseMoney($('fAmt').value),
    entry_date:   $('fDate').value || todayStr(),
    note:         $('fNote').value.trim()
  };
  if (!body.company_id)  return toast('Chọn công ty', 'err');
  if (!body.customer_id) return toast('Chọn nhân viên', 'err');
  if (!body.amount)      return toast('Nhập số tiền', 'err');
  const btn = $('btnSaveAdd'); btn.disabled = true;
  const editing = EDIT_ID;
  const oldCus  = editing && ENTRY[editing] ? Number(ENTRY[editing].customer_id) : 0;
  try{
    if (editing) body.id = editing;
    const d = await api(editing ? 'debt-update' : 'debt-add', { body });
    toast(d.message, 'ok');
    closeAdd();
    delete HIST[body.customer_id];
    if (oldCus) delete HIST[oldCus];
    await load();
    // vẽ lại lịch sử đang mở để thấy ngay thay đổi
    for (const cus of [body.customer_id, oldCus]){
      if (cus && OPEN.has(cus)){ OPEN.delete(cus); await togglePerson(cus); }
    }
  }catch(e){ toast(e.message, 'err'); }
  btn.disabled = false;
}

/* ══════════ KHỞI ĐỘNG ══════════ */
document.addEventListener('click', e => {
  if (!e.target.closest || !e.target.closest('.ac')) closeProj();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ closeProj(); closeAdd(); }
});

async function boot(){
  paintUser();
  $('q').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(load, 300);
  });
  await Promise.all([load(), loadRefs()]);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
</html>
